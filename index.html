"", "src": "a/664.mp3"}, {"no": 665, "sp": "主人公", "text": "莉子は画面を\n見たまま、\n動かなくなった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/665.mp3"}, {"no": 666, "sp": "莉子", "text": "……こんなの", "kind": "丸", "ch": "転", "kg": "", "src": "a/666.mp3"}, {"no": 667, "sp": "莉子", "text": "同じ名前の\n人かも……", "kind": "丸", "ch": "転", "kg": "", "src": "a/667.mp3"}, {"no": 668, "sp": "柴田", "text": "写真も、\n同じですけど", "kind": "丸", "ch": "転", "kg": "", "src": "a/668.mp3"}, {"no": 669, "sp": "主人公", "text": "莉子の指先が、\n小さく震えていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/669.mp3"}, {"no": 670, "sp": "主人公", "text": "莉子は、画面と\n俺の顔を、\n何度も見比べた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/670.mp3"}, {"no": 671, "sp": "莉子", "text": "正岡建設の\n社長が……", "kind": "丸", "ch": "転", "kg": "", "src": "a/671.mp3"}, {"no": 672, "sp": "莉子", "text": "お兄ちゃん……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/672.mp3"}, {"no": 673, "sp": "主人公", "text": "莉子の顔色が、\nみるみる変わった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/673.mp3"}, {"no": 674, "sp": "莉子の友人", "text": "莉子、\nさっき、\nお兄さんに何を……", "kind": "丸", "ch": "転", "kg": "", "src": "a/674.mp3"}, {"no": 675, "sp": "主人公", "text": "周りの招待客が、\nひそひそと\n話し始める。", "kind": "四角", "ch": "転", "kg": "", "src": "a/675.mp3"}, {"no": 676, "sp": "招待客", "text": "お兄さん？", "kind": "丸", "ch": "転", "kg": "", "src": "a/676.mp3"}, {"no": 677, "sp": "招待客", "text": "さっき、\n知らない人って……", "kind": "丸", "ch": "転", "kg": "", "src": "a/677.mp3"}, {"no": 678, "sp": "招待客", "text": "自分のお兄さんに、\nワインを\nかけたの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/678.mp3"}, {"no": 679, "sp": "主人公", "text": "莉子は、\n拓海の顔を見た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/679.mp3"}, {"no": 680, "sp": "莉子", "text": "拓海、\n知ってたの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/680.mp3"}, {"no": 681, "sp": "拓海", "text": "知ってた", "kind": "丸", "ch": "転", "kg": "", "src": "a/681.mp3"}, {"no": 682, "sp": "拓海", "text": "付き合って\nすぐの頃に、", "kind": "丸", "ch": "転", "kg": "", "src": "a/682.mp3"}, {"no": 683, "sp": "拓海", "text": "莉子の\nおじいさんの家で、\n写真を見たんだ", "kind": "丸", "ch": "転", "kg": "", "src": "a/683.mp3"}, {"no": 684, "sp": "莉子", "text": "じゃあ、\nなんで\n言わなかったの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/684.mp3"}, {"no": 685, "sp": "莉子", "text": "私のこと、\n試してたの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/685.mp3"}, {"no": 686, "sp": "拓海", "text": "違う", "kind": "丸", "ch": "転", "kg": "", "src": "a/686.mp3"}, {"no": 687, "sp": "拓海", "text": "社長の妹だから\n付き合ったと、", "kind": "丸", "ch": "転", "kg": "", "src": "a/687.mp3"}, {"no": 688, "sp": "拓海", "text": "思われたく\nなかったからだ", "kind": "丸", "ch": "転", "kg": "", "src": "a/688.mp3"}, {"no": 689, "sp": "拓海", "text": "今日、社長の挨拶の\nあとで、\n話すつもりだった", "kind": "丸", "ch": "転", "kg": "", "src": "a/689.mp3"}, {"no": 690, "sp": "莉子", "text": "何それ……", "kind": "丸", "ch": "転", "kg": "", "src": "a/690.mp3"}, {"no": 691, "sp": "莉子", "text": "そんな大事なことを\n隠してたのは、\nそっちでしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/691.mp3"}, {"no": 692, "sp": "莉子", "text": "私は\n知らなかったの", "kind": "丸", "ch": "転", "kg": "", "src": "a/692.mp3"}, {"no": 693, "sp": "莉子", "text": "知ってたら、\nあんなこと\nしなかった", "kind": "丸", "ch": "転", "kg": "", "src": "a/693.mp3"}, {"no": 694, "sp": "莉子", "text": "だから、\n仕方ないじゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/694.mp3"}, {"no": 695, "sp": "拓海", "text": "知らなかったら、\nワインをかけて\nいいのか？", "kind": "丸", "ch": "転", "kg": "", "src": "a/695.mp3"}, {"no": 696, "sp": "拓海", "text": "ここにいる人を、\n消えたことにして\nいいのか？", "kind": "丸", "ch": "転", "kg": "", "src": "a/696.mp3"}, {"no": 697, "sp": "主人公", "text": "拓海の声は、\n震えていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/697.mp3"}, {"no": 698, "sp": "主人公", "text": "莉子は、\n唇をかんで黙る。", "kind": "四角", "ch": "転", "kg": "", "src": "a/698.mp3"}, {"no": 699, "sp": "主人公", "text": "そこへ、\n騒ぎを聞きつけた\n母が来た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/699.mp3"}, {"no": 700, "sp": "主人公", "text": "母は留袖の裾を\n押さえながら、\n早足で近づいてくる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/700.mp3"}, {"no": 701, "sp": "京子", "text": "何の騒ぎ？", "kind": "丸", "ch": "転", "kg": "", "src": "a/701.mp3"}, {"no": 702, "sp": "京子", "text": "もうすぐ、\n式が始まるのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/702.mp3"}, {"no": 703, "sp": "主人公", "text": "母は俺を見るなり、\n眉をつり上げた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/703.mp3"}, {"no": 704, "sp": "京子", "text": "蓮", "kind": "丸", "ch": "転", "kg": "", "src": "a/704.mp3"}, {"no": 705, "sp": "京子", "text": "来ないでって、\n言ったでしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/705.mp3"}, {"no": 706, "sp": "京子", "text": "どうして、\nあんたがここに\nいるのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/706.mp3"}, {"no": 707, "sp": "京子", "text": "しかも、\n何なの、その格好", "kind": "丸", "ch": "転", "kg": "", "src": "a/707.mp3"}, {"no": 708, "sp": "京子", "text": "まさか、\nその格好で\n披露宴に出る気？", "kind": "丸", "ch": "転", "kg": "", "src": "a/708.mp3"}, {"no": 709, "sp": "主人公", "text": "母は、周りの招待客に\n頭を下げてみせた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/709.mp3"}, {"no": 710, "sp": "京子", "text": "すみません、\nお騒がせして", "kind": "丸", "ch": "転", "kg": "", "src": "a/710.mp3"}, {"no": 711, "sp": "京子", "text": "すぐに、\n帰らせますから", "kind": "丸", "ch": "転", "kg": "", "src": "a/711.mp3"}, {"no": 712, "sp": "主人公", "text": "それから、\n拓海に向き直る。", "kind": "四角", "ch": "転", "kg": "", "src": "a/712.mp3"}, {"no": 713, "sp": "京子", "text": "ごめんなさいね、\n拓海さん", "kind": "丸", "ch": "転", "kg": "", "src": "a/713.mp3"}, {"no": 714, "sp": "京子", "text": "この子が勝手に\n来たのが悪いのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/714.mp3"}, {"no": 715, "sp": "京子", "text": "来るなって、\n言ってあったんだから", "kind": "丸", "ch": "転", "kg": "", "src": "a/715.mp3"}, {"no": 716, "sp": "拓海", "text": "お義母さん", "kind": "丸", "ch": "転", "kg": "", "src": "a/716.mp3"}, {"no": 717, "sp": "拓海", "text": "お兄さんが\n社長だって、\n知ってたんですか？", "kind": "丸", "ch": "転", "kg": "", "src": "a/717.mp3"}, {"no": 718, "sp": "京子", "text": "社長？", "kind": "丸", "ch": "転", "kg": "", "src": "a/718.mp3"}, {"no": 719, "sp": "主人公", "text": "母は、\n口の端で笑った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/719.mp3"}, {"no": 720, "sp": "京子", "text": "会社って言っても、\nどうせ小さな\nところでしょう", "kind": "丸", "ch": "転", "kg": "", "src": "a/720.mp3"}, {"no": 721, "sp": "京子", "text": "現場で小金を\n稼いでるのは\n知ってるわよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/721.mp3"}, {"no": 722, "sp": "京子", "text": "でも、\n中卒は中卒でしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/722.mp3"}, {"no": 723, "sp": "主人公", "text": "招待客の何人かが、\n眉をひそめた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/723.mp3"}, {"no": 724, "sp": "柴田", "text": "……社長、\n言わせといて\nいいんですか", "kind": "丸", "ch": "転", "kg": "", "src": "a/724.mp3"}, {"no": 725, "sp": "主人公", "text": "いい", "kind": "丸", "ch": "転", "kg": "", "src": "a/725.mp3"}, {"no": 726, "sp": "主人公", "text": "母の口から\nその言葉を聞いても、\n腹は立たなかった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/726.mp3"}, {"no": 727, "sp": "主人公", "text": "俺は柴田さんの\n上着の前を合わせて、\n黙っていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/727.mp3"}, {"no": 728, "sp": "主人公", "text": "拓海は、受付のほうへ\n歩いていく。", "kind": "四角", "ch": "転", "kg": "", "src": "a/728.mp3"}, {"no": 729, "sp": "主人公", "text": "戻ってきた拓海は、\n席次表を\n手にしていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/729.mp3"}, {"no": 730, "sp": "主人公", "text": "拓海はそれを、\n母の前に広げる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/730.mp3"}, {"no": 731, "sp": "主人公", "text": "周りの招待客も、\n席次表を\nのぞき込んだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/731.mp3"}, {"no": 732, "sp": "拓海", "text": "ここを\n見てください", "kind": "丸", "ch": "転", "kg": "", "src": "a/732.mp3"}, {"no": 733, "sp": "主人公", "text": "拓海が指さしたのは、\n主賓の欄だ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/733.mp3"}, {"no": 734, "sp": "主人公", "text": "そこには、\n正岡建設\n代表取締役とある。", "kind": "四角", "ch": "転", "kg": "", "src": "a/734.mp3"}, {"no": 735, "sp": "拓海", "text": "この主賓が、\n社長です", "kind": "丸", "ch": "転", "kg": "", "src": "a/735.mp3"}, {"no": 736, "sp": "拓海", "text": "お義母さんたちが、\nロビーで\n追い出したのは", "kind": "丸", "ch": "転", "kg": "", "src": "a/736.mp3"}, {"no": 737, "sp": "拓海", "text": "僕が主賓として\nお招きした方です", "kind": "丸", "ch": "転", "kg": "", "src": "a/737.mp3"}, {"no": 738, "sp": "主人公", "text": "母は、席次表と\n俺の顔を\n見比べた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/738.mp3"}, {"no": 739, "sp": "主人公", "text": "母の口が、\n半分開いたまま\n止まる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/739.mp3"}, {"no": 740, "sp": "京子", "text": "主賓……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/740.mp3"}, {"no": 741, "sp": "主人公", "text": "母の目が、\n席次表の上を\n何度も往復した。", "kind": "四角", "ch": "転", "kg": "", "src": "a/741.mp3"}, {"no": 742, "sp": "京子", "text": "そんな話、\n聞いてないわよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/742.mp3"}, {"no": 743, "sp": "拓海", "text": "言っていませんでした", "kind": "丸", "ch": "転", "kg": "", "src": "a/743.mp3"}, {"no": 744, "sp": "拓海", "text": "僕が、\n自分の口で\n話すつもりでしたから", "kind": "丸", "ch": "転", "kg": "", "src": "a/744.mp3"}, {"no": 745, "sp": "京子", "text": "だって、\nこの子は……", "kind": "丸", "ch": "転", "kg": "", "src": "a/745.mp3"}, {"no": 746, "sp": "主人公", "text": "母は、その先を\n言わなかった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/746.mp3"}, {"no": 747, "sp": "招待客", "text": "主賓の方を、\n追い出したの……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/747.mp3"}, {"no": 748, "sp": "招待客", "text": "新婦さんの\nお兄さんなのに？", "kind": "丸", "ch": "転", "kg": "", "src": "a/748.mp3"}, {"no": 749, "sp": "主人公", "text": "そこへ、\n拓海の両親が\nやってきた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/749.mp3"}, {"no": 750, "sp": "主人公", "text": "拓海の父の\n正彦さんと、\n母の典子さんだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/750.mp3"}, {"no": 751, "sp": "主人公", "text": "二人とも\n高校で教えていると、\n母が自慢していた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/751.mp3"}, {"no": 752, "sp": "正彦", "text": "拓海、\nそろそろ始まるぞ", "kind": "丸", "ch": "転", "kg": "", "src": "a/752.mp3"}, {"no": 753, "sp": "典子", "text": "どうしたの、\nその顔", "kind": "丸", "ch": "転", "kg": "", "src": "a/753.mp3"}, {"no": 754, "sp": "主人公", "text": "典子さんは、\n拓海の赤い目を見て、\nそれから俺を見た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/754.mp3"}, {"no": 755, "sp": "主人公", "text": "濡れたシャツに、\n典子さんの目が\n止まる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/755.mp3"}, {"no": 756, "sp": "典子", "text": "こちらの方は？", "kind": "丸", "ch": "転", "kg": "", "src": "a/756.mp3"}, {"no": 757, "sp": "拓海", "text": "新婦のお兄さんで、", "kind": "丸", "ch": "転", "kg": "", "src": "a/757.mp3"}, {"no": 758, "sp": "拓海", "text": "僕の命の恩人の、\n社長だよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/758.mp3"}, {"no": 759, "sp": "典子", "text": "あなたが\nいつも話してる、\nあの社長さん？", "kind": "丸", "ch": "転", "kg": "", "src": "a/759.mp3"}, {"no": 760, "sp": "拓海", "text": "そうだよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/760.mp3"}, {"no": 761, "sp": "主人公", "text": "典子さんが、\n息をのんだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/761.mp3"}, {"no": 762, "sp": "拓海", "text": "母さん", "kind": "丸", "ch": "転", "kg": "", "src": "a/762.mp3"}, {"no": 763, "sp": "拓海", "text": "大恩人のお兄さんが\n亡くなったって……", "kind": "丸", "ch": "転", "kg": "", "src": "a/763.mp3"}, {"no": 764, "sp": "拓海", "text": "母さんたち、\nそう聞かされてたの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/764.mp3"}, {"no": 765, "sp": "典子", "text": "ええ", "kind": "丸", "ch": "転", "kg": "", "src": "a/765.mp3"}, {"no": 766, "sp": "典子", "text": "控室で、\n新婦のお母様から\n伺ったのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/766.mp3"}, {"no": 767, "sp": "典子", "text": "上のお子さんは、\nご病気で\nもういないって", "kind": "丸", "ch": "転", "kg": "", "src": "a/767.mp3"}, {"no": 768, "sp": "典子", "text": "私、お気の毒にって、\n手を握ったのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/768.mp3"}, {"no": 769, "sp": "主人公", "text": "典子さんは、\n母のほうを見た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/769.mp3"}, {"no": 770, "sp": "典子", "text": "あれは、\nどういう意味だったん\nですか？", "kind": "丸", "ch": "転", "kg": "", "src": "a/770.mp3"}, {"no": 771, "sp": "主人公", "text": "母は、\nすぐに答えなかった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/771.mp3"}, {"no": 772, "sp": "正彦", "text": "白木さん", "kind": "丸", "ch": "転", "kg": "", "src": "a/772.mp3"}, {"no": 773, "sp": "正彦", "text": "ここにいらっしゃる\n息子さんを、", "kind": "丸", "ch": "転", "kg": "", "src": "a/773.mp3"}, {"no": 774, "sp": "正彦", "text": "もういないと、\nおっしゃったん\nですか？", "kind": "丸", "ch": "転", "kg": "", "src": "a/774.mp3"}, {"no": 775, "sp": "主人公", "text": "正彦さんの声は、\n静かだった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/775.mp3"}, {"no": 776, "sp": "京子", "text": "いないのと\n同じなんです", "kind": "丸", "ch": "転", "kg": "", "src": "a/776.mp3"}, {"no": 777, "sp": "京子", "text": "家を出て、\nずっと連絡も\nよこさない子で", "kind": "丸", "ch": "転", "kg": "", "src": "a/777.mp3"}, {"no": 778, "sp": "京子", "text": "私たちも、\nどこで何をしてるのか\n知らなくて", "kind": "丸", "ch": "転", "kg": "", "src": "a/778.mp3"}, {"no": 779, "sp": "拓海", "text": "さっきは、\n現場で稼いでるのは\n知ってるって", "kind": "丸", "ch": "転", "kg": "", "src": "a/779.mp3"}, {"no": 780, "sp": "拓海", "text": "言ってましたよね", "kind": "丸", "ch": "転", "kg": "", "src": "a/780.mp3"}, {"no": 781, "sp": "京子", "text": "それは……", "kind": "丸", "ch": "転", "kg": "", "src": "a/781.mp3"}, {"no": 782, "sp": "主人公", "text": "母の目が、\n泳いだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/782.mp3"}, {"no": 783, "sp": "主人公", "text": "親族の控室から、\n佳代おばさんが\n出てきた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/783.mp3"}, {"no": 784, "sp": "佳代", "text": "連絡なら、\n毎日来てるわよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/784.mp3"}, {"no": 785, "sp": "主人公", "text": "佳代おばさんは、\nスマホの画面を\n典子さんに見せた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/785.mp3"}, {"no": 786, "sp": "佳代", "text": "ほら", "kind": "丸", "ch": "転", "kg": "", "src": "a/786.mp3"}, {"no": 787, "sp": "佳代", "text": "今朝だって、\n今から行くって\n連絡をくれたの", "kind": "丸", "ch": "転", "kg": "", "src": "a/787.mp3"}, {"no": 788, "sp": "主人公", "text": "画面の一番上に、\n今朝の俺の\nLINEが出ている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/788.mp3"}, {"no": 789, "sp": "典子", "text": "まあ……", "kind": "丸", "ch": "転", "kg": "", "src": "a/789.mp3"}, {"no": 790, "sp": "京子", "text": "佳代さんは、\n黙ってて", "kind": "丸", "ch": "転", "kg": "", "src": "a/790.mp3"}, {"no": 791, "sp": "佳代", "text": "黙らないわよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/791.mp3"}, {"no": 792, "sp": "佳代", "text": "お義姉さん、\n人の親として\n恥ずかしくないの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/792.mp3"}, {"no": 793, "sp": "典子", "text": "白木さん", "kind": "丸", "ch": "転", "kg": "", "src": "a/793.mp3"}, {"no": 794, "sp": "典子", "text": "嘘を、\nおっしゃったんですね", "kind": "丸", "ch": "転", "kg": "", "src": "a/794.mp3"}, {"no": 795, "sp": "京子", "text": "嘘だなんて……", "kind": "丸", "ch": "転", "kg": "", "src": "a/795.mp3"}, {"no": 796, "sp": "京子", "text": "私はただ、\n莉子のためを\n思って……", "kind": "丸", "ch": "転", "kg": "", "src": "a/796.mp3"}, {"no": 797, "sp": "正彦", "text": "莉子さんのためなら、", "kind": "丸", "ch": "転", "kg": "", "src": "a/797.mp3"}, {"no": 798, "sp": "正彦", "text": "お兄さんを\nいないことにしても\nいいと？", "kind": "丸", "ch": "転", "kg": "", "src": "a/798.mp3"}, {"no": 799, "sp": "主人公", "text": "母の声が、\nそこで途切れた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/799.mp3"}, {"no": 800, "sp": "主人公", "text": "控室のほうから、\n杖をついた\nじいちゃんが来た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/800.mp3"}, {"no": 801, "sp": "源一", "text": "蓮", "kind": "丸", "ch": "転", "kg": "", "src": "a/801.mp3"}, {"no": 802, "sp": "主人公", "text": "じいちゃんは、\n濡れた俺の髪を見て、\n顔色を変えた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/802.mp3"}, {"no": 803, "sp": "源一", "text": "その頭は、\nどうした？", "kind": "丸", "ch": "転", "kg": "", "src": "a/803.mp3"}, {"no": 804, "sp": "主人公", "text": "何でもない", "kind": "丸", "ch": "転", "kg": "", "src": "a/804.mp3"}, {"no": 805, "sp": "源一", "text": "何でもないわけ\nあるか", "kind": "丸", "ch": "転", "kg": "", "src": "a/805.mp3"}, {"no": 806, "sp": "主人公", "text": "じいちゃんは、\n莉子が持っている\n空のグラスを見た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/806.mp3"}, {"no": 807, "sp": "源一", "text": "ワインをかけて\n追い出したのは、\nお前か？", "kind": "丸", "ch": "転", "kg": "", "src": "a/807.mp3"}, {"no": 808, "sp": "主人公", "text": "じいちゃんは、\n莉子をにらんだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/808.mp3"}, {"no": 809, "sp": "主人公", "text": "莉子は、グラスを\n背中に隠した。", "kind": "四角", "ch": "転", "kg": "", "src": "a/809.mp3"}, {"no": 810, "sp": "源一", "text": "京子", "kind": "丸", "ch": "転", "kg": "", "src": "a/810.mp3"}, {"no": 811, "sp": "源一", "text": "わしの孫を、\n勝手に消すな", "kind": "丸", "ch": "転", "kg": "", "src": "a/811.mp3"}, {"no": 812, "sp": "主人公", "text": "じいちゃんは、\n拓海のほうを向いた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/812.mp3"}, {"no": 813, "sp": "源一", "text": "拓海くん、\nすまんな", "kind": "丸", "ch": "転", "kg": "", "src": "a/813.mp3"}, {"no": 814, "sp": "源一", "text": "うちの者が、\nとんだことを", "kind": "丸", "ch": "転", "kg": "", "src": "a/814.mp3"}, {"no": 815, "sp": "拓海", "text": "いえ", "kind": "丸", "ch": "転", "kg": "", "src": "a/815.mp3"}, {"no": 816, "sp": "源一", "text": "蓮が15で\n働きに出た日を、\nわしは覚えとる", "kind": "丸", "ch": "転", "kg": "", "src": "a/816.mp3"}, {"no": 817, "sp": "主人公", "text": "母が、\n1歩下がった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/817.mp3"}, {"no": 818, "sp": "莉子", "text": "だって、\nお母さんが\n言ったのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/818.mp3"}, {"no": 819, "sp": "莉子", "text": "消えたことに\nしてって", "kind": "丸", "ch": "転", "kg": "", "src": "a/819.mp3"}, {"no": 820, "sp": "莉子", "text": "私は、\n言われた通りに\nしただけ", "kind": "丸", "ch": "転", "kg": "", "src": "a/820.mp3"}, {"no": 821, "sp": "主人公", "text": "莉子は、\n母を指さした。", "kind": "四角", "ch": "転", "kg": "", "src": "a/821.mp3"}, {"no": 822, "sp": "京子", "text": "何言ってるの", "kind": "丸", "ch": "転", "kg": "", "src": "a/822.mp3"}, {"no": 823, "sp": "京子", "text": "中卒の兄なんて\n恥ずかしいって、", "kind": "丸", "ch": "転", "kg": "", "src": "a/823.mp3"}, {"no": 824, "sp": "京子", "text": "あんたが\n言い出したんじゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/824.mp3"}, {"no": 825, "sp": "京子", "text": "お兄ちゃんがいたら\n結婚できないって、\n泣いてたでしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/825.mp3"}, {"no": 826, "sp": "莉子", "text": "泣いてない", "kind": "丸", "ch": "転", "kg": "", "src": "a/826.mp3"}, {"no": 827, "sp": "莉子", "text": "お母さんだって、\n言ったでしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/827.mp3"}, {"no": 828, "sp": "莉子", "text": "先生の家に\n中卒の身内がいたら、\n結婚が壊れるって", "kind": "丸", "ch": "転", "kg": "", "src": "a/828.mp3"}, {"no": 829, "sp": "京子", "text": "私は、\nあんたのためを\n思って……", "kind": "丸", "ch": "転", "kg": "", "src": "a/829.mp3"}, {"no": 830, "sp": "莉子", "text": "私のせいに\nしないでよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/830.mp3"}, {"no": 831, "sp": "京子", "text": "あんたが、\nワインなんか\nかけるからでしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/831.mp3"}, {"no": 832, "sp": "莉子", "text": "お母さんが、\n追い返せって\n言ったんじゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/832.mp3"}, {"no": 833, "sp": "主人公", "text": "二人の後ろで、\n父は黙って\n床を見ている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/833.mp3"}, {"no": 834, "sp": "京子", "text": "お父さんも、\n賛成したわよね？", "kind": "丸", "ch": "転", "kg": "", "src": "a/834.mp3"}, {"no": 835, "sp": "京子", "text": "それでいいって、\n言ったじゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/835.mp3"}, {"no": 836, "sp": "和夫", "text": "俺は、\n何も言ってない", "kind": "丸", "ch": "転", "kg": "", "src": "a/836.mp3"}, {"no": 837, "sp": "主人公", "text": "父はぼそりと言って、\n目をそらした。", "kind": "四角", "ch": "転", "kg": "", "src": "a/837.mp3"}, {"no": 838, "sp": "京子", "text": "お父さん！", "kind": "丸", "ch": "転", "kg": "", "src": "a/838.mp3"}, {"no": 839, "sp": "主人公", "text": "父は、\n顔を上げなかった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/839.mp3"}, {"no": 840, "sp": "主人公", "text": "招待客が、\n遠巻きにこちらを\n見ていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/840.mp3"}, {"no": 841, "sp": "招待客", "text": "身内で、\n押しつけ合ってる……", "kind": "丸", "ch": "転", "kg": "", "src": "a/841.mp3"}, {"no": 842, "sp": "招待客", "text": "お兄さんの前で、\nよくやるわね", "kind": "丸", "ch": "転", "kg": "", "src": "a/842.mp3"}, {"no": 843, "sp": "佳代", "text": "いいかげんにしなさい", "kind": "丸", "ch": "転", "kg": "", "src": "a/843.mp3"}, {"no": 844, "sp": "主人公", "text": "佳代おばさんの声が、\n2人を黙らせる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/844.mp3"}, {"no": 845, "sp": "佳代", "text": "言い合う前に、\n莉子に\n言うことがあるでしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/845.mp3"}, {"no": 846, "sp": "佳代", "text": "お義姉さん", "kind": "丸", "ch": "転", "kg": "", "src": "a/846.mp3"}, {"no": 847, "sp": "主人公", "text": "母は、\n口をつぐんだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/847.mp3"}, {"no": 848, "sp": "主人公", "text": "佳代おばさんは、\n莉子に向き直った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/848.mp3"}, {"no": 849, "sp": "佳代", "text": "莉子", "kind": "丸", "ch": "転", "kg": "", "src": "a/849.mp3"}, {"no": 850, "sp": "佳代", "text": "あんたの、\n中学から大学までの\n学費", "kind": "丸", "ch": "転", "kg": "", "src": "a/850.mp3"}, {"no": 851, "sp": "佳代", "text": "それと、\n下宿代", "kind": "丸", "ch": "転", "kg": "", "src": "a/851.mp3"}, {"no": 852, "sp": "佳代", "text": "合わせて\n1200万", "kind": "丸", "ch": "転", "kg": "", "src": "a/852.mp3"}, {"no": 853, "sp": "佳代", "text": "全部、蓮が\n17の時から働いて、\n出したのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/853.mp3"}, {"no": 854, "sp": "佳代", "text": "毎月、\n振り込んだって、\nこの子から聞いてたの", "kind": "丸", "ch": "転", "kg": "", "src": "a/854.mp3"}, {"no": 855, "sp": "主人公", "text": "招待客の間から、\n小さな声が漏れた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/855.mp3"}, {"no": 856, "sp": "招待客", "text": "1200万……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/856.mp3"}, {"no": 857, "sp": "莉子の友人", "text": "え……", "kind": "丸", "ch": "転", "kg": "", "src": "a/857.mp3"}, {"no": 858, "sp": "莉子", "text": "嘘", "kind": "丸", "ch": "転", "kg": "", "src": "a/858.mp3"}, {"no": 859, "sp": "莉子", "text": "お父さんが\n出したって、", "kind": "丸", "ch": "転", "kg": "", "src": "a/859.mp3"}, {"no": 860, "sp": "莉子", "text": "お母さんが……", "kind": "丸", "ch": "転", "kg": "", "src": "a/860.mp3"}, {"no": 861, "sp": "主人公", "text": "莉子は、\n母を見た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/861.mp3"}, {"no": 862, "sp": "主人公", "text": "母は、\n目をそらした。", "kind": "四角", "ch": "転", "kg": "", "src": "a/862.mp3"}, {"no": 863, "sp": "佳代", "text": "私立の中学の\n制服も、", "kind": "丸", "ch": "転", "kg": "", "src": "a/863.mp3"}, {"no": 864, "sp": "佳代", "text": "高校の塾代も、", "kind": "丸", "ch": "転", "kg": "", "src": "a/864.mp3"}, {"no": 865, "sp": "佳代", "text": "大学の下宿の\n敷金もよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/865.mp3"}, {"no": 866, "sp": "佳代", "text": "成人式の\n振袖もね", "kind": "丸", "ch": "転", "kg": "", "src": "a/866.mp3"}, {"no": 867, "sp": "佳代", "text": "あんたが、\nお金で困らずに\nすんだのは", "kind": "丸", "ch": "転", "kg": "", "src": "a/867.mp3"}, {"no": 868, "sp": "佳代", "text": "誰のおかげだと\n思ってるの", "kind": "丸", "ch": "転", "kg": "", "src": "a/868.mp3"}, {"no": 869, "sp": "莉子", "text": "お父さん", "kind": "丸", "ch": "転", "kg": "", "src": "a/869.mp3"}, {"no": 870, "sp": "莉子", "text": "お父さんが\n払ったんだよね？", "kind": "丸", "ch": "転", "kg": "", "src": "a/870.mp3"}, {"no": 871, "sp": "莉子", "text": "私、卒業式の日に、\nお礼言ったよね？", "kind": "丸", "ch": "転", "kg": "", "src": "a/871.mp3"}, {"no": 872, "sp": "莉子", "text": "高校のとき、\n塾に行きたいって\n言ったら", "kind": "丸", "ch": "転", "kg": "", "src": "a/872.mp3"}, {"no": 873, "sp": "莉子", "text": "次の月から、\n行けたよね", "kind": "丸", "ch": "転", "kg": "", "src": "a/873.mp3"}, {"no": 874, "sp": "莉子", "text": "あれも……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/874.mp3"}, {"no": 875, "sp": "主人公", "text": "父は長いこと、\n黙っていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/875.mp3"}, {"no": 876, "sp": "京子", "text": "お父さん、\n余計なこと\n言わないで", "kind": "丸", "ch": "転", "kg": "", "src": "a/876.mp3"}, {"no": 877, "sp": "和夫", "text": "俺の給料で、", "kind": "丸", "ch": "転", "kg": "", "src": "a/877.mp3"}, {"no": 878, "sp": "和夫", "text": "あんな学費が、\n出せるわけないだろう", "kind": "丸", "ch": "転", "kg": "", "src": "a/878.mp3"}, {"no": 879, "sp": "和夫", "text": "下宿の仕送りも、\n蓮の金だ", "kind": "丸", "ch": "転", "kg": "", "src": "a/879.mp3"}, {"no": 880, "sp": "和夫", "text": "俺は、\n母さんに言われて、\n黙ってたんだ", "kind": "丸", "ch": "転", "kg": "", "src": "a/880.mp3"}, {"no": 881, "sp": "京子", "text": "なんで今、\nそんなこと言うのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/881.mp3"}, {"no": 882, "sp": "和夫", "text": "もう、\n黙っていられん", "kind": "丸", "ch": "転", "kg": "", "src": "a/882.mp3"}, {"no": 883, "sp": "効果音", "text": "ガシャン", "kind": "", "ch": "転", "kg": "", "wait": 0.5}, {"no": 884, "sp": "主人公", "text": "莉子の手から\nグラスが落ちて、\n床で割れた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/884.mp3"}, {"no": 885, "sp": "莉子", "text": "嘘……", "kind": "丸", "ch": "転", "kg": "", "src": "a/885.mp3"}, {"no": 886, "sp": "莉子", "text": "だって、\nお兄ちゃんは、\n中学しか……", "kind": "丸", "ch": "転", "kg": "", "src": "a/886.mp3"}, {"no": 887, "sp": "主人公", "text": "莉子の声が、\n途中で止まった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/887.mp3"}, {"no": 888, "sp": "莉子", "text": "お母さん", "kind": "丸", "ch": "転", "kg": "", "src": "a/888.mp3"}, {"no": 889, "sp": "莉子", "text": "なんで、\n黙ってたの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/889.mp3"}, {"no": 890, "sp": "京子", "text": "あんたに、\n気をつかわせたく\nなかったのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/890.mp3"}, {"no": 891, "sp": "京子", "text": "お兄ちゃんのお金で\n大学に行ったなんて、", "kind": "丸", "ch": "転", "kg": "", "src": "a/891.mp3"}, {"no": 892, "sp": "京子", "text": "あんたも、\n嫌でしょ？", "kind": "丸", "ch": "転", "kg": "", "src": "a/892.mp3"}, {"no": 893, "sp": "主人公", "text": "莉子は、\n答えられなかった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/893.mp3"}, {"no": 894, "sp": "莉子の友人", "text": "え、\n莉子の学費、\nお兄さんが……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/894.mp3"}, {"no": 895, "sp": "莉子の友人", "text": "それで、\nワインかけたの……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/895.mp3"}, {"no": 896, "sp": "主人公", "text": "割れたグラスの横で、\n莉子は俺を見ていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/896.mp3"}, {"no": 897, "sp": "主人公", "text": "俺は、\n何も言わない。", "kind": "四角", "ch": "転", "kg": "", "src": "a/897.mp3"}, {"no": 898, "sp": "主人公", "text": "正彦さんが、\n静かに口を開いた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/898.mp3"}, {"no": 899, "sp": "正彦", "text": "白木さん", "kind": "丸", "ch": "転", "kg": "", "src": "a/899.mp3"}, {"no": 900, "sp": "正彦", "text": "式の費用は、\nそちらのお宅で\n持つと伺っていました", "kind": "丸", "ch": "転", "kg": "", "src": "a/900.mp3"}, {"no": 901, "sp": "正彦", "text": "それも、\nもしかして……", "kind": "丸", "ch": "転", "kg": "", "src": "a/901.mp3"}, {"no": 902, "sp": "主人公", "text": "父は、\n正彦さんに\n頭を下げた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/902.mp3"}, {"no": 903, "sp": "和夫", "text": "その600万も、\n蓮に出させました", "kind": "丸", "ch": "転", "kg": "", "src": "a/903.mp3"}, {"no": 904, "sp": "主人公", "text": "典子さんが、\n口に手を当てた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/904.mp3"}, {"no": 905, "sp": "典子", "text": "そんな……", "kind": "丸", "ch": "転", "kg": "", "src": "a/905.mp3"}, {"no": 906, "sp": "典子", "text": "式場の見学のとき、", "kind": "丸", "ch": "転", "kg": "", "src": "a/906.mp3"}, {"no": 907, "sp": "典子", "text": "お支払いは\n任せてって、\nお母様が", "kind": "丸", "ch": "転", "kg": "", "src": "a/907.mp3"}, {"no": 908, "sp": "主人公", "text": "典子さんは、\n母を見たまま、\n首を横に振った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/908.mp3"}, {"no": 909, "sp": "京子", "text": "何よ", "kind": "丸", "ch": "転", "kg": "", "src": "a/909.mp3"}, {"no": 910, "sp": "京子", "text": "この子は、\n稼いでるんだから", "kind": "丸", "ch": "転", "kg": "", "src": "a/910.mp3"}, {"no": 911, "sp": "京子", "text": "家族のために\n出すのは、\n当たり前でしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/911.mp3"}, {"no": 912, "sp": "主人公", "text": "母が、\n声を荒げた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/912.mp3"}, {"no": 913, "sp": "京子", "text": "それの\n何がいけないの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/913.mp3"}, {"no": 914, "sp": "正彦", "text": "いけないとは、\n言っていません", "kind": "丸", "ch": "転", "kg": "", "src": "a/914.mp3"}, {"no": 915, "sp": "正彦", "text": "ただ、\nそれを出した人を、", "kind": "丸", "ch": "転", "kg": "", "src": "a/915.mp3"}, {"no": 916, "sp": "正彦", "text": "式に呼ばないのが、\n僕には\n分かりません", "kind": "丸", "ch": "転", "kg": "", "src": "a/916.mp3"}, {"no": 917, "sp": "拓海", "text": "金を出すときだけ\n家族で、", "kind": "丸", "ch": "転", "kg": "", "src": "a/917.mp3"}, {"no": 918, "sp": "拓海", "text": "式の日は、\n消えたことに\nするんですか？", "kind": "丸", "ch": "転", "kg": "", "src": "a/918.mp3"}, {"no": 919, "sp": "主人公", "text": "母は、\n答えなかった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/919.mp3"}, {"no": 920, "sp": "主人公", "text": "拓海の一言が、\n胸にこたえた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/920.mp3"}, {"no": 921, "sp": "主人公", "text": "俺はポケットの中の\n主賓の札を、\n握りしめる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/921.mp3"}, {"no": 922, "sp": "主人公", "text": "莉子が、\n拓海の腕に\nしがみついた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/922.mp3"}, {"no": 923, "sp": "莉子", "text": "知らなかったの", "kind": "丸", "ch": "転", "kg": "", "src": "a/923.mp3"}, {"no": 924, "sp": "莉子", "text": "私、本当に\n知らなかったの", "kind": "丸", "ch": "転", "kg": "", "src": "a/924.mp3"}, {"no": 925, "sp": "莉子", "text": "お兄ちゃんが\n社長だってことも、", "kind": "丸", "ch": "転", "kg": "", "src": "a/925.mp3"}, {"no": 926, "sp": "莉子", "text": "学費のことも、\n全部", "kind": "丸", "ch": "転", "kg": "", "src": "a/926.mp3"}, {"no": 927, "sp": "莉子", "text": "お兄ちゃんには、\nちゃんと謝るから", "kind": "丸", "ch": "転", "kg": "", "src": "a/927.mp3"}, {"no": 928, "sp": "莉子", "text": "ねえ、拓海", "kind": "丸", "ch": "転", "kg": "", "src": "a/928.mp3"}, {"no": 929, "sp": "莉子", "text": "式は、\n予定通りやるよね？", "kind": "丸", "ch": "転", "kg": "", "src": "a/929.mp3"}, {"no": 930, "sp": "主人公", "text": "拓海は、しがみつく\n莉子の手を、\nしばらく見ていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/930.mp3"}, {"no": 931, "sp": "拓海", "text": "謝るのは、", "kind": "丸", "ch": "転", "kg": "", "src": "a/931.mp3"}, {"no": 932, "sp": "拓海", "text": "社長だって\n分かったからだろ", "kind": "丸", "ch": "転", "kg": "", "src": "a/932.mp3"}, {"no": 933, "sp": "主人公", "text": "莉子は、\n言葉に詰まった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/933.mp3"}, {"no": 934, "sp": "主人公", "text": "拓海は握り返さずに、\nその手を\nそっと外した。", "kind": "四角", "ch": "転", "kg": "", "src": "a/934.mp3"}, {"no": 935, "sp": "拓海", "text": "莉子", "kind": "丸", "ch": "転", "kg": "", "src": "a/935.mp3"}, {"no": 936, "sp": "拓海", "text": "今日は、\n式を挙げない", "kind": "丸", "ch": "転", "kg": "", "src": "a/936.mp3"}, {"no": 937, "sp": "拓海", "text": "婚姻届も、\n出さない", "kind": "丸", "ch": "転", "kg": "", "src": "a/937.mp3"}, {"no": 938, "sp": "主人公", "text": "莉子の顔から、\n血の気が引いた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/938.mp3"}, {"no": 939, "sp": "莉子", "text": "え……", "kind": "丸", "ch": "転", "kg": "", "src": "a/939.mp3"}, {"no": 940, "sp": "莉子", "text": "何、\n言ってるの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/940.mp3"}, {"no": 941, "sp": "莉子", "text": "みんな、\n来てるんだよ？", "kind": "丸", "ch": "転", "kg": "", "src": "a/941.mp3"}, {"no": 942, "sp": "主人公", "text": "拓海", "kind": "丸", "ch": "転", "kg": "", "src": "a/942.mp3"}, {"no": 943, "sp": "主人公", "text": "それは、\nお前が決めることだ", "kind": "丸", "ch": "転", "kg": "", "src": "a/943.mp3"}, {"no": 944, "sp": "主人公", "text": "だけど、\n俺のために\n決めるな", "kind": "丸", "ch": "転", "kg": "", "src": "a/944.mp3"}, {"no": 945, "sp": "拓海", "text": "社長のためじゃ\nありません", "kind": "丸", "ch": "転", "kg": "", "src": "a/945.mp3"}, {"no": 946, "sp": "拓海", "text": "俺のために、\n決めたんです", "kind": "丸", "ch": "転", "kg": "", "src": "a/946.mp3"}, {"no": 947, "sp": "拓海", "text": "自分の恩人を\n笑って追い出す人と、", "kind": "丸", "ch": "転", "kg": "", "src": "a/947.mp3"}, {"no": 948, "sp": "拓海", "text": "家族には\nなれません", "kind": "丸", "ch": "転", "kg": "", "src": "a/948.mp3"}, {"no": 949, "sp": "拓海", "text": "今日、\n社長の前で\n誓うつもりだった", "kind": "丸", "ch": "転", "kg": "", "src": "a/949.mp3"}, {"no": 950, "sp": "拓海", "text": "でも、\nもう誓えない", "kind": "丸", "ch": "転", "kg": "", "src": "a/950.mp3"}, {"no": 951, "sp": "主人公", "text": "莉子の口が、\n小さく開いたまま\n動かない。", "kind": "四角", "ch": "転", "kg": "", "src": "a/951.mp3"}, {"no": 952, "sp": "主人公", "text": "拓海は、\n披露宴の会場の\n扉を開けた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/952.mp3"}, {"no": 953, "sp": "主人公", "text": "中では、\n招待客がもう\n席についている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/953.mp3"}, {"no": 954, "sp": "主人公", "text": "丸いテーブルに、\n白い花が\n並んでいた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/954.mp3"}, {"no": 955, "sp": "主人公", "text": "高砂の後ろには、\n2人の名前の入った\nパネルが立っている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/955.mp3"}, {"no": 956, "sp": "主人公", "text": "拓海は、まっすぐ\n高砂の前まで\n歩いていった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/956.mp3"}, {"no": 957, "sp": "司会", "text": "あの、新郎様……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/957.mp3"}, {"no": 958, "sp": "主人公", "text": "拓海は、司会の\n女性から、\nマイクを受け取る。", "kind": "四角", "ch": "転", "kg": "", "src": "a/958.mp3"}, {"no": 959, "sp": "主人公", "text": "俺は、会場の\n一番後ろの扉の前に\n立った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/959.mp3"}, {"no": 960, "sp": "拓海", "text": "皆さん、\n本日はお集まり\nいただき、", "kind": "丸", "ch": "転", "kg": "", "src": "a/960.mp3"}, {"no": 961, "sp": "拓海", "text": "ありがとう\nございます", "kind": "丸", "ch": "転", "kg": "", "src": "a/961.mp3"}, {"no": 962, "sp": "拓海", "text": "申し訳ありません", "kind": "丸", "ch": "転", "kg": "", "src": "a/962.mp3"}, {"no": 963, "sp": "拓海", "text": "今日の式と披露宴は、\n中止します", "kind": "丸", "ch": "転", "kg": "", "src": "a/963.mp3"}, {"no": 964, "sp": "主人公", "text": "招待客が、\n顔を見合わせた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/964.mp3"}, {"no": 965, "sp": "招待客", "text": "え？", "kind": "丸", "ch": "転", "kg": "", "src": "a/965.mp3"}, {"no": 966, "sp": "招待客", "text": "中止って……", "kind": "丸", "ch": "転", "kg": "", "src": "a/966.mp3"}, {"no": 967, "sp": "招待客", "text": "何かあったの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/967.mp3"}, {"no": 968, "sp": "司会", "text": "皆さま、\nしばらく\nお待ちください", "kind": "丸", "ch": "転", "kg": "", "src": "a/968.mp3"}, {"no": 969, "sp": "拓海", "text": "今日は、\n僕の会社の社長に、", "kind": "丸", "ch": "転", "kg": "", "src": "a/969.mp3"}, {"no": 970, "sp": "拓海", "text": "主賓の挨拶を\nお願いしていました", "kind": "丸", "ch": "転", "kg": "", "src": "a/970.mp3"}, {"no": 971, "sp": "拓海", "text": "僕が一番、\n聞きたかった\n挨拶です", "kind": "丸", "ch": "転", "kg": "", "src": "a/971.mp3"}, {"no": 972, "sp": "拓海", "text": "僕は新人の頃、\n現場の事故で\n土に埋まりました", "kind": "丸", "ch": "転", "kg": "", "src": "a/972.mp3"}, {"no": 973, "sp": "拓海", "text": "助けてくれたのは、\n社長でした", "kind": "丸", "ch": "転", "kg": "", "src": "a/973.mp3"}, {"no": 974, "sp": "拓海", "text": "今日は、その人に、\n僕たちの式を\n見てほしかった", "kind": "丸", "ch": "転", "kg": "", "src": "a/974.mp3"}, {"no": 975, "sp": "拓海", "text": "そして、\n新婦のお兄さんです", "kind": "丸", "ch": "転", "kg": "", "src": "a/975.mp3"}, {"no": 976, "sp": "拓海", "text": "その人を新婦が、\nロビーで\n追い出しました", "kind": "丸", "ch": "転", "kg": "", "src": "a/976.mp3"}, {"no": 977, "sp": "招待客", "text": "え、\n新婦さんが……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/977.mp3"}, {"no": 978, "sp": "招待客", "text": "自分の\nお兄さんを……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/978.mp3"}, {"no": 979, "sp": "主人公", "text": "会社の席から、\n声が上がった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/979.mp3"}, {"no": 980, "sp": "社員", "text": "社長に、\nワインを\nかけたのか？", "kind": "丸", "ch": "転", "kg": "", "src": "a/980.mp3"}, {"no": 981, "sp": "社員", "text": "ふざけんなよ……", "kind": "丸", "ch": "転", "kg": "", "src": "a/981.mp3"}, {"no": 982, "sp": "社員", "text": "社長が、\nどれだけ所長を\nかわいがってたか……", "kind": "丸", "ch": "転", "kg": "", "src": "a/982.mp3"}, {"no": 983, "sp": "主人公", "text": "新婦側の席では、\n莉子の友人たちが\n黙り込んでいる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/983.mp3"}, {"no": 984, "sp": "莉子の友人", "text": "お兄さんって、\nさっきの……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/984.mp3"}, {"no": 985, "sp": "莉子の友人", "text": "知らない人って、\n言ってたよね", "kind": "丸", "ch": "転", "kg": "", "src": "a/985.mp3"}, {"no": 986, "sp": "莉子の友人", "text": "私、\n帰ろうかな……", "kind": "丸", "ch": "転", "kg": "", "src": "a/986.mp3"}, {"no": 987, "sp": "主人公", "text": "莉子が、ドレスの裾を\n持ち上げて、\n高砂に駆け上がった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/987.mp3"}, {"no": 988, "sp": "主人公", "text": "拓海の持つマイクに、\n顔を寄せる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/988.mp3"}, {"no": 989, "sp": "莉子", "text": "違うの", "kind": "丸", "ch": "転", "kg": "", "src": "a/989.mp3"}, {"no": 990, "sp": "莉子", "text": "知らなかったの", "kind": "丸", "ch": "転", "kg": "", "src": "a/990.mp3"}, {"no": 991, "sp": "莉子", "text": "皆さん、\n聞いてください", "kind": "丸", "ch": "転", "kg": "", "src": "a/991.mp3"}, {"no": 992, "sp": "主人公", "text": "拓海はマイクを\n台に置いて、\n高砂を降りた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/992.mp3"}, {"no": 993, "sp": "主人公", "text": "マイクを通さない\n莉子の声は、\n誰にも届かない。", "kind": "四角", "ch": "転", "kg": "", "src": "a/993.mp3"}, {"no": 994, "sp": "主人公", "text": "席を立つ招待客が、\n1人、2人と\n出てきた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/994.mp3"}, {"no": 995, "sp": "主人公", "text": "莉子は、会場の\n一番後ろに立つ\n俺を見つけた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/995.mp3"}, {"no": 996, "sp": "主人公", "text": "ドレスの裾を持って、\nこちらへ走ってくる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/996.mp3"}, {"no": 997, "sp": "莉子", "text": "お兄ちゃん", "kind": "丸", "ch": "転", "kg": "", "src": "a/997.mp3"}, {"no": 998, "sp": "莉子", "text": "お兄ちゃん、\nお願い", "kind": "丸", "ch": "転", "kg": "", "src": "a/998.mp3"}, {"no": 999, "sp": "莉子", "text": "拓海に言って", "kind": "丸", "ch": "転", "kg": "", "src": "a/999.mp3"}, {"no": 1000, "sp": "莉子", "text": "式をやってって、\n言ってよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1000.mp3"}, {"no": 1001, "sp": "莉子", "text": "お兄ちゃんの\n言うことなら、\n拓海は聞くでしょ？", "kind": "丸", "ch": "転", "kg": "", "src": "a/1001.mp3"}, {"no": 1002, "sp": "莉子", "text": "私、\nお兄ちゃんの\n妹だよ？", "kind": "丸", "ch": "転", "kg": "", "src": "a/1002.mp3"}, {"no": 1003, "sp": "主人公", "text": "莉子は、\n俺の腕をつかんだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1003.mp3"}, {"no": 1004, "sp": "主人公", "text": "お兄ちゃんと\n何度呼ばれても、\n胸の奥は冷えていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1004.mp3"}, {"no": 1005, "sp": "主人公", "text": "俺は、腕をつかむ\n莉子の手を\n見下ろした。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1005.mp3"}, {"no": 1006, "sp": "主人公", "text": "俺は、\n消えたことに\nなってるんだろ？", "kind": "丸", "ch": "転", "kg": "", "src": "a/1006.mp3"}, {"no": 1007, "sp": "主人公", "text": "消えた人間は、\n何も言えない", "kind": "丸", "ch": "転", "kg": "", "src": "a/1007.mp3"}, {"no": 1008, "sp": "莉子", "text": "あれは冗談よ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1008.mp3"}, {"no": 1009, "sp": "莉子", "text": "お母さんに\n言われて……", "kind": "丸", "ch": "転", "kg": "", "src": "a/1009.mp3"}, {"no": 1010, "sp": "莉子", "text": "本気じゃ\nなかったの", "kind": "丸", "ch": "転", "kg": "", "src": "a/1010.mp3"}, {"no": 1011, "sp": "主人公", "text": "莉子は、\n泣き出した。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1011.mp3"}, {"no": 1012, "sp": "主人公", "text": "冗談で、\nワインは\nかけないだろ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1012.mp3"}, {"no": 1013, "sp": "莉子", "text": "お金なら、\n返すから", "kind": "丸", "ch": "転", "kg": "", "src": "a/1013.mp3"}, {"no": 1014, "sp": "莉子", "text": "学費も、\n式のお金も、\n働いて返すから", "kind": "丸", "ch": "転", "kg": "", "src": "a/1014.mp3"}, {"no": 1015, "sp": "主人公", "text": "返さなくていい", "kind": "丸", "ch": "転", "kg": "", "src": "a/1015.mp3"}, {"no": 1016, "sp": "主人公", "text": "金の話じゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/1016.mp3"}, {"no": 1017, "sp": "主人公", "text": "俺は、莉子の手を\n腕から外した。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1017.mp3"}, {"no": 1018, "sp": "主人公", "text": "母が、\n莉子を追って\n会場に入ってきた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1018.mp3"}, {"no": 1019, "sp": "京子", "text": "蓮！", "kind": "丸", "ch": "転", "kg": "", "src": "a/1019.mp3"}, {"no": 1020, "sp": "京子", "text": "あんたが\n来たせいで、\n全部めちゃくちゃよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1020.mp3"}, {"no": 1021, "sp": "京子", "text": "最初から社長だって、\n言えばよかったのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1021.mp3"}, {"no": 1022, "sp": "京子", "text": "黙ってて、\n私たちに恥をかかせて", "kind": "丸", "ch": "転", "kg": "", "src": "a/1022.mp3"}, {"no": 1023, "sp": "京子", "text": "いい気味だって、\n思ってるんでしょ？", "kind": "丸", "ch": "転", "kg": "", "src": "a/1023.mp3"}, {"no": 1024, "sp": "主人公", "text": "言っても、\n中卒は中卒なんだろ？", "kind": "丸", "ch": "転", "kg": "", "src": "a/1024.mp3"}, {"no": 1025, "sp": "主人公", "text": "さっき母さんが、\nそう言った", "kind": "丸", "ch": "転", "kg": "", "src": "a/1025.mp3"}, {"no": 1026, "sp": "主人公", "text": "母は、\n言葉に詰まった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1026.mp3"}, {"no": 1027, "sp": "京子", "text": "とにかく、\n向こうのご両親に\n頭を下げて", "kind": "丸", "ch": "転", "kg": "", "src": "a/1027.mp3"}, {"no": 1028, "sp": "京子", "text": "あんたが頼めば、\n式はやり直せるでしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1028.mp3"}, {"no": 1029, "sp": "京子", "text": "家族なんだから", "kind": "丸", "ch": "転", "kg": "", "src": "a/1029.mp3"}, {"no": 1030, "sp": "主人公", "text": "その一言で、\nこれまでの母の電話を\n思い出した。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1030.mp3"}, {"no": 1031, "sp": "主人公", "text": "母の電話は、\nいつも金の話だった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1031.mp3"}, {"no": 1032, "sp": "主人公", "text": "俺はスマホを出して、\n振込の画面を開く。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1032.mp3"}, {"no": 1033, "sp": "京子", "text": "何してるの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/1033.mp3"}, {"no": 1034, "sp": "主人公", "text": "俺は母の目の前で、\n毎月の振り込みを、\n2つとも止めた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1034.mp3"}, {"no": 1035, "sp": "主人公", "text": "母への仕送りと、\n父の口座に入れている\nローンの分だ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1035.mp3"}, {"no": 1036, "sp": "主人公", "text": "今月から、\nもう振り込まないから", "kind": "丸", "ch": "転", "kg": "", "src": "a/1036.mp3"}, {"no": 1037, "sp": "京子", "text": "え？", "kind": "丸", "ch": "転", "kg": "", "src": "a/1037.mp3"}, {"no": 1038, "sp": "京子", "text": "冗談よね？", "kind": "丸", "ch": "転", "kg": "", "src": "a/1038.mp3"}, {"no": 1039, "sp": "主人公", "text": "冗談じゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/1039.mp3"}, {"no": 1040, "sp": "京子", "text": "あんた、\n母親を\n見捨てる気？", "kind": "丸", "ch": "転", "kg": "", "src": "a/1040.mp3"}, {"no": 1041, "sp": "主人公", "text": "見捨ててない", "kind": "丸", "ch": "転", "kg": "", "src": "a/1041.mp3"}, {"no": 1042, "sp": "主人公", "text": "自分の家は、\n自分で守ればいい", "kind": "丸", "ch": "転", "kg": "", "src": "a/1042.mp3"}, {"no": 1043, "sp": "京子", "text": "ちょっと、\n待ちなさいよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1043.mp3"}, {"no": 1044, "sp": "京子", "text": "家のローンは、\nどうするのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1044.mp3"}, {"no": 1045, "sp": "主人公", "text": "父さんの名義の\n家だろ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1045.mp3"}, {"no": 1046, "sp": "主人公", "text": "父さんと母さんで\n払えばいい", "kind": "丸", "ch": "転", "kg": "", "src": "a/1046.mp3"}, {"no": 1047, "sp": "京子", "text": "そんな……", "kind": "丸", "ch": "転", "kg": "", "src": "a/1047.mp3"}, {"no": 1048, "sp": "京子", "text": "お父さんの\n給料だけで、\n払えるわけないでしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1048.mp3"}, {"no": 1049, "sp": "主人公", "text": "莉子が、泣きながら\n叫んだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1049.mp3"}, {"no": 1050, "sp": "莉子", "text": "なんで私ばっかり\n悪者なのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1050.mp3"}, {"no": 1051, "sp": "莉子", "text": "中卒の兄がいたら、\n恥ずかしいのは\n普通でしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1051.mp3"}, {"no": 1052, "sp": "莉子", "text": "みんな、\nそう思ってるじゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/1052.mp3"}, {"no": 1053, "sp": "主人公", "text": "会場の後ろで、\n典子さんが\n前に出た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1053.mp3"}, {"no": 1054, "sp": "典子", "text": "うちは、\n教師の家ですけど", "kind": "丸", "ch": "転", "kg": "", "src": "a/1054.mp3"}, {"no": 1055, "sp": "典子", "text": "学歴で人を\n消えたことにする\nお宅とは、", "kind": "丸", "ch": "転", "kg": "", "src": "a/1055.mp3"}, {"no": 1056, "sp": "典子", "text": "お付き合い\nできません", "kind": "丸", "ch": "転", "kg": "", "src": "a/1056.mp3"}, {"no": 1057, "sp": "典子", "text": "拓海が社長さんに、\nどれだけ\n感謝してるか", "kind": "丸", "ch": "転", "kg": "", "src": "a/1057.mp3"}, {"no": 1058, "sp": "典子", "text": "私たちは、\n知ってますから", "kind": "丸", "ch": "転", "kg": "", "src": "a/1058.mp3"}, {"no": 1059, "sp": "主人公", "text": "莉子は、\n言い返せなかった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1059.mp3"}, {"no": 1060, "sp": "主人公", "text": "莉子の友人たちが、\n黙って会場を\n出ていく。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1060.mp3"}, {"no": 1061, "sp": "正彦", "text": "息子が\n決めたことです", "kind": "丸", "ch": "転", "kg": "", "src": "a/1061.mp3"}, {"no": 1062, "sp": "正彦", "text": "婚約は、\nなかったことに\nさせてください", "kind": "丸", "ch": "転", "kg": "", "src": "a/1062.mp3"}, {"no": 1063, "sp": "主人公", "text": "正彦さんは、\n母に頭を下げた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1063.mp3"}, {"no": 1064, "sp": "主人公", "text": "それから、\n俺のほうを向いた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1064.mp3"}, {"no": 1065, "sp": "正彦", "text": "白木さん", "kind": "丸", "ch": "転", "kg": "", "src": "a/1065.mp3"}, {"no": 1066, "sp": "正彦", "text": "息子を、\nこれからも\nよろしくお願いします", "kind": "丸", "ch": "転", "kg": "", "src": "a/1066.mp3"}, {"no": 1067, "sp": "主人公", "text": "こちらこそ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1067.mp3"}, {"no": 1068, "sp": "主人公", "text": "正彦さんは、\n典子さんの\n肩を抱いて、", "kind": "四角", "ch": "転", "kg": "", "src": "a/1068.mp3"}, {"no": 1069, "sp": "主人公", "text": "会場を\n出ていった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1069.mp3"}, {"no": 1070, "sp": "主人公", "text": "莉子はドレスのまま、\n床に座り込んだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1070.mp3"}, {"no": 1071, "sp": "主人公", "text": "白い裾が、\n床に広がる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1071.mp3"}, {"no": 1072, "sp": "莉子", "text": "拓海……", "kind": "丸", "ch": "転", "kg": "", "src": "a/1072.mp3"}, {"no": 1073, "sp": "莉子", "text": "拓海、\n待って", "kind": "丸", "ch": "転", "kg": "", "src": "a/1073.mp3"}, {"no": 1074, "sp": "主人公", "text": "拓海は、\n振り返らなかった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1074.mp3"}, {"no": 1075, "sp": "主人公", "text": "母が、\n俺の袖を引いた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1075.mp3"}, {"no": 1076, "sp": "京子", "text": "蓮、お願い", "kind": "丸", "ch": "転", "kg": "", "src": "a/1076.mp3"}, {"no": 1077, "sp": "京子", "text": "今月だけでも、\n払って", "kind": "丸", "ch": "転", "kg": "", "src": "a/1077.mp3"}, {"no": 1078, "sp": "京子", "text": "ローンが\n払えなかったら、\n家がなくなるのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1078.mp3"}, {"no": 1079, "sp": "京子", "text": "あんたを\nここまで育てたのは、\n誰だと思ってるの", "kind": "丸", "ch": "転", "kg": "", "src": "a/1079.mp3"}, {"no": 1080, "sp": "主人公", "text": "15からは、\n親方だ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1080.mp3"}, {"no": 1081, "sp": "主人公", "text": "母の手が、\n袖から離れた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1081.mp3"}, {"no": 1082, "sp": "主人公", "text": "今月から、\n払わない", "kind": "丸", "ch": "転", "kg": "", "src": "a/1082.mp3"}, {"no": 1083, "sp": "主人公", "text": "父が、\n母の後ろから\n出てきた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1083.mp3"}, {"no": 1084, "sp": "和夫", "text": "蓮", "kind": "丸", "ch": "転", "kg": "", "src": "a/1084.mp3"}, {"no": 1085, "sp": "和夫", "text": "すまなかった", "kind": "丸", "ch": "転", "kg": "", "src": "a/1085.mp3"}, {"no": 1086, "sp": "主人公", "text": "父は、\n俺に頭を下げた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1086.mp3"}, {"no": 1087, "sp": "主人公", "text": "父さんは、\n一度も\n止めてくれなかったな", "kind": "丸", "ch": "転", "kg": "", "src": "a/1087.mp3"}, {"no": 1088, "sp": "和夫", "text": "……ああ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1088.mp3"}, {"no": 1089, "sp": "和夫", "text": "お前が15で\n働きに出た日も、\n俺は何も言わなかった", "kind": "丸", "ch": "転", "kg": "", "src": "a/1089.mp3"}, {"no": 1090, "sp": "主人公", "text": "父は頭を下げたまま、\n動かなかった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1090.mp3"}, {"no": 1091, "sp": "主人公", "text": "やがて父は\n顔を上げると、\n母と莉子を見た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1091.mp3"}, {"no": 1092, "sp": "和夫", "text": "お前たちも、\n頭を下げろ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1092.mp3"}, {"no": 1093, "sp": "京子", "text": "お父さん……", "kind": "丸", "ch": "転", "kg": "", "src": "a/1093.mp3"}, {"no": 1094, "sp": "和夫", "text": "下げろ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1094.mp3"}, {"no": 1095, "sp": "主人公", "text": "父の声に、\n母がびくりと\n肩を震わせた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1095.mp3"}, {"no": 1096, "sp": "主人公", "text": "父と母と莉子が、\n並んで\n俺に頭を下げる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1096.mp3"}, {"no": 1097, "sp": "主人公", "text": "じいちゃんが、\n杖で床を叩いた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1097.mp3"}, {"no": 1098, "sp": "源一", "text": "頭を下げる相手を、", "kind": "丸", "ch": "転", "kg": "", "src": "a/1098.mp3"}, {"no": 1099, "sp": "源一", "text": "今日まで\n間違えとったんだ", "kind": "丸", "ch": "転", "kg": "", "src": "a/1099.mp3"}, {"no": 1100, "sp": "源一", "text": "お前らは", "kind": "丸", "ch": "転", "kg": "", "src": "a/1100.mp3"}, {"no": 1101, "sp": "主人公", "text": "佳代おばさんが、\n俺の背中に\n手を置いた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1101.mp3"}, {"no": 1102, "sp": "佳代", "text": "蓮", "kind": "丸", "ch": "転", "kg": "", "src": "a/1102.mp3"}, {"no": 1103, "sp": "佳代", "text": "あとは、\n私とじいちゃんに\n任せなさい", "kind": "丸", "ch": "転", "kg": "", "src": "a/1103.mp3"}, {"no": 1104, "sp": "佳代", "text": "あんたは、\nもう十分やった", "kind": "丸", "ch": "転", "kg": "", "src": "a/1104.mp3"}, {"no": 1105, "sp": "主人公", "text": "佳代おばさんは、\n母のほうを向いた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1105.mp3"}, {"no": 1106, "sp": "佳代", "text": "お義姉さん", "kind": "丸", "ch": "転", "kg": "", "src": "a/1106.mp3"}, {"no": 1107, "sp": "佳代", "text": "家のことは、\n私とじいちゃんで、\n話をさせてもらうから", "kind": "丸", "ch": "転", "kg": "", "src": "a/1107.mp3"}, {"no": 1108, "sp": "主人公", "text": "母は、\n言い返さなかった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1108.mp3"}, {"no": 1109, "sp": "主人公", "text": "会場の後ろに、\n正岡建設の社員たちが\n集まってきた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1109.mp3"}, {"no": 1110, "sp": "柴田", "text": "社長", "kind": "丸", "ch": "転", "kg": "", "src": "a/1110.mp3"}, {"no": 1111, "sp": "柴田", "text": "所長と一緒に、\n帰りましょう", "kind": "丸", "ch": "転", "kg": "", "src": "a/1111.mp3"}, {"no": 1112, "sp": "社員", "text": "社長、\n車、回してきます", "kind": "丸", "ch": "転", "kg": "", "src": "a/1112.mp3"}, {"no": 1113, "sp": "主人公", "text": "拓海は、\n社員たちの真ん中に\n立っていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1113.mp3"}, {"no": 1114, "sp": "主人公", "text": "赤い目のまま、\n俺に深く礼をする。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1114.mp3"}, {"no": 1115, "sp": "主人公", "text": "拓海", "kind": "丸", "ch": "転", "kg": "", "src": "a/1115.mp3"}, {"no": 1116, "sp": "主人公", "text": "月曜、\n現場で待ってる", "kind": "丸", "ch": "転", "kg": "", "src": "a/1116.mp3"}, {"no": 1117, "sp": "拓海", "text": "……はい", "kind": "丸", "ch": "転", "kg": "", "src": "a/1117.mp3"}, {"no": 1118, "sp": "拓海", "text": "社長", "kind": "丸", "ch": "転", "kg": "", "src": "a/1118.mp3"}, {"no": 1119, "sp": "拓海", "text": "ありがとう\nございました", "kind": "丸", "ch": "転", "kg": "", "src": "a/1119.mp3"}, {"no": 1120, "sp": "主人公", "text": "頭を下げたままの\n3人を背にして、\n俺は会場を出た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1120.mp3"}, {"no": 1121, "sp": "主人公", "text": "後ろで、\n扉が閉まった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/1121.mp3"}, {"no": 1122, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "転", "kg": "", "wait": 0.8}, {"no": 1123, "sp": "主人公", "text": "それから、\n3か月が経った。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1123.mp3"}, {"no": 1124, "sp": "主人公", "text": "日曜の夜、\n佳代おばさんから\n電話があった。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1124.mp3"}, {"no": 1125, "sp": "佳代", "text": "蓮、\n元気にしてる？", "kind": "丸", "ch": "結", "kg": "", "src": "a/1125.mp3"}, {"no": 1126, "sp": "主人公", "text": "ああ。\nおばさんは？", "kind": "丸", "ch": "結", "kg": "", "src": "a/1126.mp3"}, {"no": 1127, "sp": "佳代", "text": "私は元気よ", "kind": "丸", "ch": "結", "kg": "", "src": "a/1127.mp3"}, {"no": 1128, "sp": "佳代", "text": "実家のほうは、\n相変わらずだけどね", "kind": "丸", "ch": "結", "kg": "", "src": "a/1128.mp3"}, {"no": 1129, "sp": "主人公", "text": "佳代おばさんは、\n実家の様子を\nぽつぽつと話した。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1129.mp3"}, {"no": 1130, "sp": "主人公", "text": "莉子は、\n婚約がなくなって、\n実家に戻ったらしい。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1130.mp3"}, {"no": 1131, "sp": "主人公", "text": "式の日のことは、\n大学の友人たちにも\nすぐに広まった。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1131.mp3"}, {"no": 1132, "sp": "主人公", "text": "今はもう、\n誰とも連絡を\n取っていないそうだ。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1132.mp3"}, {"no": 1133, "sp": "佳代", "text": "部屋から\nほとんど\n出てこないって", "kind": "丸", "ch": "結", "kg": "", "src": "a/1133.mp3"}, {"no": 1134, "sp": "佳代", "text": "友達の結婚式にも、\n呼ばれなくなった\nらしいわ", "kind": "丸", "ch": "結", "kg": "", "src": "a/1134.mp3"}, {"no": 1135, "sp": "佳代", "text": "お義姉さんが、\nこぼしてたわ", "kind": "丸", "ch": "結", "kg": "", "src": "a/1135.mp3"}, {"no": 1136, "sp": "主人公", "text": "ローンを払うために、\n母はパートを2つ\n掛け持ちしている。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1136.mp3"}, {"no": 1137, "sp": "佳代", "text": "朝はお弁当屋で、\n夜はスーパーのレジよ", "kind": "丸", "ch": "結", "kg": "", "src": "a/1137.mp3"}, {"no": 1138, "sp": "佳代", "text": "あの人が、\n人に頭を下げて\n働いてるの", "kind": "丸", "ch": "結", "kg": "", "src": "a/1138.mp3"}, {"no": 1139, "sp": "佳代", "text": "家を手放すかどうか、\n今、兄さんと\n話してるみたい", "kind": "丸", "ch": "結", "kg": "", "src": "a/1139.mp3"}, {"no": 1140, "sp": "主人公", "text": "そうか", "kind": "丸", "ch": "結", "kg": "", "src": "a/1140.mp3"}, {"no": 1141, "sp": "主人公", "text": "父は、定年を\n延ばしてもらって、\n働いているらしい。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1141.mp3"}, {"no": 1142, "sp": "主人公", "text": "じいちゃんの家にも、\n月に一度\n顔を出すという。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1142.mp3"}, {"no": 1143, "sp": "佳代", "text": "じいちゃんが\n言ってたわよ", "kind": "丸", "ch": "結", "kg": "", "src": "a/1143.mp3"}, {"no": 1144, "sp": "佳代", "text": "和夫は、来ても\n何もしゃべらんがな、\nって", "kind": "丸", "ch": "結", "kg": "", "src": "a/1144.mp3"}, {"no": 1145, "sp": "佳代", "text": "来るだけ、\nましだって", "kind": "丸", "ch": "結", "kg": "", "src": "a/1145.mp3"}, {"no": 1146, "sp": "主人公", "text": "じいちゃんらしいな", "kind": "丸", "ch": "結", "kg": "", "src": "a/1146.mp3"}, {"no": 1147, "sp": "佳代", "text": "それでね、蓮", "kind": "丸", "ch": "結", "kg": "", "src": "a/1147.mp3"}, {"no": 1148, "sp": "佳代", "text": "じいちゃん、\n最近あんたの話\nばっかりよ", "kind": "丸", "ch": "結", "kg": "", "src": "a/1148.mp3"}, {"no": 1149, "sp": "佳代", "text": "たまには、\n顔を見せてやって", "kind": "丸", "ch": "結", "kg": "", "src": "a/1149.mp3"}, {"no": 1150, "sp": "主人公", "text": "分かった", "kind": "丸", "ch": "結", "kg": "", "src": "a/1150.mp3"}, {"no": 1151, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "結", "kg": "", "wait": 0.8}, {"no": 1152, "sp": "主人公", "text": "拓海は式の2日後に、\n作業着で現場に\n戻ってきた。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1152.mp3"}, {"no": 1153, "sp": "拓海", "text": "社長、\nおはようございます", "kind": "丸", "ch": "結", "kg": "", "src": "a/1153.mp3"}, {"no": 1154, "sp": "主人公", "text": "……おう", "kind": "丸", "ch": "結", "kg": "", "src": "a/1154.mp3"}, {"no": 1155, "sp": "主人公", "text": "拓海は、いつもの\n段取りの表を\n差し出した。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1155.mp3"}, {"no": 1156, "sp": "主人公", "text": "今も所長として、\n一番に足場に\n上がっている。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1156.mp3"}, {"no": 1157, "sp": "柴田", "text": "所長、\nまた一番ですか", "kind": "丸", "ch": "結", "kg": "", "src": "a/1157.mp3"}, {"no": 1158, "sp": "拓海", "text": "柴田さんより、\n若いですから", "kind": "丸", "ch": "結", "kg": "", "src": "a/1158.mp3"}, {"no": 1159, "sp": "柴田", "text": "言うように\nなったな", "kind": "丸", "ch": "結", "kg": "", "src": "a/1159.mp3"}, {"no": 1160, "sp": "主人公", "text": "職人たちが、\nまた笑った。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1160.mp3"}, {"no": 1161, "sp": "主人公", "text": "足場の上から、\n拓海の声が\nよく通る。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1161.mp3"}, {"no": 1162, "sp": "拓海", "text": "柴田さん、\nそっちの足場、\nもう1回見ます", "kind": "丸", "ch": "結", "kg": "", "src": "a/1162.mp3"}, {"no": 1163, "sp": "柴田", "text": "はいはい、\n所長の言う通りに", "kind": "丸", "ch": "結", "kg": "", "src": "a/1163.mp3"}, {"no": 1164, "sp": "主人公", "text": "俺は、\n下からそれを\n見上げていた。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1164.mp3"}, {"no": 1165, "sp": "主人公", "text": "昼の休憩。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1165.mp3"}, {"no": 1166, "sp": "主人公", "text": "資材置き場の日陰に、\n拓海が缶コーヒーを\n2本持ってきた。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1166.mp3"}, {"no": 1167, "sp": "主人公", "text": "拓海は、\nいつものように\n俺の隣に座った。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1167.mp3"}, {"no": 1168, "sp": "拓海", "text": "社長", "kind": "丸", "ch": "結", "kg": "", "src": "a/1168.mp3"}, {"no": 1169, "sp": "拓海", "text": "うちの親が、\n社長にちゃんと\nお礼がしたいって", "kind": "丸", "ch": "結", "kg": "", "src": "a/1169.mp3"}, {"no": 1170, "sp": "拓海", "text": "今度、\n家に来てほしいって\n言ってました", "kind": "丸", "ch": "結", "kg": "", "src": "a/1170.mp3"}, {"no": 1171, "sp": "主人公", "text": "礼を言われるような\nことはしてない", "kind": "丸", "ch": "結", "kg": "", "src": "a/1171.mp3"}, {"no": 1172, "sp": "拓海", "text": "母が、社長の\n好きな食べ物を\n聞いてこいって", "kind": "丸", "ch": "結", "kg": "", "src": "a/1172.mp3"}, {"no": 1173, "sp": "主人公", "text": "……何でも食う", "kind": "丸", "ch": "結", "kg": "", "src": "a/1173.mp3"}, {"no": 1174, "sp": "拓海", "text": "それが、\n一番困るんですよ", "kind": "丸", "ch": "結", "kg": "", "src": "a/1174.mp3"}, {"no": 1175, "sp": "主人公", "text": "拓海は、\n缶を両手で\n転がしている。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1175.mp3"}, {"no": 1176, "sp": "拓海", "text": "それと……", "kind": "丸", "ch": "結", "kg": "", "src": "a/1176.mp3"}, {"no": 1177, "sp": "拓海", "text": "社長の主賓の挨拶、", "kind": "丸", "ch": "結", "kg": "", "src": "a/1177.mp3"}, {"no": 1178, "sp": "拓海", "text": "いつか、\n聞かせてください", "kind": "丸", "ch": "結", "kg": "", "src": "a/1178.mp3"}, {"no": 1179, "sp": "主人公", "text": "あの日の挨拶の紙は、\n今も事務所の机に\nしまってある。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1179.mp3"}, {"no": 1180, "sp": "主人公", "text": "俺は、\n缶を開けた。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1180.mp3"}, {"no": 1181, "sp": "主人公", "text": "お前がまた\n結婚するときにな", "kind": "丸", "ch": "結", "kg": "", "src": "a/1181.mp3"}, {"no": 1182, "sp": "拓海", "text": "そのときは、\n真っ先に\n社長に言います", "kind": "丸", "ch": "結", "kg": "", "src": "a/1182.mp3"}, {"no": 1183, "sp": "主人公", "text": "拓海は、\nそう言って笑った。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1183.mp3"}, {"no": 1184, "sp": "主人公", "text": "俺はというと、\n浮いた仕送りで、\n温泉の宿を取った。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1184.mp3"}, {"no": 1185, "sp": "主人公", "text": "来月、じいちゃんと\n佳代おばさんを、\n連れていく。", "kind": "四角", "ch": "結", "kg": "", "src": "a/1185.mp3"}];

// 受け口のコメント（足した順の並び）を、行ごと・人ごとに一番新しいものだけにする
function toRows(list) {
  const last = {};
  for (const c of list) {
    const k = c.shot + "|" + c.name;
    if (!last[k] || String(c.saved) >= String(last[k].saved)) last[k] = c;
  }
  const rows = {};
  for (const c of Object.values(last)) {
    if (c.comment === DELETED) continue;
    (rows[c.shot] ||= []).push({name: c.name, comment: c.comment, at: c.saved});
  }
  return rows;
}

let RATE = SPEEDS.includes(Number(store.get("kn_rate"))) ? Number(store.get("kn_rate")) : 1;

// PCではコメント欄にいつもカーソルを入れておく。iPhoneではキーボードが出たままになるので入れない

let lastCh = null, lastKg = null;
ITEMS.forEach((it, i) => {

// 画面を消さない（使える端末だけ）

// 行の音声は、先の行の分までこの端末に読み込んでおく（行が変わるたびにネットへ取りに行くと、行と行のあいだが空くため）
const AHEAD = 10;
function prefetch(i) {

  n.loading = true;
  fetch(n.src).then(r => { if (!r.ok) throw new Error(String(r.status)); return r.blob(); })
    .then(b => { n.blob = URL.createObjectURL(new Blob([b], {type: "audio/mpeg"})); })
    .catch(() => {})
    .finally(() => { n.loading = false; });
}

// 読み込んであればそれを、まだならネットの音声を鳴らす
function setSrc(a, i) { const it = ITEMS[i]; a.line = i; a.defaultPlaybackRate = RATE; a.src = it.blob || it.src; a.playbackRate = RATE; a.preservesPitch = true; }
// iPhoneは、マイクを使ったあと音の出方が録音用のまま戻らず、音が出なくなることがある。
// 再生の前に音の出方を「再生」に戻す（使える端末だけ）

function makeAudio() {
  const a = new Audio();
  a.preload = "auto";
  a.addEventListener("ended", () => { if (a === audio && !a.warmup) advance(); });
  a.addEventListener("error", () => {
    if (a !== audio || !playing) return;
    // 読み込んでおいた音声で鳴らせなかったときは、ネットの音声で鳴らし直す
    const it = ITEMS[a.line];
    if (it && it.blob && a.src === it.blob) {
      URL.revokeObjectURL(it.blob); it.blob = null;
      a.src = it.src;
      const p = a.play();
      if (p && p.catch) p.catch(playFailed);
      return;
    }
    status("音声を読み込めませんでした。次の行へ進みます"); setTimeout(advance, 800);
  });

}
audio = makeAudio();
function playFailed() { if (playing) { stop(); status("音が出ませんでした。▶を押してください"); } }
function playCurrent() {
  sessionPlayback();
  clearTimeout(timer); audio.pause();
  show();
  const it = ITEMS[idx];
  if (it.src) {
    setSrc(audio, idx);
    const p = audio.play();
    if (p && p.catch) p.catch(playFailed);
  } else { timer = setTimeout(advance, it.wait * 1000 / RATE); }
  prefetchFrom(idx + 1);
}
function advance() {
  if (!playing) return;
  if (idx < ITEMS.length - 1) { idx++; playCurrent(); } else { stop(); }
}
function start() { sessionPlayback(); playing = true; $("play").textContent = "❚❚ 止める"; keepAwake(true); playCurrent(); }
function stop() { playing = false; clearTimeout(timer); audio.pause(); $("play").textContent = "▶ 再生"; keepAwake(false); }
function toggle() { playing ? stop() : start(); }
function step(n) { idx = Math.max(0, Math.min(ITEMS.length - 1, idx + n)); if (playing) playCurrent(); else { show(); prefetchFrom(idx); } }

async function loadComments() {
  try {
    const r = await fetch(`${API}?video=${encodeURIComponent(VKEY)}`, {cache: "no-store"});
    if (!r.ok) return;
    const j = await r.json(); comments = toRows(j.comments || []); paintComments();
  } catch (e) {}
}
// i 番目の行に、自分の名前でコメントを保存する（空なら消す）。保存できたら true
async function postComment(i, t) {
  const it = ITEMS[i];
  try {
    const r = await fetch(API, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({video: VKEY, time: it.no, shot: it.no, texts: it.sp, name: myName, comment: t || DELETED})});
    if (!r.ok) throw new Error(String(r.status));
    const j = await r.json(); if (!j.ok) throw new Error(j.error || "");
    comments = toRows(j.comments || []); paintComments();
    return true;
  } catch (e) { return false; }
}
// 保存できたら true。電波が悪くて保存できなかったときは、欄の文字を残して false
async function save(thenPlay) {
  if (!myName) { askName(); return false; }
  const it = ITEMS[idx];
  const t = cin.value.trim();
  if (!(await postComment(idx, t))) {
    status("保存できませんでした。電波のよい所で、もう一度保存してください");
    return false;
  }
  status(t ? `${it.no}行目のコメントを保存しました` : `${it.no}行目のコメントを消しました`);
  cin.value = ""; editing = false;

}
cin.addEventListener("blur", keepFocus);
window.addEventListener("focus", keepFocus);
// 欄が空のときにスペースを押したら、文字は入れずに再生・停止にする（日本語入力の全角スペースも）
const onlySpace = () => cin.value !== "" && !cin.value.trim();
const spaceToggle = () => { cin.value = ""; toggle(); };
cin.addEventListener("beforeinput", e => {
  if (TOUCH) return;
  if (!e.isComposing && e.inputType === "insertText" && (e.data === " " || e.data === "　") && !cin.value.trim()) {
    e.preventDefault(); spaceToggle();
  }
});
cin.addEventListener("compositionend", () => { if (!TOUCH && onlySpace()) spaceToggle(); });
cin.addEventListener("input", e => {
  if (!TOUCH && onlySpace()) { if (!e.isComposing) spaceToggle(); return; }
  if (playing && cin.value.trim()) stop();
});
cin.addEventListener("keydown", e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (ptt) return;  // 音声入力の途中はほかのキーを受けない
  const empty = !cin.value.trim();
  if (e.key === "Enter") {
    e.preventDefault();
    if (editing) save(false); else if (!empty) save(true); else toggle();
  } else if (e.key === " " && empty) { e.preventDefault(); cin.value = ""; toggle(); }
  else if (e.key === "ArrowLeft" && empty) { e.preventDefault(); step(-1); }
  else if (e.key === "ArrowRight" && empty) { e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp" && empty && !editing) { e.preventDefault(); idx = Math.max(0, idx - 1); start(); }  // 欄が空なら、止めずに前の行から続けて再生
  else if (e.key === "ArrowUp") { e.preventDefault(); if (playing) stop(); idx = Math.max(0, idx - 1); show(); }
  else if (e.key === "ArrowDown" && empty && !editing) { e.preventDefault(); idx = Math.min(ITEMS.length - 1, idx + 1); start(); }  // 欄が空なら、止めずに次の行から続けて再生
  else if (e.key === "ArrowDown") { e.preventDefault(); if (playing) stop(); idx = Math.min(ITEMS.length - 1, idx + 1); show(); }
  else if (e.key === "Escape") { e.preventDefault(); cin.value = ""; editing = false; }
});
$("csave").onclick = () => { if (editing || cin.value.trim()) save(!editing); };
$("play").onclick = () => { toggle(); keepFocus(); };
$("prev").onclick = () => { step(-1); keepFocus(); };
$("next").onclick = () => { step(1); keepFocus(); };

// 名前（コメントに付く）。この端末に覚えておく
function askName() { $("namebox").hidden = false; $("nin").value = myName; setTimeout(() => $("nin").focus(), 0); }
function paintName() { $("who").textContent = `名前：${myName || "—"}`; }
$("nok").onclick = () => {
  const v = $("nin").value.trim().slice(0, 40);
  if (!v) return;

  paintName(); paintComments(); keepFocus();
};
$("nin").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); $("nok").click(); } });
$("who").onclick = askName;
$("spd").onclick = () => { RATE = SPEEDS[(SPEEDS.indexOf(RATE) + 1) % SPEEDS.length]; store.set("kn_rate", String(RATE)); paintRate(); if (audio) { audio.defaultPlaybackRate = RATE; audio.playbackRate = RATE; } keepFocus(); };
paintRate();

// 押している間だけ音声入力（🎤 を押したまま、PCでは Ctrl を長押しでも）。
// 押している間の声を録音し、離したらネットの文字起こし（Whisper）で文字にして、その行に自分の名前で保存する。
// 離したその場で、止めたところから続きを流す（iPhoneは、指を離した操作の中でないと音を出せない）
const CAN_REC = false;
const mic = $("mic");
let ptt = null, pttTimer = null;
// 何も話さずに録音したとき、文字起こしが出しがちな決まり文句は、聞き取れなかったものとして扱う
const EMPTY_WORDS = ["ご視聴ありがとうございました", "ご視聴ありがとうございました。", "ご覧いただきありがとうございます", "ありがとうございました", "ありがとうございました。"];
// 🎤の動きの記録。うまくいかないときに、どこで止まったかをサーバー側で見る（保存はしない）
function dbg(ev, detail) { return;
  try {
    const body = JSON.stringify({ev, detail, name: myName, ua: navigator.userAgent, t: new Date().toISOString()});
    const u = `/api/log?proj=${encodeURIComponent(PROJ)}`;
    if (navigator.sendBeacon) navigator.sendBeacon(u, body); else fetch(u, {method: "POST", body, keepalive: true});
  } catch (e) {}
}
// 🎤の状態を、押している指に隠れない画面の上に大きく出す
let recbarTimer = null;
function recBar(kind, main, sub, ms) {
  const b = $("recbar");
  clearTimeout(recbarTimer);
  if (!kind) { b.hidden = true; return; }
  b.className = kind; b.hidden = false;
  b.textContent = main;
  if (sub) { const s = document.createElement("small"); s.textContent = sub; b.appendChild(s); }
  if (ms) recbarTimer = setTimeout(() => { b.hidden = true; }, ms);
}
const mmss = ms => { const t = Math.floor(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
function recType(p) { return (p.rec && p.rec.mimeType) || (p.chunks[0] && p.chunks[0].type) || "audio/mp4"; }
// 話している途中も、2.5秒ごとにそこまでの声を文字にして、コメント欄に出していく
function interim(p) {
  if (p.busy || !p.chunks.length || Date.now() - (p.lastSent || p.startAt) < 2500) return;
  p.busy = true; p.lastSent = Date.now();
  const blob = new Blob(p.chunks.slice(), {type: recType(p)});
  fetch(`/api/transcribe?proj=${encodeURIComponent(PROJ)}`, {method: "POST", headers: {"Content-Type": blob.type}, body: blob})
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      const t = ((j && j.text) || "").trim();
      if (t && !EMPTY_WORDS.includes(t) && !p.finalDone) { p.interim = t; cin.value = t; cin.classList.add("interim"); }
    })
    .catch(() => {})
    .finally(() => { p.busy = false; });
}
function stopTracks(p) { try { if (p.stream) p.stream.getTracks().forEach(t => t.stop()); } catch (e) {} }
function pttStart(by) {
  pttTimer = null;
  if (ptt) return;
  if (!myName) { askName(); return; }
  if (!CAN_REC) {
    status("この端末では🎤が使えません。コメント欄を押して、キーボードのマイクで話してください");
    cin.focus(); return;
  }
  const p = {idx, by, released: false, chunks: [], startAt: 0, line: audio.line, time: audio.currentTime, ended: audio.ended};
  ptt = p;
  dbg("start", {row: ITEMS[idx].no, audioSession: !!navigator.audioSession});
  playing = false; clearTimeout(timer); audio.pause(); $("play").textContent = "▶ 再生";
  mic.classList.add("on"); mic.textContent = "🎤 準備中…";
  recBar("prep", "🎤 準備中…", "まだ話さないでください");
  status(`${ITEMS[idx].no}行目へのコメント：🎤を押したまま話してください（離すと保存して、続きを再生します）`);
  // 音の出し方が「再生」のままだと、iPhoneはマイクを開けない（InvalidStateError）ので、録音できる出し方に切り替える
  sessionRecord();
  // 通話向けの加工（エコー消しなど）を使うと、iPhoneが通話の音の出し方（耳に当てる側・遅い音）に切り替わるので使わない
  navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}}).then(stream => {
    p.stream = stream;
    dbg("mic-ok", {released: p.released});
    if (p.released) { stopTracks(p); p.tracksOff = true; return; }  // 許可の画面が出て、指を離したとき
    let rec;
    try { rec = new MediaRecorder(stream); } catch (e) { stopTracks(p); dbg("rec-fail", String(e)); status("録音を始められませんでした"); return; }
    p.rec = rec;
    rec.ondataavailable = e => { if (e.data && e.data.size) p.chunks.push(e.data); };
    rec.onerror = e => dbg("rec-error", String((e && e.error) || e));
    // 録音が止まりきってから、マイクを切る（先に切ると、iPhoneでは録音が空になることがある）
    rec.onstop = () => {
      stopTracks(p); p.tracksOff = true;
      dbg("rec-stop", {chunks: p.chunks.length, size: p.chunks.reduce((n, c) => n + c.size, 0), mime: rec.mimeType});
      sendTalk(p);
    };
    rec.start(250);  // 0.25秒ごとに録音をためていく
    p.startAt = Date.now();
    dbg("rec-start", {mime: rec.mimeType});
    if (ptt === p) {
      mic.textContent = "🎤 聞いています";
      recBar("rec", "🔴 話してください　0:00", `${ITEMS[p.idx].no}行目へのコメント（離すと保存）`);
      p.tick = setInterval(() => {
        if (ptt !== p) { clearInterval(p.tick); return; }
        recBar("rec", `🔴 話してください　${mmss(Date.now() - p.startAt)}`, `${ITEMS[p.idx].no}行目へのコメント（離すと保存）`);
        interim(p);
      }, 500);

    p.denied = true; p.tracksOff = true;
    dbg("mic-fail", String(err && (err.name + ": " + err.message)));
    status("マイクを使えませんでした。設定でこのサイトのマイクを許可するか、コメント欄を押して、キーボードのマイクで話してください");
    recBar("prep", "マイクを使えませんでした", "設定でマイクを許可するか、コメント欄を押してキーボードのマイクで話してください", 5000);
  });

}
function pttEnd(by) {
  if (pttTimer) { clearTimeout(pttTimer); pttTimer = null; }
  const p = ptt;
  if (!p || p.released) return;
  if (by && p.by !== by) return;  // Ctrl で始めたものは 🎤 では終えない（逆も同じ）
  p.released = true; ptt = null;
  clearTimeout(p.cap); clearInterval(p.tick);
  mic.classList.remove("on"); mic.textContent = "🎤 押して話す";
  p.short = !p.startAt || Date.now() - p.startAt < 600;
  dbg("end", {ms: p.startAt ? Date.now() - p.startAt : 0, rec: p.rec ? p.rec.state : "none"});
  if (p.rec && p.rec.state !== "inactive") {
    try { p.rec.stop(); } catch (e) { stopTracks(p); p.tracksOff = true; }
    setTimeout(() => { if (!p.tracksOff) { stopTracks(p); p.tracksOff = true; } }, 2000);  // 止まったしらせが来ないとき
  } else { stopTracks(p); p.tracksOff = true; }
  resumeAfterTalk(p);
  if (!p.rec && !p.denied) {
    status("準備中に離しました。赤い「話してください」が出てから話してください");
    recBar("prep", "準備中に離しました", "赤い「話してください」が出てから話してください", 3000);
  } else if (p.rec) recBar("busy", "文字にしています…", `${ITEMS[p.idx].no}行目へのコメント`);
}
// 止めたところから続きを流す。音を出す部品は新しく作り直す（マイクのあとに古い部品が鳴らなくなることがあるため）
// iPhoneは、指を離したこの操作の中でないと鳴らせないので、ここで音を消して鳴らし始めておき、
// マイクが閉じきってから（0.7秒後）音の出方を「再生」に戻して、止めたところから音を出す
function resumeAfterTalk(p) {
  idx = p.idx;
  const it = ITEMS[idx];
  const old = audio;
  audio = makeAudio();
  try { old.pause(); old.removeAttribute("src"); old.load(); } catch (e) {}
  playing = true; $("play").textContent = "❚❚ 止める"; keepAwake(true); show();
  if (!it.src) { timer = setTimeout(advance, it.wait * 1000 / RATE); return; }
  const a = audio;
  const t = (p.line === idx && !p.ended) ? p.time : 0;
  setSrc(a, idx);
  a.muted = true; a.warmup = true;
  const pr = a.play();
  if (pr && pr.catch) pr.catch(() => {});
  let waited = 0;
  const go = () => {
    if (a !== audio || !playing) { a.warmup = false; return; }
    if (!p.tracksOff && waited < 2000) { waited += 200; setTimeout(go, 200); return; }
    sessionPlayback();
    try { a.pause(); a.currentTime = t; } catch (e) {}
    a.muted = false; a.warmup = false;
    const p2 = a.play();
    if (p2 && p2.catch) p2.catch(playFailed);
  };
  setTimeout(go, 700);
  prefetchFrom(idx + 1);
}
// 録音をネットに送って文字にし、その行に保存する（同じ行に自分のコメントがあれば、うしろに足す）
async function sendTalk(p) {
  const done = (kind, main, sub) => { cin.classList.remove("interim"); recBar(kind, main, sub, kind ? 3000 : 0); };
  if (p.short || !p.chunks.length) {
    dbg("too-short", {short: p.short, chunks: p.chunks.length});
    cin.value = ""; done("prep", "短すぎて聞き取れませんでした", "赤い「話してください」が出てから、押したまま話してください");
    status("短すぎて聞き取れませんでした。🎤を押したまま話してください"); return; }
  const type = recType(p);
  const blob = new Blob(p.chunks, {type});
  const row = ITEMS[p.idx];
  status(`${row.no}行目のコメントを文字にしています…`);
  let text = "";
  try {
    const r = await fetch(`/api/transcribe?proj=${encodeURIComponent(PROJ)}`, {method: "POST", headers: {"Content-Type": type}, body: blob});
    if (!r.ok) throw new Error(String(r.status));
    text = ((await r.json()).text || "").trim();
    dbg("text", {len: text.length, text: text.slice(0, 40)});
  } catch (e) {
    dbg("text-fail", String(e));
    text = p.interim || "";
    if (!text) {
      cin.value = ""; done("prep", "文字にできませんでした", "電波のよい所で、もう一度🎤を押したまま話してください");
      status(`${row.no}行目：文字にできませんでした。電波のよい所で、もう一度🎤を押したまま話してください`);
      return;
    }
  }
  p.finalDone = true;
  if (!text || EMPTY_WORDS.includes(text)) text = p.interim || "";
  if (!text) {
    cin.value = ""; done("prep", "聞き取れませんでした", "もう一度🎤を押したまま話してください");
    status(`${row.no}行目：聞き取れませんでした。もう一度🎤を押したまま話してください`); return; }
  cin.value = text;
  const mine = (comments[row.no] || []).find(c => c.name === myName);
  const full = mine ? `${mine.comment}\n${text}` : text;
  if (await postComment(p.idx, full)) {
    if (cin.value === text) cin.value = "";
    done("", ""); status(`${row.no}行目に保存しました：${text}`);
  } else {
    cin.classList.remove("interim"); cin.value = text; idx = p.idx; stop(); show();
    recBar("prep", "保存できませんでした", "電波のよい所で「保存」を押してください", 4000);
    status(`${row.no}行目のコメントを保存できませんでした。電波のよい所で「保存」を押してください`);
  }
}
if (CAN_REC) {
  mic.hidden = false;
  mic.addEventListener("pointerdown", e => { e.preventDefault(); pttStart("hold"); });
  mic.addEventListener("pointerup", () => pttEnd("hold"));
  mic.addEventListener("pointercancel", () => pttEnd("hold"));
  mic.addEventListener("pointerleave", () => pttEnd("hold"));
  mic.addEventListener("contextmenu", e => e.preventDefault());
} else if (TOUCH) {
  cin.placeholder = "ここを押して、キーボードのマイクで話してください";
}
// Ctrl を 0.3秒押し続けたら音声入力。Ctrl と一緒に別のキーを押したとき（ショートカット）は音声入力にしない
document.addEventListener("keydown", e => {
  if (!$("namebox").hidden) return;
  if (e.key === "Control") { if (!e.repeat && !ptt && !pttTimer) {} }
  else if (pttTimer) { clearTimeout(pttTimer); pttTimer = null; }
}, true);
document.addEventListener("keyup", e => { if (e.key === "Control") pttEnd("key"); }, true);
window.addEventListener("blur", () => pttEnd());
document.addEventListener("visibilitychange", () => { if (document.hidden) pttEnd(); });
// 再生中に🎤が押せないことがあったので、再生中に画面のどこを触ったかを動きの記録に出して確かめる（原因が分かったら外す）
document.addEventListener("touchstart", e => {
  if (!playing) return;
  const t = e.target, pt = e.touches && e.touches[0];
  dbg("touch", {on: t ? (t.id || String(t.className || t.tagName)) : "", y: pt ? Math.round(pt.clientY) : -1,
    ih: innerHeight, vv: window.visualViewport ? Math.round(visualViewport.height) : 0});
}, {capture: true, passive: true});

if (!VKEY) { document.body.innerHTML = "<p style=\"padding:24px\">お渡ししたリンクから開いてください</p>"; throw new Error("no slot"); }
paintName();
if (!myName) askName();
loadComments().then(show);
prefetchFrom(0);
keepFocus();
dbg("open", {page: PAGE_ID, list: "scroller", ih: innerHeight, vv: window.visualViewport ? Math.round(visualViewport.height) : 0});
(() => {
  const pend = once.get("kn_pending");
  if (pend) {
    cin.value = pend; once.del("kn_pending");
    status(`新しい版（${PAGE_ID}）に切り替わりました。前のページで入力していた文字を戻したので、行を選び直して保存してください`);
  }
})();
// 新しい版のページができたら、自分で切り替わる（入力中の文字があるときは待つ）
setInterval(async () => {
  try {
    return;
    if (j.page === PAGE_ID) return;
    if (!cin.value.trim() && !editing && !ptt) location.replace(`../${j.page}/`);
    else status("新しい版のページができました。入力中の文字を保存すると切り替わります");
  } catch (e) {}
}, 5000);
// ほかの人のコメントも、ときどき読み直して出す
setInterval(() => { if (!cin.value.trim() && !editing && !ptt) loadComments(); }, 15000);
</script>
