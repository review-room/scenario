<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シナリオ添削ツール">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="../manifest.json">
<title>シナリオ添削ツール</title>
<style>
  :root { --bg:#f7f7f5; --card:#ffffff; --ink:#1d1d1b; --sub:#6b6b66; --line:#e2e2dc; --now:#fff4b8; --nowline:#e0a800; --cm:#c0392b; --cmbg:#fdecea; --ot:#35607f; --otbg:#e8f0f6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif; }
  /* 画面全体は動かさず、行の一覧（#scroller）だけを動かす。iPhoneのSafariは画面全体が動くと下のバーが縮み、
     下に固定したボタンの見た目と押せる位置がずれて、🎤が押せなくなることがあるため */
  html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; height:100dvh; }
  #scroller { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; position:relative; -webkit-overflow-scrolling:touch; }
  header { position:relative; flex:0 0 auto; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:10px 14px 8px; padding-top:calc(10px + env(safe-area-inset-top)); }
  .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  h1 { font-size:14px; margin:0; font-weight:600; color:var(--sub); flex:1 1 auto; min-width:0; }
  .now { font-size:24px; font-weight:700; }
  .now small { font-size:13px; color:var(--sub); font-weight:400; margin-left:4px; }
  button { font:inherit; font-size:16px; padding:8px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  button.main { background:#1d1d1b; color:#fff; border-color:#1d1d1b; }
  .who { font-size:13px; padding:6px 10px; color:var(--sub); }
  .cbox { margin-top:8px; }
  .cbox label { display:block; font-size:14px; font-weight:600; margin-bottom:4px; }
  .crow { display:flex; gap:8px; }
  .crow input { flex:1; font:inherit; font-size:17px; padding:10px 12px; border:2px solid var(--line); border-radius:10px; min-width:0; background:#fff; color:var(--ink); }
  .crow input:focus { outline:none; border-color:var(--cm); }
  .status { font-size:13px; color:var(--sub); margin-top:6px; min-height:18px; }
  .help { font-size:12px; color:var(--sub); margin-top:2px; }
  main { max-width:760px; margin:0 auto; padding:10px 12px calc(120px + env(safe-area-inset-bottom)); }
  .row { display:grid; grid-template-columns:48px 64px 1fr; gap:8px; align-items:start; background:var(--card); border:1px solid var(--line); border-left:8px solid #ccc; border-radius:8px; padding:10px; margin:6px 0; cursor:pointer; }
  .row .no { font-size:19px; font-weight:700; text-align:right; }
  .row .sp { font-size:13px; color:var(--sub); padding-top:4px; }
  .row .tx { font-size:17px; line-height:1.5; white-space:pre-line; }
  .row.kaku .tx::before { content:"□ "; color:#aaa; font-size:12px; }
  .row.tag { opacity:.55; }
  .row.tag .tx { font-size:14px; color:var(--sub); }
  .row.now { background:var(--now); outline:2px solid var(--nowline); }
  .row .cm { grid-column:1 / 4; display:none; }
  .row.has .cm { display:block; }
  .c1 { background:var(--otbg); color:var(--ot); border-radius:6px; padding:6px 10px; font-size:15px; margin-top:4px; white-space:pre-wrap; }
  .c1.mine { background:var(--cmbg); color:var(--cm); }
  .ch { font-size:13px; color:var(--sub); margin:18px 0 4px; font-weight:600; }
  .kg { font-size:15px; font-weight:700; margin:16px 0 4px; padding:6px 10px; background:#efeaf6; border-radius:6px; }
  nav.bar { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; gap:8px; padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.96); border-top:1px solid var(--line); }
  nav.bar button { flex:1; font-size:16px; padding:14px 4px; white-space:nowrap; }
  nav.bar #prev, nav.bar #next { flex:0.8; }
  nav.bar #play { flex:1.1; }
  #mic { flex:1.9; background:#fff; border:2px solid var(--cm); color:var(--cm); font-weight:700; touch-action:none; -webkit-touch-callout:none; }
  #mic.on { background:var(--cm); color:#fff; }
  #recbar { position:fixed; left:12px; right:12px; top:calc(8px + env(safe-area-inset-top)); z-index:9; padding:14px 12px; border-radius:12px; font-size:20px; font-weight:700; text-align:center; color:#fff; box-shadow:0 4px 16px rgba(0,0,0,.25); }
  #recbar[hidden] { display:none; }
  #recbar.prep { background:#b7791f; }
  #recbar.rec { background:#c0392b; }
  #recbar.busy { background:#35607f; }
  #recbar small { display:block; font-size:14px; font-weight:400; margin-top:2px; }
  .crow input.interim { color:#8a8a84; border-color:var(--cm); }
  .modal { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal[hidden] { display:none; }
  .modal .card { background:#fff; border-radius:12px; padding:18px; width:100%; max-width:360px; }
  .modal p { margin:0 0 10px; font-size:15px; }
  .modal input { width:100%; font:inherit; font-size:17px; padding:10px 12px; border:2px solid var(--line); border-radius:10px; margin-bottom:10px; }
  .modal button { width:100%; }
  @media (pointer:coarse) { .pc { display:none; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1><span style="color:var(--ink);font-weight:700">シナリオ添削ツール</span>　テスト添削</h1>
    <div class="now" id="now">— <small>行目</small></div>
    <button id="spd" class="who">1倍</button> <button id="who" class="who">名前：—</button>
  </div>
  <div class="cbox">
    <label id="clabel">—行目へのコメント</label>
    <div class="crow">
      <input id="cin" type="text" autocomplete="off" enterkeyhint="done" placeholder="ここに入力（Enterで保存）">
      <button id="csave">保存</button>
    </div>
  </div>
  <div class="status" id="status"></div>
  <div id="recbar" hidden></div>
  <div class="help pc">欄が空のとき：Enter・スペース＝再生／止める、←→＝前・次の行、↑↓＝前・次の行から続けて再生／入力中：↑↓＝コメントを付ける行を選び直す、Esc＝入力を消す／行を押すとそこから再生／自分のコメント（赤）を押すと書き直せます（空にして保存すると消えます）</div>
</header>
<div id="scroller"><main id="list"></main></div>
<nav class="bar">
  <button id="prev">◀ 前</button>
  <button id="play" class="main">▶ 再生</button>
  <button id="next">次 ▶</button>
  <button id="mic" hidden>🎤 押して話す</button>
</nav>
<div id="namebox" class="modal" hidden>
  <div class="card">
    <p>コメントに付ける名前を入れてください</p>
    <input id="nin" type="text" maxlength="40" autocomplete="off" placeholder="例：山田">
    <button id="nok" class="main">決める</button>
  </div>
</div>
<script>
const ITEMS = [{"no": 2, "sp": "莉子", "text": "中卒の兄は\n恥なんだから、", "kind": "丸", "ch": "サムネ箇所", "kg": "", "src": "a/002.mp3"}, {"no": 3, "sp": "莉子", "text": "死んだことに\nなってんのよ", "kind": "丸", "ch": "サムネ箇所", "kg": "", "src": "a/003.mp3"}, {"no": 4, "sp": "主人公", "text": "妹の莉子は笑って、\n俺の頭の上で\nグラスを傾けた。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/004.mp3"}, {"no": 5, "sp": "主人公", "text": "赤ワインが\n髪を伝って、\n顎から落ちていく。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/005.mp3"}, {"no": 6, "sp": "主人公", "text": "今日は、\n莉子の結婚式だ。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/006.mp3"}, {"no": 7, "sp": "主人公", "text": "披露宴の前の\nロビーには、\n招待客が大勢いる。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/007.mp3"}, {"no": 8, "sp": "主人公", "text": "招待客の何人かが、\nこちらを振り返った。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/008.mp3"}, {"no": 9, "sp": "主人公", "text": "莉子は空になった\nグラスを、\n軽く振ってみせた。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/009.mp3"}, {"no": 10, "sp": "莉子", "text": "結婚式、来るな", "kind": "丸", "ch": "サムネ箇所", "kg": "", "src": "a/010.mp3"}, {"no": 11, "sp": "主人公", "text": "ロビーがざわついた。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/011.mp3"}, {"no": 12, "sp": "主人公", "text": "俺は肩に落ちた\n滴を払わずに、\n莉子の顔を見た。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/012.mp3"}, {"no": 13, "sp": "主人公", "text": "わかった", "kind": "丸", "ch": "サムネ箇所", "kg": "", "src": "a/013.mp3"}, {"no": 14, "sp": "主人公", "text": "俺はそれだけ言って、\n出口に向かった。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/014.mp3"}, {"no": 15, "sp": "主人公", "text": "出口の扉の前で、\n後ろを振り返る。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/015.mp3"}, {"no": 16, "sp": "主人公", "text": "新郎の拓海が、\n莉子の前に\n駆け込んできていた。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/016.mp3"}, {"no": 17, "sp": "主人公", "text": "拓海の目には、\n涙が浮かんでいる。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/017.mp3"}, {"no": 18, "sp": "拓海", "text": "俺の命の恩人の\nお兄さん、", "kind": "丸", "ch": "サムネ箇所", "kg": "", "src": "a/018.mp3"}, {"no": 19, "sp": "拓海", "text": "亡くなったの？", "kind": "丸", "ch": "サムネ箇所", "kg": "", "src": "a/019.mp3"}, {"no": 20, "sp": "主人公", "text": "莉子はグラスを\n持ったまま、\n拓海を見た。", "kind": "四角", "ch": "サムネ箇所", "kg": "", "src": "a/020.mp3"}, {"no": 21, "sp": "莉子", "text": "え？", "kind": "丸", "ch": "サムネ箇所", "kg": "", "src": "a/021.mp3"}, {"no": 22, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "サムネ箇所", "kg": "", "wait": 0.8}, {"no": 23, "sp": "主人公", "text": "月曜の朝。\nマンションの\n建築現場。", "kind": "四角", "ch": "起", "kg": "", "src": "a/023.mp3"}, {"no": 24, "sp": "主人公", "text": "俺は作業着で、\n足場の下を\n見て回っていた。", "kind": "四角", "ch": "起", "kg": "", "src": "a/024.mp3"}, {"no": 25, "sp": "主人公", "text": "俺は白木蓮、35歳。", "kind": "四角", "ch": "起", "kg": "", "src": "a/025.mp3"}, {"no": 26, "sp": "主人公", "text": "中学を出てすぐ、\n正岡建設の\n現場に入った。", "kind": "四角", "ch": "起", "kg": "", "src": "a/026.mp3"}, {"no": 27, "sp": "主人公", "text": "7年前に、\n親方から\n会社を継いだ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/027.mp3"}, {"no": 28, "sp": "主人公", "text": "親方は、中卒の俺を\n一から\n仕込んでくれた。", "kind": "四角", "ch": "起", "kg": "", "src": "a/028.mp3"}, {"no": 29, "sp": "主人公", "text": "社名は、今も\n親方の名字の\n正岡のままだ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/029.mp3"}, {"no": 30, "sp": "主人公", "text": "今は、その会社の\n社長をしている。", "kind": "四角", "ch": "起", "kg": "", "src": "a/030.mp3"}, {"no": 31, "sp": "主人公", "text": "社員は120人いる。", "kind": "四角", "ch": "起", "kg": "", "src": "a/031.mp3"}, {"no": 32, "sp": "主人公", "text": "それでも毎朝、\nこうして現場に\n顔を出している。", "kind": "四角", "ch": "起", "kg": "", "src": "a/032.mp3"}, {"no": 33, "sp": "主人公", "text": "事務所の椅子より、\nここのほうが\n落ち着くからだ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/033.mp3"}, {"no": 34, "sp": "主人公", "text": "朝の現場は、\nコンクリートと鉄の\n匂いがする。", "kind": "四角", "ch": "起", "kg": "", "src": "a/034.mp3"}, {"no": 35, "sp": "拓海", "text": "社長、\nおはようございます", "kind": "丸", "ch": "起", "kg": "", "src": "a/035.mp3"}, {"no": 36, "sp": "主人公", "text": "所長の大森拓海が、\n段取りの表を持って\n駆け寄ってきた。", "kind": "四角", "ch": "起", "kg": "", "src": "a/036.mp3"}, {"no": 37, "sp": "拓海", "text": "今週の段取りです", "kind": "丸", "ch": "起", "kg": "", "src": "a/037.mp3"}, {"no": 38, "sp": "拓海", "text": "金曜のコンクリートの\n打設だけ、\n天気が怪しいですね", "kind": "丸", "ch": "起", "kg": "", "src": "a/038.mp3"}, {"no": 39, "sp": "主人公", "text": "木曜の夕方に\n決めよう", "kind": "丸", "ch": "起", "kg": "", "src": "a/039.mp3"}, {"no": 40, "sp": "主人公", "text": "職人さんには、\n予備の日も\n伝えておいてくれ", "kind": "丸", "ch": "起", "kg": "", "src": "a/040.mp3"}, {"no": 41, "sp": "拓海", "text": "分かりました", "kind": "丸", "ch": "起", "kg": "", "src": "a/041.mp3"}, {"no": 42, "sp": "主人公", "text": "拓海は31歳。\n大学を出て、\n新卒でうちに入った。", "kind": "四角", "ch": "起", "kg": "", "src": "a/042.mp3"}, {"no": 43, "sp": "主人公", "text": "今は、この現場を\n任せている所長だ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/043.mp3"}, {"no": 44, "sp": "主人公", "text": "拓海は職人たちに\n頭を下げながら、\n朝礼を仕切っていく。", "kind": "四角", "ch": "起", "kg": "", "src": "a/044.mp3"}, {"no": 45, "sp": "主人公", "text": "朝礼が終わると、\n足場の点検には、\n自分で上がっていく。", "kind": "四角", "ch": "起", "kg": "", "src": "a/045.mp3"}, {"no": 46, "sp": "職人", "text": "所長、\n3階の型枠、\n見てもらえますか？", "kind": "丸", "ch": "起", "kg": "", "src": "a/046.mp3"}, {"no": 47, "sp": "拓海", "text": "すぐ行きます", "kind": "丸", "ch": "起", "kg": "", "src": "a/047.mp3"}, {"no": 48, "sp": "拓海", "text": "ボルトの数、\nもう一度\n数えといてください", "kind": "丸", "ch": "起", "kg": "", "src": "a/048.mp3"}, {"no": 49, "sp": "主人公", "text": "拓海は、職人より\n先にはしごを\n上っていく。", "kind": "四角", "ch": "起", "kg": "", "src": "a/049.mp3"}, {"no": 50, "sp": "柴田", "text": "所長、\nまた一番に\n上がってますよ", "kind": "丸", "ch": "起", "kg": "", "src": "a/050.mp3"}, {"no": 51, "sp": "主人公", "text": "職長の柴田さんが、\n足場を見上げて\n笑っている。", "kind": "四角", "ch": "起", "kg": "", "src": "a/051.mp3"}, {"no": 52, "sp": "拓海", "text": "柴田さんに\n言われたくないですよ", "kind": "丸", "ch": "起", "kg": "", "src": "a/052.mp3"}, {"no": 53, "sp": "柴田", "text": "俺はもう年だからな。\n所長に任せるよ", "kind": "丸", "ch": "起", "kg": "", "src": "a/053.mp3"}, {"no": 54, "sp": "主人公", "text": "職人たちの間から、\n笑い声が上がった。", "kind": "四角", "ch": "起", "kg": "", "src": "a/054.mp3"}, {"no": 55, "sp": "主人公", "text": "点検を終えて\n降りてきた拓海が、\nふと俺の右手を見た。", "kind": "四角", "ch": "起", "kg": "", "src": "a/055.mp3"}, {"no": 56, "sp": "主人公", "text": "右手の甲には、\n古い傷が残っている。", "kind": "四角", "ch": "起", "kg": "", "src": "a/056.mp3"}, {"no": 57, "sp": "拓海", "text": "その傷を見ると、", "kind": "丸", "ch": "起", "kg": "", "src": "a/057.mp3"}, {"no": 58, "sp": "拓海", "text": "今でもあの日の\n土の重さを\n思い出します", "kind": "丸", "ch": "起", "kg": "", "src": "a/058.mp3"}, {"no": 59, "sp": "主人公", "text": "もう8年も前の話だ", "kind": "丸", "ch": "起", "kg": "", "src": "a/059.mp3"}, {"no": 60, "sp": "主人公", "text": "8年前、\n新人だった拓海が、\n崩れた土に埋まった。", "kind": "四角", "ch": "起", "kg": "", "src": "a/060.mp3"}, {"no": 61, "sp": "主人公", "text": "俺は重機を待たずに、\n素手で土をかいて、\n拓海を掘り出した。", "kind": "四角", "ch": "起", "kg": "", "src": "a/061.mp3"}, {"no": 62, "sp": "主人公", "text": "この傷は、\nそのときに\nできたものだ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/062.mp3"}, {"no": 63, "sp": "拓海", "text": "あのとき社長が\nいなかったら、\n俺はここにいません", "kind": "丸", "ch": "起", "kg": "", "src": "a/063.mp3"}, {"no": 64, "sp": "主人公", "text": "大げさだな", "kind": "丸", "ch": "起", "kg": "", "src": "a/064.mp3"}, {"no": 65, "sp": "主人公", "text": "ほら、仕事に戻れ", "kind": "丸", "ch": "起", "kg": "", "src": "a/065.mp3"}, {"no": 66, "sp": "主人公", "text": "拓海は笑って、\n足場のほうへ\n走っていった。", "kind": "四角", "ch": "起", "kg": "", "src": "a/066.mp3"}, {"no": 67, "sp": "主人公", "text": "昼の休憩。", "kind": "四角", "ch": "起", "kg": "", "src": "a/067.mp3"}, {"no": 68, "sp": "主人公", "text": "資材置き場の日陰で、\n弁当を広げていると、\n拓海が隣に来た。", "kind": "四角", "ch": "起", "kg": "", "src": "a/068.mp3"}, {"no": 69, "sp": "主人公", "text": "拓海の手には、\n缶コーヒーが\n2本ある。", "kind": "四角", "ch": "起", "kg": "", "src": "a/069.mp3"}, {"no": 70, "sp": "主人公", "text": "1本は、\n俺がいつも飲む\n微糖だ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/070.mp3"}, {"no": 71, "sp": "拓海", "text": "社長、\n少しいいですか？", "kind": "丸", "ch": "起", "kg": "", "src": "a/071.mp3"}, {"no": 72, "sp": "主人公", "text": "どうした？\n改まって", "kind": "丸", "ch": "起", "kg": "", "src": "a/072.mp3"}, {"no": 73, "sp": "主人公", "text": "拓海は隣に座って、\n缶を1本\n差し出した。", "kind": "四角", "ch": "起", "kg": "", "src": "a/073.mp3"}, {"no": 74, "sp": "主人公", "text": "それから、しばらく\n何も言わなかった。", "kind": "四角", "ch": "起", "kg": "", "src": "a/074.mp3"}, {"no": 75, "sp": "拓海", "text": "実は俺、\n結婚することに\nなりました", "kind": "丸", "ch": "起", "kg": "", "src": "a/075.mp3"}, {"no": 76, "sp": "主人公", "text": "俺は思わず、\n拓海の背中を叩いた。", "kind": "四角", "ch": "起", "kg": "", "src": "a/076.mp3"}, {"no": 77, "sp": "主人公", "text": "そうか。\nおめでとう", "kind": "丸", "ch": "起", "kg": "", "src": "a/077.mp3"}, {"no": 78, "sp": "主人公", "text": "いつの間に、\nそんな相手が\nいたんだ", "kind": "丸", "ch": "起", "kg": "", "src": "a/078.mp3"}, {"no": 79, "sp": "拓海", "text": "すみません。\nなかなか\n言い出せなくて", "kind": "丸", "ch": "起", "kg": "", "src": "a/079.mp3"}, {"no": 80, "sp": "主人公", "text": "式はいつだ？", "kind": "丸", "ch": "起", "kg": "", "src": "a/080.mp3"}, {"no": 81, "sp": "拓海", "text": "日取りは\nまだですけど、", "kind": "丸", "ch": "起", "kg": "", "src": "a/081.mp3"}, {"no": 82, "sp": "拓海", "text": "秋になると\n思います", "kind": "丸", "ch": "起", "kg": "", "src": "a/082.mp3"}, {"no": 83, "sp": "主人公", "text": "そうか。\nそれで、", "kind": "丸", "ch": "起", "kg": "", "src": "a/083.mp3"}, {"no": 84, "sp": "主人公", "text": "相手は誰だ？", "kind": "丸", "ch": "起", "kg": "", "src": "a/084.mp3"}, {"no": 85, "sp": "主人公", "text": "俺の知ってる人か？", "kind": "丸", "ch": "起", "kg": "", "src": "a/085.mp3"}, {"no": 86, "sp": "主人公", "text": "拓海は缶を\n握ったまま、\n少し黙った。", "kind": "四角", "ch": "起", "kg": "", "src": "a/086.mp3"}, {"no": 87, "sp": "拓海", "text": "白木莉子さんです", "kind": "丸", "ch": "起", "kg": "", "src": "a/087.mp3"}, {"no": 88, "sp": "拓海", "text": "社長の、\n妹さんです", "kind": "丸", "ch": "起", "kg": "", "src": "a/088.mp3"}, {"no": 89, "sp": "主人公", "text": "俺は、口に運びかけた\n缶コーヒーを止めた。", "kind": "四角", "ch": "起", "kg": "", "src": "a/089.mp3"}, {"no": 90, "sp": "主人公", "text": "莉子は、\n俺の5つ下の妹だ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/090.mp3"}, {"no": 91, "sp": "主人公", "text": "家族とは、もう\n何年もまともに\n話していない。", "kind": "四角", "ch": "起", "kg": "", "src": "a/091.mp3"}, {"no": 92, "sp": "主人公", "text": "……莉子と？", "kind": "丸", "ch": "起", "kg": "", "src": "a/092.mp3"}, {"no": 93, "sp": "拓海", "text": "はい", "kind": "丸", "ch": "起", "kg": "", "src": "a/093.mp3"}, {"no": 94, "sp": "主人公", "text": "莉子は、\n元気にしてるか？", "kind": "丸", "ch": "起", "kg": "", "src": "a/094.mp3"}, {"no": 95, "sp": "拓海", "text": "元気です", "kind": "丸", "ch": "起", "kg": "", "src": "a/095.mp3"}, {"no": 96, "sp": "拓海", "text": "よく笑う人ですよ", "kind": "丸", "ch": "起", "kg": "", "src": "a/096.mp3"}, {"no": 97, "sp": "主人公", "text": "……そうか", "kind": "丸", "ch": "起", "kg": "", "src": "a/097.mp3"}, {"no": 98, "sp": "主人公", "text": "俺が知っている\n莉子は、中学に\n上がる前のままだ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/098.mp3"}, {"no": 99, "sp": "主人公", "text": "どこで、\n知り合ったんだ？", "kind": "丸", "ch": "起", "kg": "", "src": "a/099.mp3"}, {"no": 100, "sp": "拓海", "text": "2年前に、\n友達の紹介で", "kind": "丸", "ch": "起", "kg": "", "src": "a/100.mp3"}, {"no": 101, "sp": "拓海", "text": "付き合い始めて、\n莉子さんの\nおじいさんの家に", "kind": "丸", "ch": "起", "kg": "", "src": "a/101.mp3"}, {"no": 102, "sp": "拓海", "text": "挨拶に\n行ったんです", "kind": "丸", "ch": "起", "kg": "", "src": "a/102.mp3"}, {"no": 103, "sp": "拓海", "text": "そしたら棚に、\n子どもの頃の写真が\n飾ってあって", "kind": "丸", "ch": "起", "kg": "", "src": "a/103.mp3"}, {"no": 104, "sp": "拓海", "text": "社長と莉子さんが、\n並んで写ってました", "kind": "丸", "ch": "起", "kg": "", "src": "a/104.mp3"}, {"no": 105, "sp": "拓海", "text": "そこで初めて\n知りました", "kind": "丸", "ch": "起", "kg": "", "src": "a/105.mp3"}, {"no": 106, "sp": "主人公", "text": "じいちゃんの家の\n棚の写真なら、\n覚えている。", "kind": "四角", "ch": "起", "kg": "", "src": "a/106.mp3"}, {"no": 107, "sp": "主人公", "text": "俺が中学生で、\n莉子がまだ小学生の\n頃の写真だ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/107.mp3"}, {"no": 108, "sp": "拓海", "text": "莉子さんには、\nまだ言ってないんです", "kind": "丸", "ch": "起", "kg": "", "src": "a/108.mp3"}, {"no": 109, "sp": "拓海", "text": "うちの社長が、\nお兄さんだってことも", "kind": "丸", "ch": "起", "kg": "", "src": "a/109.mp3"}, {"no": 110, "sp": "拓海", "text": "社長に命を\n助けられたことも", "kind": "丸", "ch": "起", "kg": "", "src": "a/110.mp3"}, {"no": 111, "sp": "主人公", "text": "なんで、\n黙ってる？", "kind": "丸", "ch": "起", "kg": "", "src": "a/111.mp3"}, {"no": 112, "sp": "拓海", "text": "社長の妹だから\n近づいたって、", "kind": "丸", "ch": "起", "kg": "", "src": "a/112.mp3"}, {"no": 113, "sp": "拓海", "text": "思われたく\nなかったんです", "kind": "丸", "ch": "起", "kg": "", "src": "a/113.mp3"}, {"no": 114, "sp": "主人公", "text": "拓海は、まっすぐに\n俺の顔を見た。", "kind": "四角", "ch": "起", "kg": "", "src": "a/114.mp3"}, {"no": 115, "sp": "拓海", "text": "式の日に、\n全部話します", "kind": "丸", "ch": "起", "kg": "", "src": "a/115.mp3"}, {"no": 116, "sp": "拓海", "text": "だから社長には、\n新郎側の主賓として", "kind": "丸", "ch": "起", "kg": "", "src": "a/116.mp3"}, {"no": 117, "sp": "拓海", "text": "挨拶をして\nほしいんです", "kind": "丸", "ch": "起", "kg": "", "src": "a/117.mp3"}, {"no": 118, "sp": "拓海", "text": "社長がいなかったら、\n俺は今、\nここにいません", "kind": "丸", "ch": "起", "kg": "", "src": "a/118.mp3"}, {"no": 119, "sp": "拓海", "text": "だから、\n一番前で\n見ててほしいんです", "kind": "丸", "ch": "起", "kg": "", "src": "a/119.mp3"}, {"no": 120, "sp": "主人公", "text": "拓海は缶を置いて、\n深く頭を下げた。", "kind": "四角", "ch": "起", "kg": "", "src": "a/120.mp3"}, {"no": 121, "sp": "主人公", "text": "拓海の後ろで、\nクレーンが\nゆっくり回っている。", "kind": "四角", "ch": "起", "kg": "", "src": "a/121.mp3"}, {"no": 122, "sp": "主人公", "text": "莉子が俺をどう\n思っているか、\n拓海には言えない。", "kind": "四角", "ch": "起", "kg": "", "src": "a/122.mp3"}, {"no": 123, "sp": "主人公", "text": "……考えておく", "kind": "丸", "ch": "起", "kg": "", "src": "a/123.mp3"}, {"no": 124, "sp": "主人公", "text": "俺はそう答えて、\n缶コーヒーを\n飲み干した。", "kind": "四角", "ch": "起", "kg": "", "src": "a/124.mp3"}, {"no": 125, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "起", "kg": "", "wait": 0.8}, {"no": 126, "sp": "主人公", "text": "その夜。\n家で夕飯を\n食べていたときだ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/126.mp3"}, {"no": 127, "sp": "主人公", "text": "スマホが、\n短く鳴った。", "kind": "四角", "ch": "起", "kg": "", "src": "a/127.mp3"}, {"no": 128, "sp": "主人公", "text": "叔母の\n佳代おばさんからの\nLINEだ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/128.mp3"}, {"no": 129, "sp": "主人公", "text": "佳代おばさんは、\n父の妹だ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/129.mp3"}, {"no": 130, "sp": "主人公", "text": "親戚で今も連絡を\n取り合っているのは、\nこの人くらいだ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/130.mp3"}, {"no": 131, "sp": "佳代", "text": "莉子の結婚、\n聞いた？", "kind": "丸", "ch": "起", "kg": "", "src": "a/131.mp3"}, {"no": 132, "sp": "主人公", "text": "俺は少し\n考えてから、\n返事を打った。", "kind": "四角", "ch": "起", "kg": "", "src": "a/132.mp3"}, {"no": 133, "sp": "主人公", "text": "母さんからも\n莉子からも、\n何も聞いてない", "kind": "丸", "ch": "起", "kg": "", "src": "a/133.mp3"}, {"no": 134, "sp": "主人公", "text": "返事はすぐに来た。", "kind": "四角", "ch": "起", "kg": "", "src": "a/134.mp3"}, {"no": 135, "sp": "主人公", "text": "怒った顔の\nスタンプが1つ、\n先に届く。", "kind": "四角", "ch": "起", "kg": "", "src": "a/135.mp3"}, {"no": 136, "sp": "佳代", "text": "またあんたにだけ\n言わないのね", "kind": "丸", "ch": "起", "kg": "", "src": "a/136.mp3"}, {"no": 137, "sp": "佳代", "text": "日取りが決まったら、\n私が教える", "kind": "丸", "ch": "起", "kg": "", "src": "a/137.mp3"}, {"no": 138, "sp": "主人公", "text": "ありがとう", "kind": "丸", "ch": "起", "kg": "", "src": "a/138.mp3"}, {"no": 139, "sp": "主人公", "text": "俺はスマホを伏せて、\n残りの飯を\nかき込んだ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/139.mp3"}, {"no": 140, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "起", "kg": "", "wait": 0.8}, {"no": 141, "sp": "主人公", "text": "週末。\n事務所で見積もりを\n作っていたときだ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/141.mp3"}, {"no": 142, "sp": "主人公", "text": "机の上のスマホに、\n母の京子の名前が\n出ていた。", "kind": "四角", "ch": "起", "kg": "", "src": "a/142.mp3"}, {"no": 143, "sp": "主人公", "text": "母から電話が\n来るのは、\n金が要るときだけだ。", "kind": "四角", "ch": "起", "kg": "", "src": "a/143.mp3"}, {"no": 144, "sp": "主人公", "text": "俺は一度\n息を吐いてから、\n電話に出た。", "kind": "四角", "ch": "起", "kg": "", "src": "a/144.mp3"}, {"no": 145, "sp": "主人公", "text": "もしもし", "kind": "丸", "ch": "起", "kg": "", "src": "a/145.mp3"}, {"no": 146, "sp": "京子", "text": "蓮？\nお母さんだけど", "kind": "丸", "ch": "起", "kg": "", "src": "a/146.mp3"}, {"no": 147, "sp": "京子", "text": "莉子がね、\n結婚するのよ", "kind": "丸", "ch": "起", "kg": "", "src": "a/147.mp3"}, {"no": 148, "sp": "主人公", "text": "……そうか", "kind": "丸", "ch": "起", "kg": "", "src": "a/148.mp3"}, {"no": 149, "sp": "京子", "text": "お相手はね、\n大学を出てる人なの", "kind": "丸", "ch": "起", "kg": "", "src": "a/149.mp3"}, {"no": 150, "sp": "京子", "text": "ご両親は二人とも、\n高校の先生なのよ", "kind": "丸", "ch": "起", "kg": "", "src": "a/150.mp3"}, {"no": 151, "sp": "京子", "text": "立派なお家でしょう？", "kind": "丸", "ch": "起", "kg": "", "src": "a/151.mp3"}, {"no": 152, "sp": "京子", "text": "式場もね、\nホテルの一番いい\n会場を押さえたの", "kind": "丸", "ch": "起", "kg": "", "src": "a/152.mp3"}, {"no": 153, "sp": "京子", "text": "あちらのお家、\nお庭がすごく\n広いのよ", "kind": "丸", "ch": "起", "kg": "", "src": "a/153.mp3"}, {"no": 154, "sp": "京子", "text": "莉子、\nいいところに\nお嫁に行くわ", "kind": "丸", "ch": "起", "kg": "", "src": "a/154.mp3"}, {"no": 155, "sp": "主人公", "text": "母の声は、\n自分のことのように\n弾んでいた。", "kind": "四角", "ch": "起", "kg": "", "src": "a/155.mp3"}, {"no": 156, "sp": "主人公", "text": "俺と話すときに、\nこんな声が出たことは\nない。", "kind": "四角", "ch": "起", "kg": "", "src": "a/156.mp3"}, {"no": 157, "sp": "京子", "text": "それでね、\n式場とドレスで、\n600万かかるの", "kind": "丸", "ch": "起", "kg": "", "src": "a/157.mp3"}, {"no": 158, "sp": "京子", "text": "あんた、\n稼いでるんでしょ？", "kind": "丸", "ch": "起", "kg": "", "src": "a/158.mp3"}, {"no": 159, "sp": "京子", "text": "出せるわよね？", "kind": "丸", "ch": "起", "kg": "", "src": "a/159.mp3"}, {"no": 160, "sp": "主人公", "text": "母は、\n当たり前のように\nそう言った。", "kind": "四角", "ch": "起", "kg": "", "src": "a/160.mp3"}, {"no": 161, "sp": "主人公", "text": "出すよ", "kind": "丸", "ch": "承", "kg": "", "src": "a/161.mp3"}, {"no": 162, "sp": "主人公", "text": "俺がそう答えると、\n母の声が\n一段明るくなった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/162.mp3"}, {"no": 163, "sp": "京子", "text": "助かるわ", "kind": "丸", "ch": "承", "kg": "", "src": "a/163.mp3"}, {"no": 164, "sp": "京子", "text": "あんたも、\nたまには役に立つのね", "kind": "丸", "ch": "承", "kg": "", "src": "a/164.mp3"}, {"no": 165, "sp": "主人公", "text": "式は、\nいつなんだ？", "kind": "丸", "ch": "承", "kg": "", "src": "a/165.mp3"}, {"no": 166, "sp": "京子", "text": "あんたに、\n関係ある？", "kind": "丸", "ch": "承", "kg": "", "src": "a/166.mp3"}, {"no": 167, "sp": "主人公", "text": "その代わり、\n1つ聞かせてくれ", "kind": "丸", "ch": "承", "kg": "", "src": "a/167.mp3"}, {"no": 168, "sp": "主人公", "text": "式には、\n行っていいんだよな？", "kind": "丸", "ch": "承", "kg": "", "src": "a/168.mp3"}, {"no": 169, "sp": "京子", "text": "来ないで", "kind": "丸", "ch": "承", "kg": "", "src": "a/169.mp3"}, {"no": 170, "sp": "主人公", "text": "母は、間を置かずに\nそう言った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/170.mp3"}, {"no": 171, "sp": "京子", "text": "中卒の兄が\nいるなんて、", "kind": "丸", "ch": "承", "kg": "", "src": "a/171.mp3"}, {"no": 172, "sp": "京子", "text": "向こうのご両親に\n知られたら、", "kind": "丸", "ch": "承", "kg": "", "src": "a/172.mp3"}, {"no": 173, "sp": "京子", "text": "莉子が恥をかくのよ", "kind": "丸", "ch": "承", "kg": "", "src": "a/173.mp3"}, {"no": 174, "sp": "京子", "text": "先生のお家なのよ。\nわかるでしょ？", "kind": "丸", "ch": "承", "kg": "", "src": "a/174.mp3"}, {"no": 175, "sp": "主人公", "text": "……俺は、\n莉子の兄だぞ", "kind": "丸", "ch": "承", "kg": "", "src": "a/175.mp3"}, {"no": 176, "sp": "京子", "text": "だからよ", "kind": "丸", "ch": "承", "kg": "", "src": "a/176.mp3"}, {"no": 177, "sp": "京子", "text": "あちらのご両親には、\n上の子は\nもういないって", "kind": "丸", "ch": "承", "kg": "", "src": "a/177.mp3"}, {"no": 178, "sp": "京子", "text": "言うことにしたから", "kind": "丸", "ch": "承", "kg": "", "src": "a/178.mp3"}, {"no": 179, "sp": "主人公", "text": "……それは、\n莉子も\nそう言ってるのか？", "kind": "丸", "ch": "承", "kg": "", "src": "a/179.mp3"}, {"no": 180, "sp": "京子", "text": "莉子が\n言い出したのよ", "kind": "丸", "ch": "承", "kg": "", "src": "a/180.mp3"}, {"no": 181, "sp": "京子", "text": "お兄ちゃんのことは、\n絶対に\n知られたくないって", "kind": "丸", "ch": "承", "kg": "", "src": "a/181.mp3"}, {"no": 182, "sp": "主人公", "text": "父さんは？", "kind": "丸", "ch": "承", "kg": "", "src": "a/182.mp3"}, {"no": 183, "sp": "京子", "text": "お父さんも、\nそれでいいって", "kind": "丸", "ch": "承", "kg": "", "src": "a/183.mp3"}, {"no": 184, "sp": "京子", "text": "だから、あんたは\n消えたことに\nしておいて", "kind": "丸", "ch": "承", "kg": "", "src": "a/184.mp3"}, {"no": 185, "sp": "主人公", "text": "天気の話でも\nするような、\n軽い声だった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/185.mp3"}, {"no": 186, "sp": "主人公", "text": "腹の底が、\nすっと冷たくなった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/186.mp3"}, {"no": 187, "sp": "主人公", "text": "事務所の窓の外は、\nもう暗い。", "kind": "四角", "ch": "承", "kg": "", "src": "a/187.mp3"}, {"no": 188, "sp": "主人公", "text": "家族への怒りは、\nもちろんある。", "kind": "四角", "ch": "承", "kg": "", "src": "a/188.mp3"}, {"no": 189, "sp": "主人公", "text": "それでも、\n拓海の結婚だけは\n祝ってやりたかった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/189.mp3"}, {"no": 190, "sp": "主人公", "text": "あいつは、\n俺が土の中から\n引っぱり出した男だ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/190.mp3"}, {"no": 191, "sp": "主人公", "text": "……振込先を送って", "kind": "丸", "ch": "承", "kg": "", "src": "a/191.mp3"}, {"no": 192, "sp": "京子", "text": "ありがとう。\nじゃあね", "kind": "丸", "ch": "承", "kg": "", "src": "a/192.mp3"}, {"no": 193, "sp": "主人公", "text": "母は礼だけ言って、\n電話を切った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/193.mp3"}, {"no": 194, "sp": "主人公", "text": "俺はそのまま、\n銀行のアプリを\n開いた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/194.mp3"}, {"no": 195, "sp": "主人公", "text": "履歴を\nさかのぼると、\n同じ振り込みが並ぶ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/195.mp3"}, {"no": 196, "sp": "主人公", "text": "17歳から毎月、\n母の口座に\n送り続けてきた金だ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/196.mp3"}, {"no": 197, "sp": "主人公", "text": "莉子の私立の中学から\n大学までの学費と、\n下宿代。", "kind": "四角", "ch": "承", "kg": "", "src": "a/197.mp3"}, {"no": 198, "sp": "主人公", "text": "合わせて、\n1200万になる。", "kind": "四角", "ch": "承", "kg": "", "src": "a/198.mp3"}, {"no": 199, "sp": "主人公", "text": "実家は、\n父の名義の家だ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/199.mp3"}, {"no": 200, "sp": "主人公", "text": "ローンの分は毎月、\n俺が父の口座に\n振り込んでいる。", "kind": "四角", "ch": "承", "kg": "", "src": "a/200.mp3"}, {"no": 201, "sp": "主人公", "text": "莉子が大学を\n卒業した日のことが、\n頭に浮かぶ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/201.mp3"}, {"no": 202, "sp": "主人公", "text": "あの日は、\n佳代おばさんから\n写真が1枚届いた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/202.mp3"}, {"no": 203, "sp": "主人公", "text": "実家の食卓で、\n莉子が父の和夫に\n抱きついていた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/203.mp3"}, {"no": 204, "sp": "佳代", "text": "莉子ったら、\nお父さんに\n学費ありがとうって", "kind": "丸", "ch": "承", "kg": "", "src": "a/204.mp3"}, {"no": 205, "sp": "佳代", "text": "あの子、\n何も知らないのね", "kind": "丸", "ch": "承", "kg": "", "src": "a/205.mp3"}, {"no": 206, "sp": "主人公", "text": "写真の中の母は、\n黙って笑っていた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/206.mp3"}, {"no": 207, "sp": "主人公", "text": "俺はそのとき、\n何も返さなかった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/207.mp3"}, {"no": 208, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "承", "kg": "", "wait": 0.8}, {"no": 209, "sp": "主人公", "text": "翌週の夜。\n実家の玄関。", "kind": "四角", "ch": "承", "kg": "", "src": "a/209.mp3"}, {"no": 210, "sp": "主人公", "text": "式の費用の話を\nまとめるために、\n仕事帰りに寄った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/210.mp3"}, {"no": 211, "sp": "主人公", "text": "戸を開けると、\nテレビの音と、\n煮物の匂いがする。", "kind": "四角", "ch": "承", "kg": "", "src": "a/211.mp3"}, {"no": 212, "sp": "主人公", "text": "実家に\n上がるのは、\n正月以来だ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/212.mp3"}, {"no": 213, "sp": "京子", "text": "あら、\n来たの", "kind": "丸", "ch": "承", "kg": "", "src": "a/213.mp3"}, {"no": 214, "sp": "主人公", "text": "台所から、\n母が顔だけ出した。", "kind": "四角", "ch": "承", "kg": "", "src": "a/214.mp3"}, {"no": 215, "sp": "京子", "text": "上がるなら、\n静かにしてね", "kind": "丸", "ch": "承", "kg": "", "src": "a/215.mp3"}, {"no": 216, "sp": "京子", "text": "莉子が\n来てるから", "kind": "丸", "ch": "承", "kg": "", "src": "a/216.mp3"}, {"no": 217, "sp": "主人公", "text": "作業着のまま、\n靴を脱いで上がる。", "kind": "四角", "ch": "承", "kg": "", "src": "a/217.mp3"}, {"no": 218, "sp": "主人公", "text": "居間の奥の食卓に、\n父と母と莉子が\n座っていた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/218.mp3"}, {"no": 219, "sp": "主人公", "text": "3人の前には、\n夕飯の皿が\n並んでいる。", "kind": "四角", "ch": "承", "kg": "", "src": "a/219.mp3"}, {"no": 220, "sp": "主人公", "text": "テレビでは、\nクイズ番組が\n流れていた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/220.mp3"}, {"no": 221, "sp": "主人公", "text": "俺の分の箸は、\n出ていなかった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/221.mp3"}, {"no": 222, "sp": "主人公", "text": "食卓の椅子も、\n3つしかない。", "kind": "四角", "ch": "承", "kg": "", "src": "a/222.mp3"}, {"no": 223, "sp": "莉子", "text": "ちょっと", "kind": "丸", "ch": "承", "kg": "", "src": "a/223.mp3"}, {"no": 224, "sp": "莉子", "text": "その格好で\n上がらないでよ", "kind": "丸", "ch": "承", "kg": "", "src": "a/224.mp3"}, {"no": 225, "sp": "莉子", "text": "泥が落ちるじゃない", "kind": "丸", "ch": "承", "kg": "", "src": "a/225.mp3"}, {"no": 226, "sp": "主人公", "text": "莉子は俺の作業着を\nじろりと見て、\n椅子を少し引いた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/226.mp3"}, {"no": 227, "sp": "主人公", "text": "仕事帰りなんだ", "kind": "丸", "ch": "承", "kg": "", "src": "a/227.mp3"}, {"no": 228, "sp": "莉子", "text": "だから嫌なの", "kind": "丸", "ch": "承", "kg": "", "src": "a/228.mp3"}, {"no": 229, "sp": "主人公", "text": "父の和夫は、\n新聞から\n目を上げない。", "kind": "四角", "ch": "承", "kg": "", "src": "a/229.mp3"}, {"no": 230, "sp": "和夫", "text": "用が済んだら、\n帰れ", "kind": "丸", "ch": "承", "kg": "", "src": "a/230.mp3"}, {"no": 231, "sp": "主人公", "text": "……式の金の話を\nしに来た", "kind": "丸", "ch": "承", "kg": "", "src": "a/231.mp3"}, {"no": 232, "sp": "主人公", "text": "母の京子が、\n身を乗り出した。", "kind": "四角", "ch": "承", "kg": "", "src": "a/232.mp3"}, {"no": 233, "sp": "京子", "text": "で、\n600万は、\nいつ振り込めるの？", "kind": "丸", "ch": "承", "kg": "", "src": "a/233.mp3"}, {"no": 234, "sp": "主人公", "text": "来週には", "kind": "丸", "ch": "承", "kg": "", "src": "a/234.mp3"}, {"no": 235, "sp": "京子", "text": "そう", "kind": "丸", "ch": "承", "kg": "", "src": "a/235.mp3"}, {"no": 236, "sp": "主人公", "text": "母は立ち上がって、\n台所へ向かう。", "kind": "四角", "ch": "承", "kg": "", "src": "a/236.mp3"}, {"no": 237, "sp": "主人公", "text": "戻ってきた母は、\n俺の前に\n湯呑みを置いた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/237.mp3"}, {"no": 238, "sp": "主人公", "text": "この家に上がって、\n初めて出てきた\nお茶だった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/238.mp3"}, {"no": 239, "sp": "京子", "text": "座ったら？", "kind": "丸", "ch": "承", "kg": "", "src": "a/239.mp3"}, {"no": 240, "sp": "主人公", "text": "俺は、壁際の丸椅子を\n引き寄せて座った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/240.mp3"}, {"no": 241, "sp": "主人公", "text": "莉子と母は、\n俺をよそに\n式の話を続けている。", "kind": "四角", "ch": "承", "kg": "", "src": "a/241.mp3"}, {"no": 242, "sp": "莉子", "text": "引き出物、\nやっぱりカタログに\nしようかな", "kind": "丸", "ch": "承", "kg": "", "src": "a/242.mp3"}, {"no": 243, "sp": "京子", "text": "あちらのご親戚に、\n笑われないものに\nしなさい", "kind": "丸", "ch": "承", "kg": "", "src": "a/243.mp3"}, {"no": 244, "sp": "莉子", "text": "お金は、\nお兄ちゃんが\n出すんでしょ？", "kind": "丸", "ch": "承", "kg": "", "src": "a/244.mp3"}, {"no": 245, "sp": "京子", "text": "そうよ", "kind": "丸", "ch": "承", "kg": "", "src": "a/245.mp3"}, {"no": 246, "sp": "主人公", "text": "2人とも、\n俺のほうは\n見なかった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/246.mp3"}, {"no": 247, "sp": "莉子", "text": "ねえ、お母さん", "kind": "丸", "ch": "承", "kg": "", "src": "a/247.mp3"}, {"no": 248, "sp": "莉子", "text": "ドレス、\nもう1つ上のに\nしたいんだけど", "kind": "丸", "ch": "承", "kg": "", "src": "a/248.mp3"}, {"no": 249, "sp": "京子", "text": "いいじゃない。\n一生に一度なんだから", "kind": "丸", "ch": "承", "kg": "", "src": "a/249.mp3"}, {"no": 250, "sp": "京子", "text": "足りなかったら、\nまた言うわ", "kind": "丸", "ch": "承", "kg": "", "src": "a/250.mp3"}, {"no": 251, "sp": "主人公", "text": "600万では、\n足りないらしい。", "kind": "四角", "ch": "承", "kg": "", "src": "a/251.mp3"}, {"no": 252, "sp": "主人公", "text": "母は、俺の顔も見ずに\nそう言った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/252.mp3"}, {"no": 253, "sp": "主人公", "text": "俺は、新聞の陰の\n父に目を向けた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/253.mp3"}, {"no": 254, "sp": "主人公", "text": "父さんも、\n俺に来るなって\n言うのか？", "kind": "丸", "ch": "承", "kg": "", "src": "a/254.mp3"}, {"no": 255, "sp": "主人公", "text": "父は、新聞を\n1枚めくった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/255.mp3"}, {"no": 256, "sp": "和夫", "text": "……母さんに\n任せてある", "kind": "丸", "ch": "承", "kg": "", "src": "a/256.mp3"}, {"no": 257, "sp": "主人公", "text": "返ってきたのは、\nそれだけだった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/257.mp3"}, {"no": 258, "sp": "主人公", "text": "莉子は、\nそこで初めて\n俺のほうを向いた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/258.mp3"}, {"no": 259, "sp": "莉子", "text": "お兄ちゃん", "kind": "丸", "ch": "承", "kg": "", "src": "a/259.mp3"}, {"no": 260, "sp": "莉子", "text": "式には、\n絶対来ないでね", "kind": "丸", "ch": "承", "kg": "", "src": "a/260.mp3"}, {"no": 261, "sp": "莉子", "text": "彼の家、\n先生の家なの", "kind": "丸", "ch": "承", "kg": "", "src": "a/261.mp3"}, {"no": 262, "sp": "莉子", "text": "中卒で現場の兄が\nいるなんて、", "kind": "丸", "ch": "承", "kg": "", "src": "a/262.mp3"}, {"no": 263, "sp": "莉子", "text": "恥ずかしくて\n言えないから", "kind": "丸", "ch": "承", "kg": "", "src": "a/263.mp3"}, {"no": 264, "sp": "主人公", "text": "莉子は、煮物を\nつつきながら\nそう言った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/264.mp3"}, {"no": 265, "sp": "主人公", "text": "相手は、\nどんな人だ？", "kind": "丸", "ch": "承", "kg": "", "src": "a/265.mp3"}, {"no": 266, "sp": "莉子", "text": "言っても\nわかんないでしょ", "kind": "丸", "ch": "承", "kg": "", "src": "a/266.mp3"}, {"no": 267, "sp": "莉子", "text": "ちゃんと大学を\n出てる人", "kind": "丸", "ch": "承", "kg": "", "src": "a/267.mp3"}, {"no": 268, "sp": "莉子", "text": "私だって、\nお父さんが学費を\n出してくれたから", "kind": "丸", "ch": "承", "kg": "", "src": "a/268.mp3"}, {"no": 269, "sp": "莉子", "text": "大学まで\n行けたんだもん", "kind": "丸", "ch": "承", "kg": "", "src": "a/269.mp3"}, {"no": 270, "sp": "莉子", "text": "お兄ちゃんは、\n中学で終わりでしょ", "kind": "丸", "ch": "承", "kg": "", "src": "a/270.mp3"}, {"no": 271, "sp": "莉子", "text": "話が合う\nわけないじゃない", "kind": "丸", "ch": "承", "kg": "", "src": "a/271.mp3"}, {"no": 272, "sp": "主人公", "text": "莉子は、\n鼻で笑った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/272.mp3"}, {"no": 273, "sp": "主人公", "text": "莉子の指で、\n婚約指輪が\n光っている。", "kind": "四角", "ch": "承", "kg": "", "src": "a/273.mp3"}, {"no": 274, "sp": "主人公", "text": "母は湯呑みを\n両手で持ったまま、\n黙っている。", "kind": "四角", "ch": "承", "kg": "", "src": "a/274.mp3"}, {"no": 275, "sp": "主人公", "text": "拓海の名前が、\n喉まで出かかった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/275.mp3"}, {"no": 276, "sp": "主人公", "text": "ただ、式の日に\n自分で話すと、\n拓海は決めている。", "kind": "四角", "ch": "承", "kg": "", "src": "a/276.mp3"}, {"no": 277, "sp": "主人公", "text": "それを、\n俺が先に言うわけには\nいかない。", "kind": "四角", "ch": "承", "kg": "", "src": "a/277.mp3"}, {"no": 278, "sp": "主人公", "text": "俺は湯呑みに\n手をつけずに、\n立ち上がった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/278.mp3"}, {"no": 279, "sp": "京子", "text": "もう帰るの？", "kind": "丸", "ch": "承", "kg": "", "src": "a/279.mp3"}, {"no": 280, "sp": "京子", "text": "振り込み、\n忘れないでよ", "kind": "丸", "ch": "承", "kg": "", "src": "a/280.mp3"}, {"no": 281, "sp": "主人公", "text": "玄関で靴を\n履いていると、\n母が後ろから言った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/281.mp3"}, {"no": 282, "sp": "京子", "text": "蓮", "kind": "丸", "ch": "承", "kg": "", "src": "a/282.mp3"}, {"no": 283, "sp": "京子", "text": "消えたことに\nしてるんだから、", "kind": "丸", "ch": "承", "kg": "", "src": "a/283.mp3"}, {"no": 284, "sp": "京子", "text": "式場の近くを、\nうろうろしないでね", "kind": "丸", "ch": "承", "kg": "", "src": "a/284.mp3"}, {"no": 285, "sp": "主人公", "text": "俺は返事をせずに、\n玄関の戸を閉めた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/285.mp3"}, {"no": 286, "sp": "主人公", "text": "車に乗ってから、\nハンドルを握る手が\n少し震えていた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/286.mp3"}, {"no": 287, "sp": "主人公", "text": "15の春に、\n親方に拾われてから、\n20年になる。", "kind": "四角", "ch": "承", "kg": "", "src": "a/287.mp3"}, {"no": 288, "sp": "主人公", "text": "現場で稼いだ金の\n半分以上は、\nあの家に送ってきた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/288.mp3"}, {"no": 289, "sp": "主人公", "text": "それでも、\nあの家に\n俺の席はなかった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/289.mp3"}, {"no": 290, "sp": "主人公", "text": "家には帰らず、\n事務所へ向かう。", "kind": "四角", "ch": "承", "kg": "", "src": "a/290.mp3"}, {"no": 291, "sp": "主人公", "text": "その夜は朝まで、\n見積もりを\n作り続けた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/291.mp3"}, {"no": 292, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "承", "kg": "", "wait": 0.8}, {"no": 293, "sp": "主人公", "text": "翌週、600万を\n母の口座に\n振り込んだ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/293.mp3"}, {"no": 294, "sp": "主人公", "text": "振込を押すと、\n17の春のことが\n頭をかすめた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/294.mp3"}, {"no": 295, "sp": "主人公", "text": "莉子が、\n私立の中学に\n受かった年だ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/295.mp3"}, {"no": 296, "sp": "主人公", "text": "学費が足りないと、\n母から電話が来た。", "kind": "四角", "ch": "承", "kg": "", "src": "a/296.mp3"}, {"no": 297, "sp": "主人公", "text": "親方に頭を下げて、\n給料を\n前借りした。", "kind": "四角", "ch": "承", "kg": "", "src": "a/297.mp3"}, {"no": 298, "sp": "主人公", "text": "あれから、振り込みは\n1度も\n止まっていない。", "kind": "四角", "ch": "承", "kg": "", "src": "a/298.mp3"}, {"no": 299, "sp": "主人公", "text": "母からの返事は、\n一言だけだった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/299.mp3"}, {"no": 300, "sp": "京子", "text": "確認しました", "kind": "丸", "ch": "承", "kg": "", "src": "a/300.mp3"}, {"no": 301, "sp": "主人公", "text": "莉子からは、\n何も来なかった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/301.mp3"}, {"no": 302, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "承", "kg": "", "wait": 0.8}, {"no": 303, "sp": "主人公", "text": "数日後の現場。", "kind": "四角", "ch": "承", "kg": "", "src": "a/303.mp3"}, {"no": 304, "sp": "主人公", "text": "午後から\n雨が降りそうな、\n重い空だ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/304.mp3"}, {"no": 305, "sp": "主人公", "text": "昼の休憩に、\n拓海が報告に来た。", "kind": "四角", "ch": "承", "kg": "", "src": "a/305.mp3"}, {"no": 306, "sp": "拓海", "text": "社長。\n両家の顔合わせ、\n終わりました", "kind": "丸", "ch": "承", "kg": "", "src": "a/306.mp3"}, {"no": 307, "sp": "主人公", "text": "そうか。\nどうだった？", "kind": "丸", "ch": "承", "kg": "", "src": "a/307.mp3"}, {"no": 308, "sp": "拓海", "text": "うちの親は、\n莉子さんのことを\n気に入ったみたいです", "kind": "丸", "ch": "承", "kg": "", "src": "a/308.mp3"}, {"no": 309, "sp": "主人公", "text": "それはよかった", "kind": "丸", "ch": "承", "kg": "", "src": "a/309.mp3"}, {"no": 310, "sp": "拓海", "text": "ただ……", "kind": "丸", "ch": "承", "kg": "", "src": "a/310.mp3"}, {"no": 311, "sp": "主人公", "text": "拓海は、\n少し言いよどんだ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/311.mp3"}, {"no": 312, "sp": "拓海", "text": "莉子さん、\nお兄さんの話になると\n黙るんです", "kind": "丸", "ch": "承", "kg": "", "src": "a/312.mp3"}, {"no": 313, "sp": "拓海", "text": "兄とはほとんど\n会ってないって、", "kind": "丸", "ch": "承", "kg": "", "src": "a/313.mp3"}, {"no": 314, "sp": "拓海", "text": "それしか\n言わなくて", "kind": "丸", "ch": "承", "kg": "", "src": "a/314.mp3"}, {"no": 315, "sp": "主人公", "text": "拓海は、\n困った顔で笑った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/315.mp3"}, {"no": 316, "sp": "拓海", "text": "莉子さんの\nお母さんは、\nうちの親に", "kind": "丸", "ch": "承", "kg": "", "src": "a/316.mp3"}, {"no": 317, "sp": "拓海", "text": "ずっと、\n気をつかってて", "kind": "丸", "ch": "承", "kg": "", "src": "a/317.mp3"}, {"no": 318, "sp": "拓海", "text": "お父さんは、\nほとんど\nしゃべらなかったです", "kind": "丸", "ch": "承", "kg": "", "src": "a/318.mp3"}, {"no": 319, "sp": "主人公", "text": "……そうだろうな", "kind": "丸", "ch": "承", "kg": "", "src": "a/319.mp3"}, {"no": 320, "sp": "拓海", "text": "社長、\n莉子さんと何か\nあったんですか？", "kind": "丸", "ch": "承", "kg": "", "src": "a/320.mp3"}, {"no": 321, "sp": "主人公", "text": "……昔から、\nあまり話さないんだ", "kind": "丸", "ch": "承", "kg": "", "src": "a/321.mp3"}, {"no": 322, "sp": "拓海", "text": "そうですか", "kind": "丸", "ch": "承", "kg": "", "src": "a/322.mp3"}, {"no": 323, "sp": "拓海", "text": "だから式の日に、\n社長に主賓の\n挨拶をしてもらって", "kind": "丸", "ch": "承", "kg": "", "src": "a/323.mp3"}, {"no": 324, "sp": "拓海", "text": "そのあとで、\n俺の口から\n全部話したいんです", "kind": "丸", "ch": "承", "kg": "", "src": "a/324.mp3"}, {"no": 325, "sp": "拓海", "text": "社長がどんな人か、", "kind": "丸", "ch": "承", "kg": "", "src": "a/325.mp3"}, {"no": 326, "sp": "拓海", "text": "莉子さんに、\n自分の目で\n見てほしいんです", "kind": "丸", "ch": "承", "kg": "", "src": "a/326.mp3"}, {"no": 327, "sp": "主人公", "text": "……主賓は、\n普通は上司だろう", "kind": "丸", "ch": "承", "kg": "", "src": "a/327.mp3"}, {"no": 328, "sp": "拓海", "text": "だから社長なんです", "kind": "丸", "ch": "承", "kg": "", "src": "a/328.mp3"}, {"no": 329, "sp": "拓海", "text": "席次表の\n主賓のところには、", "kind": "丸", "ch": "承", "kg": "", "src": "a/329.mp3"}, {"no": 330, "sp": "拓海", "text": "会社の名前だけ\n書いておきました", "kind": "丸", "ch": "承", "kg": "", "src": "a/330.mp3"}, {"no": 331, "sp": "主人公", "text": "拓海は、少し\n照れくさそうに\n笑った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/331.mp3"}, {"no": 332, "sp": "主人公", "text": "拓海の勤め先が\n正岡建設なのは、\n莉子も知っている。", "kind": "四角", "ch": "承", "kg": "", "src": "a/332.mp3"}, {"no": 333, "sp": "主人公", "text": "けれど、\nその社長が俺だとは\n知らない。", "kind": "四角", "ch": "承", "kg": "", "src": "a/333.mp3"}, {"no": 334, "sp": "主人公", "text": "家族は俺の仕事を、\n現場としか呼ばない。", "kind": "四角", "ch": "承", "kg": "", "src": "a/334.mp3"}, {"no": 335, "sp": "主人公", "text": "社名を\n聞かれたことも、\n一度もなかった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/335.mp3"}, {"no": 336, "sp": "主人公", "text": "電話の母の声が、\n頭をよぎる。", "kind": "四角", "ch": "承", "kg": "", "src": "a/336.mp3"}, {"no": 337, "sp": "主人公", "text": "それでも、\nそのことは\n拓海に言わなかった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/337.mp3"}, {"no": 338, "sp": "拓海", "text": "お願いします", "kind": "丸", "ch": "承", "kg": "", "src": "a/338.mp3"}, {"no": 339, "sp": "主人公", "text": "拓海が、\nもう一度頭を下げる。", "kind": "四角", "ch": "承", "kg": "", "src": "a/339.mp3"}, {"no": 340, "sp": "主人公", "text": "分かった。\n行くよ", "kind": "丸", "ch": "承", "kg": "", "src": "a/340.mp3"}, {"no": 341, "sp": "拓海", "text": "ありがとうございます", "kind": "丸", "ch": "承", "kg": "", "src": "a/341.mp3"}, {"no": 342, "sp": "拓海", "text": "当日は、作業着じゃ\nなくて、\nスーツでお願いします", "kind": "丸", "ch": "承", "kg": "", "src": "a/342.mp3"}, {"no": 343, "sp": "主人公", "text": "分かってる", "kind": "丸", "ch": "承", "kg": "", "src": "a/343.mp3"}, {"no": 344, "sp": "主人公", "text": "拓海は笑って、\n足場のほうへ\n戻っていった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/344.mp3"}, {"no": 345, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "承", "kg": "", "wait": 0.8}, {"no": 346, "sp": "主人公", "text": "その夜、\nじいちゃんから\n電話があった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/346.mp3"}, {"no": 347, "sp": "主人公", "text": "父方の祖父の、\n白木源一だ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/347.mp3"}, {"no": 348, "sp": "主人公", "text": "今も1人で、\n畑に出ている。", "kind": "四角", "ch": "承", "kg": "", "src": "a/348.mp3"}, {"no": 349, "sp": "源一", "text": "蓮か", "kind": "丸", "ch": "承", "kg": "", "src": "a/349.mp3"}, {"no": 350, "sp": "源一", "text": "莉子の式に来い", "kind": "丸", "ch": "承", "kg": "", "src": "a/350.mp3"}, {"no": 351, "sp": "源一", "text": "拓海くんから、\n話は聞いとる", "kind": "丸", "ch": "承", "kg": "", "src": "a/351.mp3"}, {"no": 352, "sp": "主人公", "text": "じいちゃん、\n拓海と会ったのか？", "kind": "丸", "ch": "承", "kg": "", "src": "a/352.mp3"}, {"no": 353, "sp": "源一", "text": "あの子は、\n何度も顔を見せに来る", "kind": "丸", "ch": "承", "kg": "", "src": "a/353.mp3"}, {"no": 354, "sp": "源一", "text": "律儀な男だ", "kind": "丸", "ch": "承", "kg": "", "src": "a/354.mp3"}, {"no": 355, "sp": "源一", "text": "お前のことを、\nそれは大事に\n思っとる", "kind": "丸", "ch": "承", "kg": "", "src": "a/355.mp3"}, {"no": 356, "sp": "主人公", "text": "……知ってる", "kind": "丸", "ch": "承", "kg": "", "src": "a/356.mp3"}, {"no": 357, "sp": "主人公", "text": "じいちゃんの声が、\nそこで低くなった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/357.mp3"}, {"no": 358, "sp": "源一", "text": "京子がお前を、\n消えたことに\nしとるそうだな", "kind": "丸", "ch": "承", "kg": "", "src": "a/358.mp3"}, {"no": 359, "sp": "源一", "text": "佳代から聞いた", "kind": "丸", "ch": "承", "kg": "", "src": "a/359.mp3"}, {"no": 360, "sp": "源一", "text": "わしは許さん", "kind": "丸", "ch": "承", "kg": "", "src": "a/360.mp3"}, {"no": 361, "sp": "主人公", "text": "じいちゃん", "kind": "丸", "ch": "承", "kg": "", "src": "a/361.mp3"}, {"no": 362, "sp": "主人公", "text": "当日は、\n新郎側の客として行く", "kind": "丸", "ch": "承", "kg": "", "src": "a/362.mp3"}, {"no": 363, "sp": "主人公", "text": "騒ぎにはしないよ", "kind": "丸", "ch": "承", "kg": "", "src": "a/363.mp3"}, {"no": 364, "sp": "源一", "text": "わしが京子に、\nひとこと\n言うてやろうか", "kind": "丸", "ch": "承", "kg": "", "src": "a/364.mp3"}, {"no": 365, "sp": "主人公", "text": "いい", "kind": "丸", "ch": "承", "kg": "", "src": "a/365.mp3"}, {"no": 366, "sp": "主人公", "text": "拓海の式だ", "kind": "丸", "ch": "承", "kg": "", "src": "a/366.mp3"}, {"no": 367, "sp": "源一", "text": "……そうか", "kind": "丸", "ch": "承", "kg": "", "src": "a/367.mp3"}, {"no": 368, "sp": "源一", "text": "なら、わしも行く", "kind": "丸", "ch": "承", "kg": "", "src": "a/368.mp3"}, {"no": 369, "sp": "源一", "text": "お前の席の近くに\n座らせてもらう", "kind": "丸", "ch": "承", "kg": "", "src": "a/369.mp3"}, {"no": 370, "sp": "源一", "text": "蓮", "kind": "丸", "ch": "承", "kg": "", "src": "a/370.mp3"}, {"no": 371, "sp": "源一", "text": "お前は昔から、\n莉子の面倒を\nよう見とったな", "kind": "丸", "ch": "承", "kg": "", "src": "a/371.mp3"}, {"no": 372, "sp": "主人公", "text": "……昔の話だよ", "kind": "丸", "ch": "承", "kg": "", "src": "a/372.mp3"}, {"no": 373, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "承", "kg": "", "wait": 0.8}, {"no": 374, "sp": "主人公", "text": "式の3日前。", "kind": "四角", "ch": "承", "kg": "", "src": "a/374.mp3"}, {"no": 375, "sp": "主人公", "text": "夜遅くに、\n莉子から電話が来た。", "kind": "四角", "ch": "承", "kg": "", "src": "a/375.mp3"}, {"no": 376, "sp": "主人公", "text": "莉子からの電話は、\n5年ぶりだ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/376.mp3"}, {"no": 377, "sp": "主人公", "text": "莉子か", "kind": "丸", "ch": "承", "kg": "", "src": "a/377.mp3"}, {"no": 378, "sp": "莉子", "text": "お母さんから、\n聞いたよね？", "kind": "丸", "ch": "承", "kg": "", "src": "a/378.mp3"}, {"no": 379, "sp": "主人公", "text": "聞いた", "kind": "丸", "ch": "承", "kg": "", "src": "a/379.mp3"}, {"no": 380, "sp": "莉子", "text": "当日、式場に来たら、\n許さないから", "kind": "丸", "ch": "承", "kg": "", "src": "a/380.mp3"}, {"no": 381, "sp": "莉子", "text": "お金を出したからって\n家族面しないでね", "kind": "丸", "ch": "承", "kg": "", "src": "a/381.mp3"}, {"no": 382, "sp": "莉子", "text": "中卒のお兄ちゃんとは\n生きてる世界が\n違うの", "kind": "丸", "ch": "承", "kg": "", "src": "a/382.mp3"}, {"no": 383, "sp": "主人公", "text": "莉子", "kind": "丸", "ch": "承", "kg": "", "src": "a/383.mp3"}, {"no": 384, "sp": "主人公", "text": "相手の人のことは、\n大事にしろよ", "kind": "丸", "ch": "承", "kg": "", "src": "a/384.mp3"}, {"no": 385, "sp": "莉子", "text": "は？", "kind": "丸", "ch": "承", "kg": "", "src": "a/385.mp3"}, {"no": 386, "sp": "莉子", "text": "何それ。\nお兄ちゃんに\n言われたくない", "kind": "丸", "ch": "承", "kg": "", "src": "a/386.mp3"}, {"no": 387, "sp": "莉子", "text": "彼のこと、\n何も知らないくせに", "kind": "丸", "ch": "承", "kg": "", "src": "a/387.mp3"}, {"no": 388, "sp": "主人公", "text": "言いたいことだけ\n言って、\n莉子は電話を切った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/388.mp3"}, {"no": 389, "sp": "主人公", "text": "俺はしばらく、\n暗くなった画面を\n見ていた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/389.mp3"}, {"no": 390, "sp": "主人公", "text": "それから、\nクローゼットの\n扉を開ける。", "kind": "四角", "ch": "承", "kg": "", "src": "a/390.mp3"}, {"no": 391, "sp": "主人公", "text": "一番いいスーツを\n出して、\nハンガーに掛けた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/391.mp3"}, {"no": 392, "sp": "主人公", "text": "祝儀袋には、\n新札を入れておく。", "kind": "四角", "ch": "承", "kg": "", "src": "a/392.mp3"}, {"no": 393, "sp": "主人公", "text": "式の前の晩。", "kind": "四角", "ch": "承", "kg": "", "src": "a/393.mp3"}, {"no": 394, "sp": "主人公", "text": "机の上には、\n書き上げた\n主賓の挨拶がある。", "kind": "四角", "ch": "承", "kg": "", "src": "a/394.mp3"}, {"no": 395, "sp": "主人公", "text": "拓海が新人だった頃の\n話を入れるか、\n何度も迷った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/395.mp3"}, {"no": 396, "sp": "主人公", "text": "結局、\n土の話は\n書かなかった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/396.mp3"}, {"no": 397, "sp": "主人公", "text": "あれは、\n拓海が自分で\n話せばいい。", "kind": "四角", "ch": "承", "kg": "", "src": "a/397.mp3"}, {"no": 398, "sp": "主人公", "text": "読み返していると、\n拓海から\nLINEが届いた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/398.mp3"}, {"no": 399, "sp": "拓海", "text": "明日、社長の挨拶の\nあとで、", "kind": "丸", "ch": "承", "kg": "", "src": "a/399.mp3"}, {"no": 400, "sp": "拓海", "text": "莉子さんに\n全部話します", "kind": "丸", "ch": "承", "kg": "", "src": "a/400.mp3"}, {"no": 401, "sp": "主人公", "text": "莉子を頼む", "kind": "丸", "ch": "承", "kg": "", "src": "a/401.mp3"}, {"no": 402, "sp": "主人公", "text": "送ってから、\nふと気づく。", "kind": "四角", "ch": "承", "kg": "", "src": "a/402.mp3"}, {"no": 403, "sp": "主人公", "text": "莉子の兄らしいことを\nしたのは、\nこれが初めてだった。", "kind": "四角", "ch": "承", "kg": "", "src": "a/403.mp3"}, {"no": 404, "sp": "主人公", "text": "既読は、\nすぐに付いた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/404.mp3"}, {"no": 405, "sp": "拓海", "text": "任せてください", "kind": "丸", "ch": "承", "kg": "", "src": "a/405.mp3"}, {"no": 406, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "承", "kg": "", "wait": 0.8}, {"no": 407, "sp": "主人公", "text": "式の当日の朝。", "kind": "四角", "ch": "承", "kg": "", "src": "a/407.mp3"}, {"no": 408, "sp": "主人公", "text": "俺は佳代おばさんに、\nLINEを送った。", "kind": "四角", "ch": "承", "kg": "", "src": "a/408.mp3"}, {"no": 409, "sp": "主人公", "text": "今から行く", "kind": "丸", "ch": "承", "kg": "", "src": "a/409.mp3"}, {"no": 410, "sp": "主人公", "text": "返事は、すぐに来た。", "kind": "四角", "ch": "承", "kg": "", "src": "a/410.mp3"}, {"no": 411, "sp": "佳代", "text": "親族の控室で\n待ってる", "kind": "丸", "ch": "承", "kg": "", "src": "a/411.mp3"}, {"no": 412, "sp": "佳代", "text": "じいちゃんも一緒よ", "kind": "丸", "ch": "承", "kg": "", "src": "a/412.mp3"}, {"no": 413, "sp": "佳代", "text": "スーツ、\nちゃんとアイロン\nかけた？", "kind": "丸", "ch": "承", "kg": "", "src": "a/413.mp3"}, {"no": 414, "sp": "主人公", "text": "かけた", "kind": "丸", "ch": "承", "kg": "", "src": "a/414.mp3"}, {"no": 415, "sp": "佳代", "text": "よろしい", "kind": "丸", "ch": "承", "kg": "", "src": "a/415.mp3"}, {"no": 416, "sp": "主人公", "text": "式場は、\n駅前のホテルだ。", "kind": "四角", "ch": "承", "kg": "", "src": "a/416.mp3"}, {"no": 417, "sp": "主人公", "text": "駐車場に車を止めて、\nミラーで\nネクタイを直す。", "kind": "四角", "ch": "承", "kg": "", "src": "a/417.mp3"}, {"no": 418, "sp": "主人公", "text": "式場に着くと、\n俺は新郎側の受付で\n名前を書いた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/418.mp3"}, {"no": 419, "sp": "主人公", "text": "受付には、\nうちの事務の子が\n座っている。", "kind": "四角", "ch": "承", "kg": "", "src": "a/419.mp3"}, {"no": 420, "sp": "社員", "text": "社長、\nおはようございます", "kind": "丸", "ch": "承", "kg": "", "src": "a/420.mp3"}, {"no": 421, "sp": "社員", "text": "これ、\n主賓の方の札です", "kind": "丸", "ch": "承", "kg": "", "src": "a/421.mp3"}, {"no": 422, "sp": "主人公", "text": "事務の子が、\n胸に付ける札を\n渡してくれる。", "kind": "四角", "ch": "承", "kg": "", "src": "a/422.mp3"}, {"no": 423, "sp": "主人公", "text": "札には、\n主賓と書かれていた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/423.mp3"}, {"no": 424, "sp": "主人公", "text": "俺はそれを、\nスーツの胸に付けた。", "kind": "四角", "ch": "承", "kg": "", "src": "a/424.mp3"}, {"no": 425, "sp": "ブラックアウト", "text": "", "kind": "", "ch": "承", "kg": "", "wait": 0.8}, {"no": 426, "sp": "主人公", "text": "今日の式は、\n披露宴の会場で、\n人前式から始まる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/426.mp3"}, {"no": 427, "sp": "主人公", "text": "始まるまで、\nあと30分ある。", "kind": "四角", "ch": "転", "kg": "", "src": "a/427.mp3"}, {"no": 428, "sp": "主人公", "text": "ロビーの天井には、\n大きな照明が\n並んでいた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/428.mp3"}, {"no": 429, "sp": "主人公", "text": "招待客は、\nウェルカムドリンクを\n片手に話している。", "kind": "四角", "ch": "転", "kg": "", "src": "a/429.mp3"}, {"no": 430, "sp": "主人公", "text": "奥のほうから、\nピアノの曲が\n小さく聞こえてくる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/430.mp3"}, {"no": 431, "sp": "主人公", "text": "新郎側の輪には、\nうちの社員も\n10人ほどいる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/431.mp3"}, {"no": 432, "sp": "主人公", "text": "みんな見慣れない\nスーツ姿で、\nどこか落ち着かない。", "kind": "四角", "ch": "転", "kg": "", "src": "a/432.mp3"}, {"no": 433, "sp": "主人公", "text": "職長の柴田さんが、\n俺に気づいて\n小さく手を上げた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/433.mp3"}, {"no": 434, "sp": "柴田", "text": "社長、\nおはようございます", "kind": "丸", "ch": "転", "kg": "", "src": "a/434.mp3"}, {"no": 435, "sp": "柴田", "text": "今日は、\nよろしくお願いします", "kind": "丸", "ch": "転", "kg": "", "src": "a/435.mp3"}, {"no": 436, "sp": "主人公", "text": "ああ。\nよろしく", "kind": "丸", "ch": "転", "kg": "", "src": "a/436.mp3"}, {"no": 437, "sp": "柴田", "text": "所長、朝から\nずっとそわそわ\nしてますよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/437.mp3"}, {"no": 438, "sp": "柴田", "text": "さっきも、\n控室の前を\n行ったり来たりで", "kind": "丸", "ch": "転", "kg": "", "src": "a/438.mp3"}, {"no": 439, "sp": "主人公", "text": "あいつらしいな", "kind": "丸", "ch": "転", "kg": "", "src": "a/439.mp3"}, {"no": 440, "sp": "柴田", "text": "昨日も、\n夜まで現場に\n残ってたんですよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/440.mp3"}, {"no": 441, "sp": "柴田", "text": "式の前の日くらい、\n休めって\n言ったんですけどね", "kind": "丸", "ch": "転", "kg": "", "src": "a/441.mp3"}, {"no": 442, "sp": "主人公", "text": "俺も言った", "kind": "丸", "ch": "転", "kg": "", "src": "a/442.mp3"}, {"no": 443, "sp": "主人公", "text": "聞くやつじゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/443.mp3"}, {"no": 444, "sp": "主人公", "text": "柴田さんが、\n声を出して笑う。", "kind": "四角", "ch": "転", "kg": "", "src": "a/444.mp3"}, {"no": 445, "sp": "社員", "text": "社長のネクタイ、\n初めて見ました", "kind": "丸", "ch": "転", "kg": "", "src": "a/445.mp3"}, {"no": 446, "sp": "社員", "text": "現場の社長しか、\n知らないんで", "kind": "丸", "ch": "転", "kg": "", "src": "a/446.mp3"}, {"no": 447, "sp": "主人公", "text": "俺もだ。\n首が苦しい", "kind": "丸", "ch": "転", "kg": "", "src": "a/447.mp3"}, {"no": 448, "sp": "主人公", "text": "社員たちが、\n声を抑えて笑った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/448.mp3"}, {"no": 449, "sp": "柴田", "text": "挨拶、\n楽しみにしてます", "kind": "丸", "ch": "転", "kg": "", "src": "a/449.mp3"}, {"no": 450, "sp": "柴田", "text": "所長、社長の挨拶で\n泣くんじゃないですか", "kind": "丸", "ch": "転", "kg": "", "src": "a/450.mp3"}, {"no": 451, "sp": "主人公", "text": "泣かせる気はない", "kind": "丸", "ch": "転", "kg": "", "src": "a/451.mp3"}, {"no": 452, "sp": "柴田", "text": "どうだか", "kind": "丸", "ch": "転", "kg": "", "src": "a/452.mp3"}, {"no": 453, "sp": "主人公", "text": "柴田さんは、\n俺の胸の札を見て、\nにやりと笑った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/453.mp3"}, {"no": 454, "sp": "主人公", "text": "内ポケットには、\n昨日の夜に書いた\n挨拶の紙がある。", "kind": "四角", "ch": "転", "kg": "", "src": "a/454.mp3"}, {"no": 455, "sp": "主人公", "text": "何度も書き直して、\n結局、短くなった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/455.mp3"}, {"no": 456, "sp": "主人公", "text": "拓海に\n言いたいことは、\nそれで足りる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/456.mp3"}, {"no": 457, "sp": "主人公", "text": "そのとき、\nロビーの奥が\nにぎやかになった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/457.mp3"}, {"no": 458, "sp": "主人公", "text": "ドレス姿の莉子が、\n招待客に挨拶をして\n回っている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/458.mp3"}, {"no": 459, "sp": "主人公", "text": "莉子の友人たちが、\nスマホを向けて\nはしゃいでいた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/459.mp3"}, {"no": 460, "sp": "莉子の友人", "text": "莉子、\nめっちゃきれい", "kind": "丸", "ch": "転", "kg": "", "src": "a/460.mp3"}, {"no": 461, "sp": "莉子の友人", "text": "ドレス、すごいね。\nいくらしたの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/461.mp3"}, {"no": 462, "sp": "莉子", "text": "内緒", "kind": "丸", "ch": "転", "kg": "", "src": "a/462.mp3"}, {"no": 463, "sp": "莉子", "text": "でも、\nいいやつにしたの", "kind": "丸", "ch": "転", "kg": "", "src": "a/463.mp3"}, {"no": 464, "sp": "莉子の友人", "text": "旦那さんは、\nどこ？", "kind": "丸", "ch": "転", "kg": "", "src": "a/464.mp3"}, {"no": 465, "sp": "莉子", "text": "今、控室。\nもうすぐ来るよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/465.mp3"}, {"no": 466, "sp": "莉子の友人", "text": "先生の家に\nお嫁に行くんでしょ？", "kind": "丸", "ch": "転", "kg": "", "src": "a/466.mp3"}, {"no": 467, "sp": "莉子の友人", "text": "すごいじゃん", "kind": "丸", "ch": "転", "kg": "", "src": "a/467.mp3"}, {"no": 468, "sp": "莉子", "text": "まあね", "kind": "丸", "ch": "転", "kg": "", "src": "a/468.mp3"}, {"no": 469, "sp": "主人公", "text": "莉子は、\n得意そうに笑った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/469.mp3"}, {"no": 470, "sp": "主人公", "text": "そのドレスの代金も、\n俺が振り込んだ\n600万の中にある。", "kind": "四角", "ch": "転", "kg": "", "src": "a/470.mp3"}, {"no": 471, "sp": "主人公", "text": "莉子は、\nそれを知らない。", "kind": "四角", "ch": "転", "kg": "", "src": "a/471.mp3"}, {"no": 472, "sp": "主人公", "text": "笑いながら、\n莉子がこちらを\n振り返る。", "kind": "四角", "ch": "転", "kg": "", "src": "a/472.mp3"}, {"no": 473, "sp": "主人公", "text": "俺の顔を\n見つけたとたん、\nその笑顔が消えた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/473.mp3"}, {"no": 474, "sp": "主人公", "text": "莉子は、近くの\nテーブルから、\nグラスを1つ取った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/474.mp3"}, {"no": 475, "sp": "主人公", "text": "赤ワインの入った\nグラスを持ったまま、\n俺の前に来る。", "kind": "四角", "ch": "転", "kg": "", "src": "a/475.mp3"}, {"no": 476, "sp": "莉子", "text": "中卒の兄は\n恥なんだから、", "kind": "丸", "ch": "転", "kg": "", "src": "a/476.mp3"}, {"no": 477, "sp": "莉子", "text": "消えたことに\nなってんのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/477.mp3"}, {"no": 478, "sp": "主人公", "text": "妹の莉子は笑って、\n俺の頭の上で\nグラスを傾けた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/478.mp3"}, {"no": 479, "sp": "主人公", "text": "赤ワインが\n髪を伝って、\n顎から落ちていく。", "kind": "四角", "ch": "転", "kg": "", "src": "a/479.mp3"}, {"no": 480, "sp": "主人公", "text": "招待客の何人かが、\nこちらを振り返った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/480.mp3"}, {"no": 481, "sp": "主人公", "text": "莉子は空になった\nグラスを、\n軽く振ってみせた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/481.mp3"}, {"no": 482, "sp": "莉子", "text": "結婚式、来るな", "kind": "丸", "ch": "転", "kg": "", "src": "a/482.mp3"}, {"no": 483, "sp": "主人公", "text": "ロビーがざわついた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/483.mp3"}, {"no": 484, "sp": "主人公", "text": "俺は肩に落ちた\n滴を払わずに、\n莉子の顔を見た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/484.mp3"}, {"no": 485, "sp": "主人公", "text": "わかった", "kind": "丸", "ch": "転", "kg": "", "src": "a/485.mp3"}, {"no": 486, "sp": "主人公", "text": "俺はそれだけ言って、\n出口に向かった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/486.mp3"}, {"no": 487, "sp": "主人公", "text": "出口の扉の前で、\n後ろを振り返る。", "kind": "四角", "ch": "転", "kg": "", "src": "a/487.mp3"}, {"no": 488, "sp": "主人公", "text": "新郎の拓海が、\n莉子の前に\n駆け込んできていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/488.mp3"}, {"no": 489, "sp": "主人公", "text": "拓海の目には、\n涙が浮かんでいる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/489.mp3"}, {"no": 490, "sp": "拓海", "text": "俺の命の恩人の\nお兄さん、", "kind": "丸", "ch": "転", "kg": "", "src": "a/490.mp3"}, {"no": 491, "sp": "拓海", "text": "亡くなったの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/491.mp3"}, {"no": 492, "sp": "主人公", "text": "莉子はグラスを\n持ったまま、\n拓海を見た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/492.mp3"}, {"no": 493, "sp": "莉子", "text": "え？", "kind": "丸", "ch": "転", "kg": "", "src": "a/493.mp3"}, {"no": 494, "sp": "主人公", "text": "拓海の涙を見て、\n分かった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/494.mp3"}, {"no": 495, "sp": "主人公", "text": "誰かが拓海に、\n俺はもういないと\n伝えたのだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/495.mp3"}, {"no": 496, "sp": "主人公", "text": "俺は胸の主賓の札を\n外して、\nポケットに入れた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/496.mp3"}, {"no": 497, "sp": "主人公", "text": "こんな格好で、\n拓海の前には\n出られない。", "kind": "四角", "ch": "転", "kg": "", "src": "a/497.mp3"}, {"no": 498, "sp": "主人公", "text": "今日は、\nあいつの晴れの日だ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/498.mp3"}, {"no": 499, "sp": "主人公", "text": "背中に、\n招待客の視線が\n刺さっている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/499.mp3"}, {"no": 500, "sp": "主人公", "text": "俺は扉を押して、\n外に出た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/500.mp3"}, {"no": 501, "sp": "主人公", "text": "式場の裏の、\n駐車場。", "kind": "四角", "ch": "転", "kg": "", "src": "a/501.mp3"}, {"no": 502, "sp": "主人公", "text": "秋の風が、\n濡れた髪に冷たい。", "kind": "四角", "ch": "転", "kg": "", "src": "a/502.mp3"}, {"no": 503, "sp": "主人公", "text": "自分の車の横で、\nハンカチを出して\n顔を拭く。", "kind": "四角", "ch": "転", "kg": "", "src": "a/503.mp3"}, {"no": 504, "sp": "主人公", "text": "白いハンカチが、\nすぐに赤く染まった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/504.mp3"}, {"no": 505, "sp": "主人公", "text": "シャツの襟まで、\nワインが\nしみ込んでいる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/505.mp3"}, {"no": 506, "sp": "主人公", "text": "内ポケットの\n挨拶の紙も、\n端が濡れていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/506.mp3"}, {"no": 507, "sp": "主人公", "text": "紙を広げかけて、\nやめる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/507.mp3"}, {"no": 508, "sp": "主人公", "text": "車のドアに\n手をかけたとき、\n後ろから声がした。", "kind": "四角", "ch": "転", "kg": "", "src": "a/508.mp3"}, {"no": 509, "sp": "柴田", "text": "社長！", "kind": "丸", "ch": "転", "kg": "", "src": "a/509.mp3"}, {"no": 510, "sp": "主人公", "text": "柴田さんが、\nロビーから\n走ってきていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/510.mp3"}, {"no": 511, "sp": "柴田", "text": "大丈夫ですか", "kind": "丸", "ch": "転", "kg": "", "src": "a/511.mp3"}, {"no": 512, "sp": "柴田", "text": "あの新婦、\n社長に何てことを……", "kind": "丸", "ch": "転", "kg": "", "src": "a/512.mp3"}, {"no": 513, "sp": "主人公", "text": "柴田さんは、\n自分の上着を\n脱ごうとした。", "kind": "四角", "ch": "転", "kg": "", "src": "a/513.mp3"}, {"no": 514, "sp": "主人公", "text": "いい", "kind": "丸", "ch": "転", "kg": "", "src": "a/514.mp3"}, {"no": 515, "sp": "主人公", "text": "お前は中にいろ", "kind": "丸", "ch": "転", "kg": "", "src": "a/515.mp3"}, {"no": 516, "sp": "主人公", "text": "所長の式だ", "kind": "丸", "ch": "転", "kg": "", "src": "a/516.mp3"}, {"no": 517, "sp": "柴田", "text": "でも、社長", "kind": "丸", "ch": "転", "kg": "", "src": "a/517.mp3"}, {"no": 518, "sp": "柴田", "text": "あんなの、\n黙って見て\nられませんよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/518.mp3"}, {"no": 519, "sp": "柴田", "text": "俺、今から戻って、\nひとこと\n言ってきます", "kind": "丸", "ch": "転", "kg": "", "src": "a/519.mp3"}, {"no": 520, "sp": "主人公", "text": "やめろ", "kind": "丸", "ch": "転", "kg": "", "src": "a/520.mp3"}, {"no": 521, "sp": "主人公", "text": "拓海の顔を\nつぶす気か", "kind": "丸", "ch": "転", "kg": "", "src": "a/521.mp3"}, {"no": 522, "sp": "主人公", "text": "柴田さんは、\n拳を握ったまま\n立ち止まった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/522.mp3"}, {"no": 523, "sp": "柴田", "text": "……なんで、\n何も言わなかった\nんですか", "kind": "丸", "ch": "転", "kg": "", "src": "a/523.mp3"}, {"no": 524, "sp": "主人公", "text": "言うことがない", "kind": "丸", "ch": "転", "kg": "", "src": "a/524.mp3"}, {"no": 525, "sp": "柴田", "text": "8年前、\n俺もあの現場に\nいました", "kind": "丸", "ch": "転", "kg": "", "src": "a/525.mp3"}, {"no": 526, "sp": "柴田", "text": "社長が素手で\n土を掘ってたの、\n今でも覚えてます", "kind": "丸", "ch": "転", "kg": "", "src": "a/526.mp3"}, {"no": 527, "sp": "柴田", "text": "そういう人が、\nなんで黙って\nワインなんか……", "kind": "丸", "ch": "転", "kg": "", "src": "a/527.mp3"}, {"no": 528, "sp": "主人公", "text": "今日は、\n拓海の式だ", "kind": "丸", "ch": "転", "kg": "", "src": "a/528.mp3"}, {"no": 529, "sp": "主人公", "text": "俺が騒いでいい\n日じゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/529.mp3"}, {"no": 530, "sp": "主人公", "text": "柴田さんは、\n唇をかんで\nうつむいた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/530.mp3"}, {"no": 531, "sp": "柴田", "text": "あの人、\n社長の知り合い\nなんですか？", "kind": "丸", "ch": "転", "kg": "", "src": "a/531.mp3"}, {"no": 532, "sp": "主人公", "text": "……妹だ", "kind": "丸", "ch": "転", "kg": "", "src": "a/532.mp3"}, {"no": 533, "sp": "主人公", "text": "柴田さんの手が、\n上着のボタンで\n止まった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/533.mp3"}, {"no": 534, "sp": "柴田", "text": "妹さん……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/534.mp3"}, {"no": 535, "sp": "柴田", "text": "じゃあ、\n所長の嫁さんが、\n社長の……", "kind": "丸", "ch": "転", "kg": "", "src": "a/535.mp3"}, {"no": 536, "sp": "主人公", "text": "ああ", "kind": "丸", "ch": "転", "kg": "", "src": "a/536.mp3"}, {"no": 537, "sp": "柴田", "text": "所長は、\n知ってるんですか？", "kind": "丸", "ch": "転", "kg": "", "src": "a/537.mp3"}, {"no": 538, "sp": "主人公", "text": "知ってる", "kind": "丸", "ch": "転", "kg": "", "src": "a/538.mp3"}, {"no": 539, "sp": "主人公", "text": "知らないのは、\n莉子のほうだ", "kind": "丸", "ch": "転", "kg": "", "src": "a/539.mp3"}, {"no": 540, "sp": "主人公", "text": "柴田さんは、\n何か言いかけて、\n口を閉じた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/540.mp3"}, {"no": 541, "sp": "主人公", "text": "ポケットのスマホが、\nさっきから\n震え続けている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/541.mp3"}, {"no": 542, "sp": "主人公", "text": "画面を見ると、\n拓海からの着信が\n3件入っていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/542.mp3"}, {"no": 543, "sp": "主人公", "text": "かけ直そうとした\nそのとき、", "kind": "四角", "ch": "転", "kg": "", "src": "a/543.mp3"}, {"no": 544, "sp": "主人公", "text": "タキシードの拓海が、\n駐車場に\n走ってきた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/544.mp3"}, {"no": 545, "sp": "主人公", "text": "息を切らした拓海は、\n俺の顔を見るなり、\nしゃがみ込んだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/545.mp3"}, {"no": 546, "sp": "拓海", "text": "生きてた……", "kind": "丸", "ch": "転", "kg": "", "src": "a/546.mp3"}, {"no": 547, "sp": "拓海", "text": "よかった……", "kind": "丸", "ch": "転", "kg": "", "src": "a/547.mp3"}, {"no": 548, "sp": "拓海", "text": "本当に、\nよかった……", "kind": "丸", "ch": "転", "kg": "", "src": "a/548.mp3"}, {"no": 549, "sp": "主人公", "text": "おい。\nタキシードが\n汚れるぞ", "kind": "丸", "ch": "転", "kg": "", "src": "a/549.mp3"}, {"no": 550, "sp": "主人公", "text": "拓海は膝に\n手をついたまま、\n肩で息をしている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/550.mp3"}, {"no": 551, "sp": "主人公", "text": "髪は乱れて、\nネクタイも\n曲がっていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/551.mp3"}, {"no": 552, "sp": "主人公", "text": "何があった？", "kind": "丸", "ch": "転", "kg": "", "src": "a/552.mp3"}, {"no": 553, "sp": "拓海", "text": "さっき控室で、\n母から聞いたんです", "kind": "丸", "ch": "転", "kg": "", "src": "a/553.mp3"}, {"no": 554, "sp": "拓海", "text": "新婦のお兄さんは\nご病気で、\nもういないって", "kind": "丸", "ch": "転", "kg": "", "src": "a/554.mp3"}, {"no": 555, "sp": "拓海", "text": "莉子さんの\nお母さんから、\nそう聞いたって", "kind": "丸", "ch": "転", "kg": "", "src": "a/555.mp3"}, {"no": 556, "sp": "拓海", "text": "俺、頭が\n真っ白になって", "kind": "丸", "ch": "転", "kg": "", "src": "a/556.mp3"}, {"no": 557, "sp": "拓海", "text": "社長に何か\nあったのかと思って、", "kind": "丸", "ch": "転", "kg": "", "src": "a/557.mp3"}, {"no": 558, "sp": "拓海", "text": "何度も電話したのに、\n出なくて", "kind": "丸", "ch": "転", "kg": "", "src": "a/558.mp3"}, {"no": 559, "sp": "主人公", "text": "……悪い。\n気づかなかった", "kind": "丸", "ch": "転", "kg": "", "src": "a/559.mp3"}, {"no": 560, "sp": "拓海", "text": "そしたら、\nロビーのほうで、\n騒ぎが聞こえて", "kind": "丸", "ch": "転", "kg": "", "src": "a/560.mp3"}, {"no": 561, "sp": "拓海", "text": "莉子さんに\n聞いたら、", "kind": "丸", "ch": "転", "kg": "", "src": "a/561.mp3"}, {"no": 562, "sp": "拓海", "text": "兄なら、\n今追い返したって", "kind": "丸", "ch": "転", "kg": "", "src": "a/562.mp3"}, {"no": 563, "sp": "拓海", "text": "消えたことに\nしてるのって……", "kind": "丸", "ch": "転", "kg": "", "src": "a/563.mp3"}, {"no": 564, "sp": "拓海", "text": "笑いながら、\nそう言ったんです", "kind": "丸", "ch": "転", "kg": "", "src": "a/564.mp3"}, {"no": 565, "sp": "主人公", "text": "拓海は、拳で\n地面を叩いた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/565.mp3"}, {"no": 566, "sp": "拓海", "text": "すみません", "kind": "丸", "ch": "転", "kg": "", "src": "a/566.mp3"}, {"no": 567, "sp": "拓海", "text": "俺が先に、\n莉子さんに\n話していれば", "kind": "丸", "ch": "転", "kg": "", "src": "a/567.mp3"}, {"no": 568, "sp": "拓海", "text": "こんなことには\nならなかった", "kind": "丸", "ch": "転", "kg": "", "src": "a/568.mp3"}, {"no": 569, "sp": "主人公", "text": "拓海の目から、\n涙が落ちる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/569.mp3"}, {"no": 570, "sp": "主人公", "text": "拓海が泣くのを\n見るのは、\nあの土の中以来だ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/570.mp3"}, {"no": 571, "sp": "主人公", "text": "8年前のあの日は、\n朝から雨だった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/571.mp3"}, {"no": 572, "sp": "主人公", "text": "新人の拓海は、\n掘った溝の底で、\n配管を確かめている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/572.mp3"}, {"no": 573, "sp": "主人公", "text": "土が崩れる音がして、\n振り返ったときには、\n溝がふさがっていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/573.mp3"}, {"no": 574, "sp": "主人公", "text": "崩れた土から、\n拓海の手だけが\n出ていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/574.mp3"}, {"no": 575, "sp": "主人公", "text": "重機を待つ\n時間はない。", "kind": "四角", "ch": "転", "kg": "", "src": "a/575.mp3"}, {"no": 576, "sp": "主人公", "text": "俺は素手で、\n夢中で土をかいた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/576.mp3"}, {"no": 577, "sp": "主人公", "text": "掘り出した拓海は、\n子どものように\n泣きじゃくっていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/577.mp3"}, {"no": 578, "sp": "主人公", "text": "目の前の拓海は、\nあのときと\n同じ顔をしている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/578.mp3"}, {"no": 579, "sp": "主人公", "text": "俺は拓海の腕を\n引いて、\n立たせた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/579.mp3"}, {"no": 580, "sp": "主人公", "text": "お前が\n謝ることじゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/580.mp3"}, {"no": 581, "sp": "主人公", "text": "立て", "kind": "丸", "ch": "転", "kg": "", "src": "a/581.mp3"}, {"no": 582, "sp": "主人公", "text": "お前の結婚式だろ", "kind": "丸", "ch": "転", "kg": "", "src": "a/582.mp3"}, {"no": 583, "sp": "拓海", "text": "社長……", "kind": "丸", "ch": "転", "kg": "", "src": "a/583.mp3"}, {"no": 584, "sp": "拓海", "text": "一緒に\n戻ってください", "kind": "丸", "ch": "転", "kg": "", "src": "a/584.mp3"}, {"no": 585, "sp": "拓海", "text": "社長がどんな人か、\n俺の口から、\n莉子さんに話します", "kind": "丸", "ch": "転", "kg": "", "src": "a/585.mp3"}, {"no": 586, "sp": "主人公", "text": "俺は、ワインで濡れた\nシャツを見下ろした。", "kind": "四角", "ch": "転", "kg": "", "src": "a/586.mp3"}, {"no": 587, "sp": "主人公", "text": "この格好でか？", "kind": "丸", "ch": "転", "kg": "", "src": "a/587.mp3"}, {"no": 588, "sp": "主人公", "text": "式が\nめちゃくちゃになるぞ", "kind": "丸", "ch": "転", "kg": "", "src": "a/588.mp3"}, {"no": 589, "sp": "拓海", "text": "もう、\nなってます", "kind": "丸", "ch": "転", "kg": "", "src": "a/589.mp3"}, {"no": 590, "sp": "主人公", "text": "拓海は、\n涙を拭いて笑った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/590.mp3"}, {"no": 591, "sp": "拓海", "text": "社長を追い返した\n式なんて、", "kind": "丸", "ch": "転", "kg": "", "src": "a/591.mp3"}, {"no": 592, "sp": "拓海", "text": "挙げても\n意味がないです", "kind": "丸", "ch": "転", "kg": "", "src": "a/592.mp3"}, {"no": 593, "sp": "拓海", "text": "社長が\nいない式で、\n俺は誓えません", "kind": "丸", "ch": "転", "kg": "", "src": "a/593.mp3"}, {"no": 594, "sp": "主人公", "text": "柴田さんが、\n黙って俺の肩に\n上着をかけた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/594.mp3"}, {"no": 595, "sp": "柴田", "text": "社長、\n所長のこと", "kind": "丸", "ch": "転", "kg": "", "src": "a/595.mp3"}, {"no": 596, "sp": "柴田", "text": "見届けて\nやってください", "kind": "丸", "ch": "転", "kg": "", "src": "a/596.mp3"}, {"no": 597, "sp": "柴田", "text": "俺らも、\n一緒に行きますから", "kind": "丸", "ch": "転", "kg": "", "src": "a/597.mp3"}, {"no": 598, "sp": "主人公", "text": "俺は少し迷ってから、\n柴田さんの上着に\n袖を通した。", "kind": "四角", "ch": "転", "kg": "", "src": "a/598.mp3"}, {"no": 599, "sp": "主人公", "text": "袖が、\n少し短い。", "kind": "四角", "ch": "転", "kg": "", "src": "a/599.mp3"}, {"no": 600, "sp": "柴田", "text": "ちょっと、\n小さいっすね", "kind": "丸", "ch": "転", "kg": "", "src": "a/600.mp3"}, {"no": 601, "sp": "主人公", "text": "十分だ", "kind": "丸", "ch": "転", "kg": "", "src": "a/601.mp3"}, {"no": 602, "sp": "主人公", "text": "3人で、\nロビーに戻る。", "kind": "四角", "ch": "転", "kg": "", "src": "a/602.mp3"}, {"no": 603, "sp": "主人公", "text": "ロビーには、\nさっきより人が\n増えていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/603.mp3"}, {"no": 604, "sp": "主人公", "text": "床の赤い染みは、\nもう拭かれている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/604.mp3"}, {"no": 605, "sp": "主人公", "text": "莉子は招待客の前で、\n困ったように\n笑っていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/605.mp3"}, {"no": 606, "sp": "莉子", "text": "ごめんなさい、\n変な人が\n紛れ込んでて", "kind": "丸", "ch": "転", "kg": "", "src": "a/606.mp3"}, {"no": 607, "sp": "莉子", "text": "もう帰ったから、\n大丈夫です", "kind": "丸", "ch": "転", "kg": "", "src": "a/607.mp3"}, {"no": 608, "sp": "招待客", "text": "びっくりしたわね", "kind": "丸", "ch": "転", "kg": "", "src": "a/608.mp3"}, {"no": 609, "sp": "招待客", "text": "どなただったの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/609.mp3"}, {"no": 610, "sp": "莉子", "text": "知らない人です", "kind": "丸", "ch": "転", "kg": "", "src": "a/610.mp3"}, {"no": 611, "sp": "莉子", "text": "たまに、\nいるんですって。\n式場に入り込む人", "kind": "丸", "ch": "転", "kg": "", "src": "a/611.mp3"}, {"no": 612, "sp": "招待客", "text": "警備の人、\n呼ばなくていいの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/612.mp3"}, {"no": 613, "sp": "莉子", "text": "大丈夫です。\nもう外に\n出ていったので", "kind": "丸", "ch": "転", "kg": "", "src": "a/613.mp3"}, {"no": 614, "sp": "主人公", "text": "莉子は、そう言って\n手を振った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/614.mp3"}, {"no": 615, "sp": "主人公", "text": "そこで、\n俺たちに気づいた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/615.mp3"}, {"no": 616, "sp": "莉子", "text": "……なんで", "kind": "丸", "ch": "転", "kg": "", "src": "a/616.mp3"}, {"no": 617, "sp": "莉子", "text": "なんで、\nまた来るのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/617.mp3"}, {"no": 618, "sp": "主人公", "text": "莉子は顔をしかめて、\n拓海の腕を\n取ろうとした。", "kind": "四角", "ch": "転", "kg": "", "src": "a/618.mp3"}, {"no": 619, "sp": "莉子", "text": "拓海、\n行こう", "kind": "丸", "ch": "転", "kg": "", "src": "a/619.mp3"}, {"no": 620, "sp": "莉子", "text": "あの人に、\n構わなくていいから", "kind": "丸", "ch": "転", "kg": "", "src": "a/620.mp3"}, {"no": 621, "sp": "莉子", "text": "係の人に言って、\n外に出してもらう", "kind": "丸", "ch": "転", "kg": "", "src": "a/621.mp3"}, {"no": 622, "sp": "主人公", "text": "拓海は、\nその手を外した。", "kind": "四角", "ch": "転", "kg": "", "src": "a/622.mp3"}, {"no": 623, "sp": "主人公", "text": "莉子の手が、\n宙で止まる。", "kind": "四角", "ch": "転", "kg": "", "src": "a/623.mp3"}, {"no": 624, "sp": "拓海", "text": "莉子", "kind": "丸", "ch": "転", "kg": "", "src": "a/624.mp3"}, {"no": 625, "sp": "拓海", "text": "この人は、\n俺の会社の社長だ", "kind": "丸", "ch": "転", "kg": "", "src": "a/625.mp3"}, {"no": 626, "sp": "拓海", "text": "8年前、\n土に埋まった俺を", "kind": "丸", "ch": "転", "kg": "", "src": "a/626.mp3"}, {"no": 627, "sp": "拓海", "text": "素手で\n掘り出してくれた", "kind": "丸", "ch": "転", "kg": "", "src": "a/627.mp3"}, {"no": 628, "sp": "拓海", "text": "俺の、\n命の恩人だ", "kind": "丸", "ch": "転", "kg": "", "src": "a/628.mp3"}, {"no": 629, "sp": "主人公", "text": "ロビーが、\nしんと静まった。", "kind": "四角", "ch": "転", "kg": "", "src": "a/629.mp3"}, {"no": 630, "sp": "主人公", "text": "ピアノの曲だけが、\n遠くで流れている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/630.mp3"}, {"no": 631, "sp": "主人公", "text": "莉子は、\n笑った顔のまま\n固まっていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/631.mp3"}, {"no": 632, "sp": "莉子", "text": "……は？", "kind": "丸", "ch": "転", "kg": "", "src": "a/632.mp3"}, {"no": 633, "sp": "主人公", "text": "莉子の頬が、\nひくりと動いた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/633.mp3"}, {"no": 634, "sp": "莉子", "text": "何言ってるの？", "kind": "丸", "ch": "転", "kg": "", "src": "a/634.mp3"}, {"no": 635, "sp": "莉子", "text": "兄は中卒の、\n現場の人よ", "kind": "丸", "ch": "転", "kg": "", "src": "a/635.mp3"}, {"no": 636, "sp": "莉子", "text": "社長なわけ\nないじゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/636.mp3"}, {"no": 637, "sp": "主人公", "text": "莉子の声が、\n少し裏返った。", "kind": "四角", "ch": "転", "kg": "", "src": "a/637.mp3"}, {"no": 638, "sp": "莉子", "text": "社長だったら、\nなんで作業着で\n実家に来るのよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/638.mp3"}, {"no": 639, "sp": "主人公", "text": "仕事帰りだからだ", "kind": "丸", "ch": "転", "kg": "", "src": "a/639.mp3"}, {"no": 640, "sp": "主人公", "text": "莉子は、\n俺をにらんだ。", "kind": "四角", "ch": "転", "kg": "", "src": "a/640.mp3"}, {"no": 641, "sp": "莉子", "text": "拓海、\nだまされてるんだって", "kind": "丸", "ch": "転", "kg": "", "src": "a/641.mp3"}, {"no": 642, "sp": "莉子", "text": "この人、\n昔から口だけは\nうまいんだから", "kind": "丸", "ch": "転", "kg": "", "src": "a/642.mp3"}, {"no": 643, "sp": "柴田", "text": "だまされてませんよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/643.mp3"}, {"no": 644, "sp": "主人公", "text": "柴田さんが、\n1歩前に出た。", "kind": "四角", "ch": "転", "kg": "", "src": "a/644.mp3"}, {"no": 645, "sp": "柴田", "text": "正岡建設の\n社長ですよ", "kind": "丸", "ch": "転", "kg": "", "src": "a/645.mp3"}, {"no": 646, "sp": "柴田", "text": "社員120人、\nみんなこの人に\n食わせてもらってます", "kind": "丸", "ch": "転", "kg": "", "src": "a/646.mp3"}, {"no": 647, "sp": "主人公", "text": "新郎側の輪から、\nうちの社員たちが\n出てきた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/647.mp3"}, {"no": 648, "sp": "社員", "text": "うちの社長です", "kind": "丸", "ch": "転", "kg": "", "src": "a/648.mp3"}, {"no": 649, "sp": "社員", "text": "毎朝、\n現場にも\n来てくれます", "kind": "丸", "ch": "転", "kg": "", "src": "a/649.mp3"}, {"no": 650, "sp": "社員", "text": "俺が怪我したとき、\n病院まで\n付き添ってくれました", "kind": "丸", "ch": "転", "kg": "", "src": "a/650.mp3"}, {"no": 651, "sp": "社員", "text": "雨の日は、\n社長が一番に\n現場を見に来るんです", "kind": "丸", "ch": "転", "kg": "", "src": "a/651.mp3"}, {"no": 652, "sp": "社員", "text": "給料が遅れたことも、\n一度もありません", "kind": "丸", "ch": "転", "kg": "", "src": "a/652.mp3"}, {"no": 653, "sp": "主人公", "text": "社員たちが、\n次々にうなずく。", "kind": "四角", "ch": "転", "kg": "", "src": "a/653.mp3"}, {"no": 654, "sp": "主人公", "text": "招待客の何人かが、\n俺と莉子を\n見比べていた。", "kind": "四角", "ch": "転", "kg": "", "src": "a/654.mp3"}, {"no": 655, "sp": "莉子の友人", "text": "え、\n社長……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/655.mp3"}, {"no": 656, "sp": "莉子の友人", "text": "莉子、\nお兄さんって\nいたっけ……？", "kind": "丸", "ch": "転", "kg": "", "src": "a/656.mp3"}, {"no": 657, "sp": "莉子の友人", "text": "一人っ子って、\n言ってなかった？", "kind": "丸", "ch": "転", "kg": "", "src": "a/657.mp3"}, {"no": 658, "sp": "莉子", "text": "そんなの、\n口で言ってる\nだけでしょ", "kind": "丸", "ch": "転", "kg": "", "src": "a/658.mp3"}, {"no": 659, "sp": "莉子", "text": "会社の人なら、\n社長の味方をするに\n決まってるじゃない", "kind": "丸", "ch": "転", "kg": "", "src": "a/659.mp3"}, {"no": 660, "sp": "主人公", "text": "柴田さんは黙って、\nスマホを取り出した。", "kind": "四角", "ch": "転", "kg": "", "src": "a/660.mp3"}, {"no": 661, "sp": "主人公", "text": "会社のホームページを\n開いて、\n莉子の前に出す。", "kind": "四角", "ch": "転", "kg": "", "src": "a/661.mp3"}, {"no": 662, "sp": "主人公", "text": "社長あいさつの欄に、\n作業着の俺の写真が\n載っている。", "kind": "四角", "ch": "転", "kg": "", "src": "a/662.mp3"}, {"no": 663, "sp": "主人公", "text": "写真の下には、\n代表取締役\n白木蓮とある。", "kind": "四角", "ch": "転", "kg": "", "src": "a/663.mp3"}, {"no": 664, "sp": "柴田", "text": "これでも、\n口だけですか？", "kind": "丸", "ch": "転", "kg":
